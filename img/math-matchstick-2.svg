<svg width="400" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="180" fill="#fef2f2" rx="10"/>
  <text x="200" y="30" font-family="Arial" font-size="18" fill="#991b1b" text-anchor="middle" font-weight="bold">火柴棒：图形的变幻</text>
  
  <g transform="translate(100, 60)">
    <!-- 两个正方形 -->
    <rect x="0" y="0" width="40" height="40" fill="none" stroke="#ef4444" stroke-width="3"/>
    <rect x="40" y="0" width="40" height="40" fill="none" stroke="#ef4444" stroke-width="3"/>
    
    <!-- 箭头 -->
    <path d="M 100 20 L 140 20" stroke="#991b1b" stroke-width="2" marker-end="url(#arrow-match-2)"/>
    
    <!-- 变成一个大长方形或更多 -->
    <g transform="translate(160, 0)">
      <rect x="0" y="0" width="80" height="40" fill="none" stroke="#ef4444" stroke-width="3"/>
      <text x="40" y="60" font-family="Arial" font-size="12" fill="#991b1b" text-anchor="middle">移动 1 根改变面积</text>
    </g>
  </g>
  
  <text x="200" y="160" font-family="Arial" font-size="14" fill="#991b1b" font-weight="bold">技巧：公用边是减少火柴的关键</text>

  <defs>
    <marker id="arrow-match-2" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#991b1b" />
    </marker>
  </defs>
</svg>

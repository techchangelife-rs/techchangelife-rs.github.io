<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f0fdf4" />
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="24" text-anchor="middle" fill="#166534" font-weight="bold">平均数：移多补少的艺术</text>
  
  <!-- Concept: Bar Chart before and after -->
  <g transform="translate(50, 80)">
    <text x="0" y="20" font-family="Arial" font-size="18" fill="#333" font-weight="bold">情况 A：原始高度 (3, 7, 5)</text>
    
    <rect x="50" y="100" width="40" height="30" fill="#86efac" transform="translate(0, -30)" />
    <text x="70" y="115" text-anchor="middle">3</text>
    
    <rect x="110" y="100" width="40" height="70" fill="#4ade80" transform="translate(0, -70)" />
    <text x="130" y="115" text-anchor="middle">7</text>
    
    <rect x="170" y="100" width="40" height="50" fill="#22c55e" transform="translate(0, -50)" />
    <text x="190" y="115" text-anchor="middle">5</text>
    
    <line x1="40" y1="100" x2="220" y2="100" stroke="#333" stroke-width="2" />
  </g>
  
  <!-- Movement Arrow -->
  <path d="M280,150 L320,150" stroke="#166534" stroke-width="3" marker-end="url(#arrow-green)" />
  <text x="300" y="130" text-anchor="middle" font-size="14" fill="#166534">移多补少</text>

  <!-- Situation B: Balanced -->
  <g transform="translate(350, 80)">
    <text x="0" y="20" font-family="Arial" font-size="18" fill="#333" font-weight="bold">情况 B：平均高度 (5, 5, 5)</text>
    
    <rect x="50" y="100" width="40" height="50" fill="#22c55e" transform="translate(0, -50)" />
    <rect x="110" y="100" width="40" height="50" fill="#22c55e" transform="translate(0, -50)" />
    <rect x="170" y="100" width="40" height="50" fill="#22c55e" transform="translate(0, -50)" />
    
    <line x1="40" y1="100" x2="220" y2="100" stroke="#333" stroke-width="2" />
    <line x1="40" y1="50" x2="220" y2="50" stroke="#e11d48" stroke-width="2" stroke-dasharray="5,5" />
    <text x="230" y="55" fill="#e11d48" font-size="14">平均数 = 5</text>
  </g>
  
  <!-- Formula Box -->
  <rect x="100" y="280" width="400" height="80" rx="10" fill="#fff" stroke="#166534" stroke-width="2" />
  <text x="300" y="315" text-anchor="middle" font-weight="bold" fill="#166534">平均数 = 总和 ÷ 总份数</text>
  <text x="300" y="345" text-anchor="middle" font-size="14">(3 + 7 + 5) ÷ 3 = 5</text>

  <!-- Definitions -->
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#166534" />
    </marker>
  </defs>
</svg>

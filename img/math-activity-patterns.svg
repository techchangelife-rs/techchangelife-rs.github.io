<svg width="400" height="150" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="150" fill="#e1f5fe" rx="10"/>
  
  <text x="200" y="30" font-family="Arial" font-size="16" fill="#01579B" text-anchor="middle" font-weight="bold">找规律：图形的舞步</text>
  
  <g transform="translate(40, 60)">
    <!-- 序列 1 -->
    <circle cx="20" cy="20" r="15" fill="#FF5252"/>
    <rect x="50" y="5" width="30" height="30" fill="#448AFF"/>
    <circle cx="100" cy="20" r="15" fill="#FF5252"/>
    <rect x="130" y="5" width="30" height="30" fill="#448AFF"/>
    <circle cx="180" cy="20" r="15" fill="#FF5252"/>
    
    <!-- 问号 -->
    <rect x="210" y="5" width="30" height="30" fill="none" stroke="#01579B" stroke-dasharray="4"/>
    <text x="225" y="25" font-family="Arial" font-size="20" fill="#01579B" text-anchor="middle">?</text>
    
    <!-- 提示 -->
    <text x="110" y="65" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">规律：一个圆，一个方...</text>
  </g>
</svg>

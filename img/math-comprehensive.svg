<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="200" fill="#f9f0ff" rx="10" ry="10"/>
  
  <!-- Central Node -->
  <circle cx="200" cy="100" r="40" fill="#722ed1" stroke="#531dab" stroke-width="2"/>
  <text x="200" y="105" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">奥数思维</text>
  
  <!-- Branches -->
  <line x1="160" y1="80" x2="100" y2="40" stroke="#722ed1" stroke-width="2"/>
  <text x="80" y="30" font-family="Arial" font-size="12" fill="#722ed1" text-anchor="middle">和差倍模型</text>
  
  <line x1="240" y1="80" x2="300" y2="40" stroke="#722ed1" stroke-width="2"/>
  <text x="320" y="30" font-family="Arial" font-size="12" fill="#722ed1" text-anchor="middle">鸡兔/盈亏</text>
  
  <line x1="160" y1="120" x2="100" y2="160" stroke="#722ed1" stroke-width="2"/>
  <text x="80" y="180" font-family="Arial" font-size="12" fill="#722ed1" text-anchor="middle">周期/还原</text>
  
  <line x1="240" y1="120" x2="300" y2="160" stroke="#722ed1" stroke-width="2"/>
  <text x="320" y="180" font-family="Arial" font-size="12" fill="#722ed1" text-anchor="middle">几何/逻辑</text>
  
  <!-- Icon Embellishments -->
  <rect x="70" y="35" width="20" height="10" fill="#efdbff" stroke="#722ed1" rx="2"/>
  <circle cx="320" cy="45" r="5" fill="#efdbff" stroke="#722ed1" />
  <path d="M 70 160 L 90 160 L 80 145 Z" fill="#efdbff" stroke="#722ed1" />
</svg>

<svg width="400" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="180" fill="#f8fafc" rx="10"/>
  <text x="200" y="30" font-family="Arial" font-size="18" fill="#1e293b" text-anchor="middle" font-weight="bold">方程初步：神秘的 X</text>
  
  <g transform="translate(100, 60)">
    <!-- 方程天平 -->
    <line x1="0" y1="60" x2="200" y2="60" stroke="#1e293b" stroke-width="4"/>
    <circle cx="100" cy="60" r="5" fill="#1e293b"/>
    
    <!-- 左边 -->
    <rect x="20" y="20" width="40" height="40" fill="#3b82f6" rx="5"/>
    <text x="40" y="45" font-family="Arial" font-size="20" fill="#fff" text-anchor="middle">x</text>
    <circle cx="80" cy="50" r="10" fill="#ef4444"/>
    <text x="80" y="55" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle">5</text>
    
    <!-- 等号 -->
    <text x="100" y="40" font-family="Arial" font-size="24" fill="#1e293b" text-anchor="middle">=</text>
    
    <!-- 右边 -->
    <circle cx="150" cy="50" r="10" fill="#ef4444"/>
    <text x="150" y="55" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle">15</text>
  </g>
  
  <text x="200" y="160" font-family="Arial" font-size="14" fill="#1e293b" font-weight="bold">方程：含有未知数的等式</text>
</svg>

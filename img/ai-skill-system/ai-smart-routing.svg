<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="500" fill="#f8f9fa" />
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#333">智能路由与成本优化流程 (Smart Routing &amp; Cost Optimization)</text>
  
  <!-- Step 1: Request -->
  <rect x="50" y="80" width="120" height="60" rx="10" fill="#fff" stroke="#FF4D94" stroke-width="2" />
  <text x="110" y="115" text-anchor="middle" font-family="Arial" font-size="14">用户请求</text>
  
  <!-- Step 2: Analysis -->
  <rect x="220" y="80" width="140" height="60" rx="10" fill="#fff" stroke="#00E5FF" stroke-width="2" />
  <text x="290" y="115" text-anchor="middle" font-family="Arial" font-size="14">任务复杂度分析</text>
  
  <!-- Step 3: Decision -->
  <polygon points="450,80 550,110 450,140 350,110" fill="#fff" stroke="#FFD700" stroke-width="2" />
  <text x="450" y="115" text-anchor="middle" font-family="Arial" font-size="12">成本 vs 性能?</text>
  
  <!-- Paths -->
  <!-- Path 1: High Complexity -->
  <rect x="600" y="50" width="150" height="40" rx="5" fill="#fef0f0" stroke="#F44336" stroke-width="1" />
  <text x="675" y="75" text-anchor="middle" font-family="Arial" font-size="12" fill="#F44336">GPT-4 / Claude 3.5</text>
  
  <!-- Path 2: Low Complexity -->
  <rect x="600" y="130" width="150" height="40" rx="5" fill="#f0f9eb" stroke="#4CAF50" stroke-width="1" />
  <text x="675" y="155" text-anchor="middle" font-family="Arial" font-size="12" fill="#4CAF50">GPT-3.5 / Gemini Flash</text>
  
  <!-- Caching -->
  <rect x="220" y="200" width="140" height="60" rx="10" fill="#fff" stroke="#9C27B0" stroke-width="2" />
  <text x="290" y="235" text-anchor="middle" font-family="Arial" font-size="14">请求缓存校验</text>
  
  <!-- Dashboard -->
  <rect x="50" y="320" width="700" height="150" rx="10" fill="#fff" stroke="#2196F3" stroke-width="2" />
  <text x="400" y="345" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#2196F3">成本分析仪表板 (Real-time Dashboard)</text>
  
  <!-- Mini Chart in Dashboard -->
  <rect x="100" y="360" width="600" height="90" rx="5" fill="#f0f7ff" />
  <polyline points="120,430 220,400 320,410 420,380 520,390 620,370" fill="none" stroke="#2196F3" stroke-width="3" />
  <text x="120" y="445" font-family="Arial" font-size="10">Jan</text>
  <text x="620" y="445" font-family="Arial" font-size="10">Now</text>
  
  <!-- Connectors -->
  <line x1="170" y1="110" x2="220" y2="110" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="360" y1="110" x2="400" y2="110" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="500" y1="110" x2="600" y2="70" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="500" y1="110" x2="600" y2="150" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="290" y1="140" x2="290" y2="200" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <!-- Background -->
  <rect width="600" height="300" fill="#fff7ed" />
  
  <!-- Restoration Flow -->
  <g transform="translate(50, 80)">
    <!-- Original Path -->
    <text x="0" y="20" font-family="Arial" font-size="16" fill="#c2410c" font-weight="bold">正向过程：</text>
    <rect x="100" y="0" width="40" height="40" fill="#fed7aa" stroke="#c2410c" />
    <text x="120" y="25" text-anchor="middle">?</text>
    
    <path d="M150,20 L190,20" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow-orange)" />
    <text x="170" y="15" text-anchor="middle" font-size="12">× 2</text>
    
    <rect x="200" y="0" width="40" height="40" fill="#fed7aa" stroke="#c2410c" />
    
    <path d="M250,20 L290,20" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow-orange)" />
    <text x="270" y="15" text-anchor="middle" font-size="12">+ 5</text>
    
    <rect x="300" y="0" width="40" height="40" fill="#fed7aa" stroke="#c2410c" />
    <text x="320" y="25" text-anchor="middle">15</text>
  </g>
  
  <!-- Inverse Path -->
  <g transform="translate(50, 180)">
    <text x="0" y="20" font-family="Arial" font-size="16" fill="#0369a1" font-weight="bold">还原过程：</text>
    
    <rect x="300" y="0" width="40" height="40" fill="#bae6fd" stroke="#0369a1" />
    <text x="320" y="25" text-anchor="middle">15</text>
    
    <path d="M290,20 L250,20" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow-blue)" />
    <text x="270" y="15" text-anchor="middle" font-size="12" fill="#0369a1">- 5</text>
    
    <rect x="200" y="0" width="40" height="40" fill="#bae6fd" stroke="#0369a1" />
    <text x="220" y="25" text-anchor="middle">10</text>
    
    <path d="M190,20 L150,20" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow-blue)" />
    <text x="170" y="15" text-anchor="middle" font-size="12" fill="#0369a1">÷ 2</text>
    
    <rect x="100" y="0" width="40" height="40" fill="#bae6fd" stroke="#0369a1" />
    <text x="120" y="25" text-anchor="middle">5</text>
  </g>

  <!-- Definitions -->
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#c2410c" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0369a1" />
    </marker>
  </defs>
</svg>

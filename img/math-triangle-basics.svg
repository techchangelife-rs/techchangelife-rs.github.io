<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="800" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">三角形分类与性质全解析</text>
  
  <!-- Section 1: Classification by Angles -->
  <g transform="translate(50, 80)">
    <rect width="340" height="340" rx="15" fill="#ffffff" stroke="#007bff" stroke-width="2" />
    <text x="170" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#007bff">按角分类 (By Angles)</text>
    
    <!-- Acute Triangle -->
    <g transform="translate(20, 50)">
      <path d="M 40 100 L 90 20 L 140 100 Z" fill="#e7f3ff" stroke="#007bff" stroke-width="2" />
      <text x="90" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">锐角三角形</text>
      <text x="90" y="135" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">三个角 &lt; 90°</text>
    </g>
    
    <!-- Right Triangle -->
    <g transform="translate(180, 50)">
      <path d="M 40 100 L 40 20 L 140 100 Z" fill="#e7f3ff" stroke="#007bff" stroke-width="2" />
      <rect x="40" y="90" width="10" height="10" fill="none" stroke="#007bff" stroke-width="1" />
      <text x="90" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">直角三角形</text>
      <text x="90" y="135" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">一个角 = 90°</text>
    </g>
    
    <!-- Obtuse Triangle -->
    <g transform="translate(100, 180)">
      <path d="M 20 100 L 70 60 L 160 100 Z" fill="#e7f3ff" stroke="#007bff" stroke-width="2" />
      <text x="90" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">钝角三角形</text>
      <text x="90" y="135" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">一个角 &gt; 90°</text>
    </g>
  </g>
  
  <!-- Section 2: Classification by Sides -->
  <g transform="translate(410, 80)">
    <rect width="340" height="340" rx="15" fill="#ffffff" stroke="#28a745" stroke-width="2" />
    <text x="170" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#28a745">按边分类 (By Sides)</text>
    
    <!-- Scalene Triangle -->
    <g transform="translate(20, 50)">
      <path d="M 30 100 L 80 20 L 150 100 Z" fill="#eef9f1" stroke="#28a745" stroke-width="2" />
      <text x="90" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">不等边三角形</text>
      <text x="90" y="135" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">三边各不相等</text>
    </g>
    
    <!-- Isosceles Triangle -->
    <g transform="translate(180, 50)">
      <path d="M 40 100 L 90 20 L 140 100 Z" fill="#eef9f1" stroke="#28a745" stroke-width="2" />
      <line x1="55" y1="60" x2="65" y2="60" stroke="#28a745" stroke-width="2" />
      <line x1="115" y1="60" x2="125" y2="60" stroke="#28a745" stroke-width="2" />
      <text x="90" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">等腰三角形</text>
      <text x="90" y="135" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">两边相等</text>
    </g>
    
    <!-- Equilateral Triangle -->
    <g transform="translate(100, 180)">
      <path d="M 40 100 L 90 13 L 140 100 Z" fill="#eef9f1" stroke="#28a745" stroke-width="2" />
      <line x1="55" y1="55" x2="65" y2="55" stroke="#28a745" stroke-width="2" />
      <line x1="115" y1="55" x2="125" y2="55" stroke="#28a745" stroke-width="2" />
      <line x1="85" y1="105" x2="95" y2="105" stroke="#28a745" stroke-width="2" />
      <text x="90" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">等边三角形</text>
      <text x="90" y="135" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">三边均相等 (60°)</text>
    </g>
  </g>
  
  <!-- Section 3: Interior & Exterior Angles -->
  <g transform="translate(50, 440)">
    <rect width="700" height="320" rx="15" fill="#ffffff" stroke="#6c757d" stroke-width="2" />
    <text x="350" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">核心性质图解 (Core Properties)</text>
    
    <!-- Angle Sum -->
    <g transform="translate(50, 60)">
      <path d="M 0 150 L 150 150 L 80 50 Z" fill="#f8f9fa" stroke="#dc3545" stroke-width="3" />
      <text x="30" y="140" font-family="Arial, sans-serif" font-size="14" fill="#dc3545">∠1</text>
      <text x="120" y="140" font-family="Arial, sans-serif" font-size="14" fill="#dc3545">∠2</text>
      <text x="75" y="70" font-family="Arial, sans-serif" font-size="14" fill="#dc3545">∠3</text>
      <text x="75" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">内角和定理</text>
      <text x="75" y="200" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle" fill="#dc3545">∠1 + ∠2 + ∠3 = 180°</text>
    </g>
    
    <!-- Triangle Inequality -->
    <g transform="translate(250, 60)">
      <path d="M 0 150 L 180 150 L 60 50 Z" fill="#f8f9fa" stroke="#ffc107" stroke-width="3" />
      <text x="90" y="165" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">边 a</text>
      <text x="20" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">边 b</text>
      <text x="130" y="100" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">边 c</text>
      <text x="90" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">三边关系</text>
      <text x="90" y="200" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle" fill="#d39e00">b + c &gt; a</text>
    </g>
    
    <!-- Exterior Angle -->
    <g transform="translate(480, 60)">
      <line x1="0" y1="150" x2="200" y2="150" stroke="#6c757d" stroke-width="2" />
      <path d="M 30 150 L 150 150 L 80 50 Z" fill="#f8f9fa" stroke="#17a2b8" stroke-width="3" />
      <text x="45" y="140" font-family="Arial, sans-serif" font-size="12" fill="#17a2b8">A</text>
      <text x="75" y="75" font-family="Arial, sans-serif" font-size="12" fill="#17a2b8">B</text>
      <path d="M 150 150 L 180 150 A 30 30 0 0 0 165 130 Z" fill="#17a2b8" opacity="0.3" />
      <text x="180" y="130" font-family="Arial, sans-serif" font-size="14" fill="#0b5ed7">外角 α</text>
      <text x="90" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">外角定理</text>
      <text x="90" y="200" font-family="Times New Roman, serif" font-size="18" font-style="italic" text-anchor="middle" fill="#17a2b8">α = ∠A + ∠B</text>
    </g>
  </g>
</svg>
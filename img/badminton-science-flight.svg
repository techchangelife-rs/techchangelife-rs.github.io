<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f8ff"/>
      <stop offset="100%" stop-color="#e6f2ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="url(#bg)"/>
  
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">羽毛球飞行的"跳楼机"轨迹（四大阶段）</text>

  <!-- Trajectory Path -->
  <path d="M 50,200 Q 200,80 400,80 T 700,250" fill="none" stroke="#ccc" stroke-width="3" stroke-dasharray="5,5"/>

  <!-- Stage 1: Tumbling -->
  <g transform="translate(100, 150)">
    <circle cx="0" cy="0" r="25" fill="#ffebee" stroke="#ffcdd2" stroke-width="2"/>
    <text x="0" y="40" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">1. 翻滚期</text>
    <text x="0" y="55" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">刚被打中，晕头转向</text>
    <path d="M -10,0 L 10,0 M 0,-10 L 0,10" stroke="#f44336" stroke-width="2"/>
    <!-- spinning arrows -->
    <path d="M -15,-15 A 20 20 0 0 1 15,-15" fill="none" stroke="#f44336" marker-end="url(#arrow)"/>
  </g>

  <!-- Stage 2: Oscillation -->
  <g transform="translate(250, 95)">
    <circle cx="0" cy="0" r="25" fill="#fff3e0" stroke="#ffe0b2" stroke-width="2"/>
    <text x="0" y="40" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">2. 摇摆期</text>
    <text x="0" y="55" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">像弹簧一样抖动</text>
    <path d="M -15,0 Q 0,-15 15,0 T 30,0" fill="none" stroke="#ff9800" stroke-width="2"/>
  </g>

  <!-- Stage 3: Stable Flight -->
  <g transform="translate(450, 85)">
    <circle cx="0" cy="0" r="25" fill="#e8f5e9" stroke="#c8e6c9" stroke-width="2"/>
    <text x="0" y="40" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">3. 稳定期</text>
    <text x="0" y="55" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">屁股朝后，平稳滑翔</text>
    <!-- mini shuttlecock -->
    <path d="M -10,5 L 10,5 L 15,-10 L -15,-10 Z" fill="#fff" stroke="#4caf50"/>
    <path d="M -8,5 C -8,12 8,12 8,5 Z" fill="#4caf50"/>
    <path d="M 20,0 L 40,0" stroke="#4caf50" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Stage 4: Rapid Deceleration -->
  <g transform="translate(650, 180)">
    <circle cx="0" cy="0" r="25" fill="#e3f2fd" stroke="#bbdefb" stroke-width="2"/>
    <text x="0" y="40" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">4. 降落伞期</text>
    <text x="0" y="55" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">阻力爆发，垂直掉落</text>
    <!-- down arrows -->
    <path d="M -10,-20 L -10,20 M -10,20 L -15,10 M -10,20 L -5,10" stroke="#2196f3" stroke-width="2" fill="none"/>
    <path d="M 10,-20 L 10,20 M 10,20 L 5,10 M 10,20 L 15,10" stroke="#2196f3" stroke-width="2" fill="none"/>
  </g>
</svg>
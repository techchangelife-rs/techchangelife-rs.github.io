<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="200" fill="#f9f9f9" rx="10" ry="10"/>
  
  <!-- Labels -->
  <text x="20" y="50" font-family="Arial" font-size="16" fill="#333">大数 (A)</text>
  <text x="20" y="100" font-family="Arial" font-size="16" fill="#333">小数 (B)</text>
  
  <!-- Line A (Large) -->
  <line x1="100" y1="45" x2="350" y2="45" stroke="#4a90e2" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Line B (Small) -->
  <line x1="100" y1="95" x2="250" y2="95" stroke="#f5a623" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Difference Indicator -->
  <line x1="250" y1="95" x2="350" y2="95" stroke="#f5a623" stroke-width="4" stroke-dasharray="5,5"/>
  <path d="M 250 85 L 250 105" stroke="#333" stroke-width="2"/>
  <path d="M 350 85 L 350 105" stroke="#333" stroke-width="2"/>
  <text x="285" y="115" font-family="Arial" font-size="14" fill="#d0021b" text-anchor="middle">差</text>
  
  <!-- Sum Bracket -->
  <path d="M 360 45 L 370 45 L 370 95 L 360 95" fill="none" stroke="#333" stroke-width="2"/>
  <text x="380" y="75" font-family="Arial" font-size="16" fill="#333" dominant-baseline="middle">和</text>
  
  <!-- Logic 1: (Sum + Diff) / 2 -->
  <text x="200" y="150" font-family="Arial" font-size="14" fill="#555" text-anchor="middle">
    和 + 差 = 2 × 大数
  </text>
  <text x="200" y="175" font-family="Arial" font-size="14" fill="#555" text-anchor="middle">
    和 - 差 = 2 × 小数
  </text>
</svg>

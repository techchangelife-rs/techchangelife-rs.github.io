<svg width="400" height="150" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="150" fill="#f5f3ff" rx="10"/>
  <text x="200" y="30" font-family="Arial" font-size="18" fill="#5b21b6" text-anchor="middle" font-weight="bold">还原问题：倒着往回走</text>
  
  <!-- 顺向 -->
  <g transform="translate(40, 60)">
    <circle cx="20" cy="20" r="15" fill="#ddd6fe" stroke="#7c3aed"/>
    <text x="20" y="25" font-family="Arial" font-size="12" fill="#4c1d95">?</text>
    <path d="M 40 20 L 80 20" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="60" y="15" font-family="Arial" font-size="10" fill="#7c3aed">+ 10</text>
    <rect x="85" y="5" width="40" height="30" fill="#ddd6fe" stroke="#7c3aed" rx="5"/>
    <text x="105" y="25" font-family="Arial" font-size="12" fill="#4c1d95">30</text>
  </g>
  
  <!-- 逆向 -->
  <g transform="translate(40, 110)">
    <path d="M 80 10 L 40 10" stroke="#db2777" stroke-width="2" marker-end="url(#arrow-pink)"/>
    <text x="60" y="5" font-family="Arial" font-size="10" fill="#db2777">- 10</text>
    <text x="140" y="15" font-family="Arial" font-size="14" fill="#9d174d" font-weight="bold">逆推：30 - 10 = 20</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed" />
    </marker>
    <marker id="arrow-pink" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#db2777" />
    </marker>
  </defs>
</svg>

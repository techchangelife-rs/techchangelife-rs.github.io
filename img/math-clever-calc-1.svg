<svg width="400" height="150" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="150" fill="#fdf2f2" rx="10"/>
  <text x="200" y="30" font-family="Arial" font-size="18" fill="#c53030" text-anchor="middle" font-weight="bold">凑整法：找好朋友</text>
  
  <!-- 凑十 -->
  <g transform="translate(50, 60)">
    <circle cx="20" cy="20" r="18" fill="#feb2b2" stroke="#f56565" stroke-width="2"/>
    <text x="20" y="25" font-family="Arial" font-size="14" fill="#742a2a" text-anchor="middle">7</text>
    <text x="50" y="25" font-family="Arial" font-size="20" fill="#c53030" text-anchor="middle">+</text>
    <circle cx="80" cy="20" r="18" fill="#feb2b2" stroke="#f56565" stroke-width="2"/>
    <text x="80" y="25" font-family="Arial" font-size="14" fill="#742a2a" text-anchor="middle">3</text>
    <path d="M 20 45 Q 50 70 80 45" fill="none" stroke="#f56565" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="50" y="85" font-family="Arial" font-size="16" fill="#c53030" text-anchor="middle" font-weight="bold">10</text>
  </g>
  
  <!-- 凑百 -->
  <g transform="translate(220, 60)">
    <rect x="0" y="0" width="45" height="40" fill="#fed7d7" stroke="#f56565" rx="5"/>
    <text x="22.5" y="25" font-family="Arial" font-size="14" fill="#742a2a" text-anchor="middle">64</text>
    <text x="65" y="25" font-family="Arial" font-size="20" fill="#c53030" text-anchor="middle">+</text>
    <rect x="85" y="0" width="45" height="40" fill="#fed7d7" stroke="#f56565" rx="5"/>
    <text x="107.5" y="25" font-family="Arial" font-size="14" fill="#742a2a" text-anchor="middle">36</text>
    <path d="M 22.5 45 Q 65 70 107.5 45" fill="none" stroke="#f56565" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="65" y="85" font-family="Arial" font-size="16" fill="#c53030" text-anchor="middle" font-weight="bold">100</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f56565" />
    </marker>
  </defs>
</svg>

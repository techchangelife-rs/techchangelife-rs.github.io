<svg width="400" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="180" fill="#fce4ec" rx="10"/>
  
  <text x="200" y="30" font-family="Arial" font-size="16" fill="#880E4F" text-anchor="middle" font-weight="bold">图文算式：图形代数</text>
  
  <!-- 等式 1 -->
  <g transform="translate(50, 60)">
    <circle cx="20" cy="0" r="15" fill="#E91E63"/>
    <text x="45" y="5" font-family="Arial" font-size="20" fill="#880E4F">+</text>
    <circle cx="75" cy="0" r="15" fill="#E91E63"/>
    <text x="105" y="5" font-family="Arial" font-size="20" fill="#880E4F">=</text>
    <text x="140" y="5" font-family="Arial" font-size="20" fill="#880E4F">10</text>
    <text x="240" y="5" font-family="Arial" font-size="14" fill="#666">→ 1个圆 = 5</text>
  </g>
  
  <!-- 等式 2 -->
  <g transform="translate(50, 110)">
    <circle cx="20" cy="0" r="15" fill="#E91E63"/>
    <text x="45" y="5" font-family="Arial" font-size="20" fill="#880E4F">+</text>
    <rect x="60" y="-15" width="30" height="30" fill="#9C27B0"/>
    <text x="105" y="5" font-family="Arial" font-size="20" fill="#880E4F">=</text>
    <text x="140" y="5" font-family="Arial" font-size="20" fill="#880E4F">12</text>
    <text x="240" y="5" font-family="Arial" font-size="14" fill="#666">→ 5 + 方 = 12</text>
  </g>
  
  <text x="200" y="160" font-family="Arial" font-size="14" fill="#C2185B" text-anchor="middle" font-weight="bold">所以：方块 = 7</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#112240"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="hexGrid" width="40" height="69.282" patternUnits="userSpaceOnUse" patternTransform="scale(0.5)">
      <path d="M 40 17.32 L 20 5.77 L 0 17.32 L 0 40.41 L 20 51.96 L 40 40.41 Z" fill="none" stroke="rgba(100,255,218,0.1)" stroke-width="1"/>
      <path d="M 40 51.96 L 20 63.51 L 0 51.96 L 0 75.05 L 20 86.6 L 40 75.05 Z" fill="none" stroke="rgba(100,255,218,0.1)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bgGrad)"/>
  <rect width="800" height="400" fill="url(#hexGrid)"/>
  
  <!-- Floating Formulas -->
  <g fill="rgba(100,255,218,0.3)" font-family="monospace" font-size="24" font-weight="bold">
    <text x="50" y="80">F = ma</text>
    <text x="600" y="60">F_d = ½ρv²C_dA</text>
    <text x="80" y="320">F = kx</text>
    <text x="650" y="350">W = ½mv²</text>
    <text x="450" y="100">v = u + at</text>
  </g>

  <!-- Central Element: Shuttlecock breaking the sound barrier -->
  <g transform="translate(400, 200)">
    <!-- Shockwave -->
    <ellipse cx="-40" cy="0" rx="20" ry="80" fill="none" stroke="#64ffda" stroke-width="2" filter="url(#neon)"/>
    <ellipse cx="-20" cy="0" rx="30" ry="100" fill="none" stroke="rgba(100,255,218,0.5)" stroke-width="1"/>
    
    <!-- Shuttlecock -->
    <g transform="rotate(-90)">
      <path d="M -15,20 L 15,20 L 30,-40 L -30,-40 Z" fill="#e6f1ff" stroke="#fff" stroke-width="2"/>
      <path d="M -12,20 C -12,35 12,35 12,20 Z" fill="#ff6b6b"/>
      <line x1="-25" y1="-40" x2="-40" y2="-90" stroke="#e6f1ff" stroke-width="3"/>
      <line x1="-8" y1="-40" x2="-12" y2="-95" stroke="#e6f1ff" stroke-width="3"/>
      <line x1="8" y1="-40" x2="12" y2="-95" stroke="#e6f1ff" stroke-width="3"/>
      <line x1="25" y1="-40" x2="40" y2="-90" stroke="#e6f1ff" stroke-width="3"/>
      <line x1="-30" y1="-60" x2="30" y2="-60" stroke="#e6f1ff" stroke-width="1" stroke-dasharray="2,2"/>
    </g>

    <!-- Speed Lines -->
    <line x1="-60" y1="-30" x2="-150" y2="-30" stroke="#64ffda" stroke-width="3" stroke-dasharray="10,5"/>
    <line x1="-80" y1="0" x2="-200" y2="0" stroke="#64ffda" stroke-width="4" stroke-dasharray="15,5"/>
    <line x1="-60" y1="30" x2="-140" y2="30" stroke="#64ffda" stroke-width="3" stroke-dasharray="8,4"/>
  </g>

  <!-- Title -->
  <text x="400" y="340" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ccd6f6" text-anchor="middle" filter="url(#neon)">一颗羽毛球里的科学宇宙（进阶篇）</text>
  <text x="400" y="370" font-family="sans-serif" font-size="18" fill="#8892b0" text-anchor="middle">动力学 × 运动学公式 × 材料密码</text>
</svg>
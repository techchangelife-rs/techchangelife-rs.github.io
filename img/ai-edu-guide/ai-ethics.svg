<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#E8F5E9" rx="20"/>
  <text x="400" y="50" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#2E7D32">AI 伦理：公平与隐私</text>
  
  <!-- Fairness -->
  <g transform="translate(150, 150)">
    <path d="M 0 150 L 200 150 M 100 150 L 100 50" stroke="#2E7D32" stroke-width="4"/>
    <path d="M 20 100 Q 100 80 180 100" stroke="#2E7D32" stroke-width="4" fill="none"/>
    <circle cx="20" cy="100" r="20" fill="#81C784"/>
    <circle cx="180" cy="100" r="20" fill="#81C784"/>
    <text x="100" y="190" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#1B5E20">公平性</text>
    <text x="100" y="215" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">不偏袒任何人</text>
  </g>
  
  <!-- Privacy -->
  <g transform="translate(450, 150)">
    <rect x="50" y="50" width="100" height="80" rx="10" fill="#FFD54F" stroke="#F57F17" stroke-width="3"/>
    <path d="M 70 50 Q 100 0 130 50" fill="none" stroke="#F57F17" stroke-width="4"/>
    <circle cx="100" cy="90" r="10" fill="#F57F17"/>
    <text x="100" y="190" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#F57F17">隐私保护</text>
    <text x="100" y="215" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">锁好个人信息</text>
  </g>
</svg>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#E3F2FD" rx="20"/>
  <text x="400" y="50" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#01579B">分词 (Tokenization)：AI 是如何读懂句子的？</text>
  
  <text x="400" y="100" font-family="Arial" font-size="32" text-anchor="middle" fill="#333">“我 想 吃 苹果”</text>
  
  <!-- Tokens -->
  <g transform="translate(100, 150)">
    <rect width="100" height="80" rx="10" fill="#fff" stroke="#2196F3" stroke-width="2"/>
    <text x="50" y="50" font-family="Arial" font-size="24" text-anchor="middle" fill="#1565C0">我</text>
    <text x="50" y="110" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">主体 (Subject)</text>
  </g>
  
  <g transform="translate(250, 150)">
    <rect width="100" height="80" rx="10" fill="#fff" stroke="#2196F3" stroke-width="2"/>
    <text x="50" y="50" font-family="Arial" font-size="24" text-anchor="middle" fill="#1565C0">想</text>
    <text x="50" y="110" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">愿望 (Intent)</text>
  </g>
  
  <g transform="translate(400, 150)">
    <rect width="100" height="80" rx="10" fill="#fff" stroke="#2196F3" stroke-width="2"/>
    <text x="50" y="50" font-family="Arial" font-size="24" text-anchor="middle" fill="#1565C0">吃</text>
    <text x="50" y="110" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">动作 (Verb)</text>
  </g>
  
  <g transform="translate(550, 150)">
    <rect width="100" height="80" rx="10" fill="#fff" stroke="#2196F3" stroke-width="2"/>
    <text x="50" y="50" font-family="Arial" font-size="24" text-anchor="middle" fill="#1565C0">苹果</text>
    <text x="50" y="110" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">目标 (Object)</text>
  </g>
  
  <text x="400" y="350" font-family="Arial" font-size="16" text-anchor="middle" fill="#666">AI 把句子切开，一个词一个词地理解！🔪</text>
</svg>
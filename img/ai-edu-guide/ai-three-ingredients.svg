<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#FFFDE7" rx="20"/>
  <text x="400" y="50" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#F57F17">AI 的“三大法宝”</text>
  
  <!-- Data -->
  <g transform="translate(100, 150)">
    <rect width="150" height="150" rx="10" fill="#E1F5FE" stroke="#03A9F4" stroke-width="3"/>
    <text x="75" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#01579B">大数据</text>
    <text x="75" y="80" font-size="40" text-anchor="middle">📊</text>
    <text x="75" y="120" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">AI 的“燃料”</text>
  </g>
  
  <!-- Algorithm -->
  <g transform="translate(325, 150)">
    <rect width="150" height="150" rx="10" fill="#E8F5E9" stroke="#4CAF50" stroke-width="3"/>
    <text x="75" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1B5E20">算法</text>
    <text x="75" y="80" font-size="40" text-anchor="middle">🧠</text>
    <text x="75" y="120" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">AI 的“菜谱”</text>
  </g>
  
  <!-- Computing Power -->
  <g transform="translate(550, 150)">
    <rect width="150" height="150" rx="10" fill="#F3E5F5" stroke="#9C27B0" stroke-width="3"/>
    <text x="75" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#4A148C">算力</text>
    <text x="75" y="80" font-size="40" text-anchor="middle">💻</text>
    <text x="75" y="120" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">AI 的“发动机”</text>
  </g>
</svg>
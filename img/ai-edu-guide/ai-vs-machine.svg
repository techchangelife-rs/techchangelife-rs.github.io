<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#E3F2FD" rx="20"/>
  <g transform="translate(100, 100)">
    <rect width="200" height="200" rx="20" fill="#fff" stroke="#2196F3" stroke-width="4"/>
    <text x="100" y="110" font-family="Comic Sans MS, Arial" font-size="20" text-anchor="middle" fill="#1565C0">普通的机器</text>
    <text x="100" y="140" font-family="Comic Sans MS, Arial" font-size="14" text-anchor="middle" fill="#666">(只听指令，不会思考)</text>
  </g>
  <path d="M 350 200 L 450 200" stroke="#9E9E9E" stroke-width="4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9E9E9E"/>
    </marker>
  </defs>
  <g transform="translate(500, 100)">
    <rect width="200" height="200" rx="20" fill="#fff" stroke="#4CAF50" stroke-width="4"/>
    <circle cx="100" cy="80" r="40" fill="#C8E6C9"/>
    <path d="M 80 80 Q 100 60 120 80 M 80 90 Q 100 110 120 90" fill="none" stroke="#1B5E20" stroke-width="2"/>
    <text x="100" y="160" font-family="Comic Sans MS, Arial" font-size="20" text-anchor="middle" fill="#2E7D32">AI 智能机器</text>
    <text x="100" y="190" font-family="Comic Sans MS, Arial" font-size="14" text-anchor="middle" fill="#666">(会观察、会学习、会思考)</text>
  </g>
</svg>
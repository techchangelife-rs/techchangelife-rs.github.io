<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#E8F5E9" rx="20"/>
  <text x="400" y="50" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#2E7D32">决策树：AI 是如何做决定的？</text>
  
  <!-- Root -->
  <g transform="translate(350, 80)">
    <rect width="100" height="50" rx="10" fill="#fff" stroke="#4CAF50" stroke-width="2"/>
    <text x="50" y="30" font-family="Arial" font-size="14" text-anchor="middle">天气晴朗吗？</text>
  </g>
  
  <!-- Branches 1 -->
  <path d="M 350 105 L 250 150 M 450 105 L 550 150" stroke="#9E9E9E" stroke-width="2"/>
  <text x="280" y="130" font-family="Arial" font-size="12" fill="#666">是 (Yes)</text>
  <text x="520" y="130" font-family="Arial" font-size="12" fill="#666">否 (No)</text>
  
  <!-- Nodes 1 -->
  <g transform="translate(200, 150)">
    <rect width="100" height="50" rx="10" fill="#fff" stroke="#4CAF50" stroke-width="2"/>
    <text x="50" y="30" font-family="Arial" font-size="14" text-anchor="middle">作业做完了吗？</text>
  </g>
  <g transform="translate(500, 150)">
    <rect width="100" height="50" rx="10" fill="#FFEBEE" stroke="#F44336" stroke-width="2"/>
    <text x="50" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="#C62828">待在家里</text>
  </g>
  
  <!-- Branches 2 -->
  <path d="M 200 175 L 100 220 M 300 175 L 400 220" stroke="#9E9E9E" stroke-width="2"/>
  
  <!-- Nodes 2 -->
  <g transform="translate(50, 220)">
    <rect width="100" height="50" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
    <text x="50" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="#1B5E20">出去踢球！</text>
  </g>
  <g transform="translate(350, 220)">
    <rect width="100" height="50" rx="10" fill="#FFEBEE" stroke="#F44336" stroke-width="2"/>
    <text x="50" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="#C62828">写作业</text>
  </g>
  
  <text x="400" y="350" font-family="Arial" font-size="16" text-anchor="middle" fill="#666">这就是 AI 做决定的“逻辑树”</text>
</svg>
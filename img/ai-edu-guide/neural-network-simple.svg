<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#FFF3E0" rx="20"/>
  <text x="400" y="50" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#E65100">神经网络：AI 的“大脑地图”</text>
  
  <!-- Nodes -->
  <g transform="translate(100, 100)">
    <!-- Layer 1 -->
    <circle cx="50" cy="50" r="20" fill="#FFB74D" stroke="#EF6C00" stroke-width="2"/>
    <circle cx="50" cy="150" r="20" fill="#FFB74D" stroke="#EF6C00" stroke-width="2"/>
    <circle cx="50" cy="250" r="20" fill="#FFB74D" stroke="#EF6C00" stroke-width="2"/>
    
    <!-- Layer 2 -->
    <circle cx="250" cy="100" r="20" fill="#FFB74D" stroke="#EF6C00" stroke-width="2"/>
    <circle cx="250" cy="200" r="20" fill="#FFB74D" stroke="#EF6C00" stroke-width="2"/>
    
    <!-- Layer 3 -->
    <circle cx="450" cy="150" r="20" fill="#FFB74D" stroke="#EF6C00" stroke-width="2"/>
    
    <!-- Connections -->
    <line x1="70" y1="50" x2="230" y2="100" stroke="#EF6C00" stroke-width="2"/>
    <line x1="70" y1="50" x2="230" y2="200" stroke="#EF6C00" stroke-width="2"/>
    <line x1="70" y1="150" x2="230" y2="100" stroke="#EF6C00" stroke-width="2"/>
    <line x1="70" y1="150" x2="230" y2="200" stroke="#EF6C00" stroke-width="2"/>
    <line x1="70" y1="250" x2="230" y2="100" stroke="#EF6C00" stroke-width="2"/>
    <line x1="70" y1="250" x2="230" y2="200" stroke="#EF6C00" stroke-width="2"/>
    <line x1="270" y1="100" x2="430" y2="150" stroke="#EF6C00" stroke-width="2"/>
    <line x1="270" y1="200" x2="430" y2="150" stroke="#EF6C00" stroke-width="2"/>
  </g>
  
  <text x="150" y="380" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">输入信息</text>
  <text x="350" y="380" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">处理信息</text>
  <text x="550" y="380" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">得出结论</text>
</svg>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#F1F8E9" rx="20"/>
  <text x="400" y="50" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#33691E">实战：AI 智能垃圾分类</text>
  
  <!-- Camera -->
  <g transform="translate(100, 150)">
    <rect width="100" height="80" rx="10" fill="#CFD8DC" stroke="#455A64" stroke-width="3"/>
    <circle cx="50" cy="40" r="20" fill="#455A64"/>
    <text x="50" y="110" font-family="Arial" font-size="14" text-anchor="middle" fill="#455A64">AI 摄像头</text>
  </g>
  
  <!-- Trash -->
  <g transform="translate(250, 170)">
    <text x="0" y="0" font-size="40">🥤</text>
    <path d="M 50 0 L 100 0" stroke="#9E9E9E" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  
  <!-- Bins -->
  <g transform="translate(450, 100)">
    <rect width="80" height="120" fill="#E57373" stroke="#C62828" stroke-width="2"/>
    <text x="40" y="140" font-family="Arial" font-size="12" text-anchor="middle">有害垃圾</text>
    <rect x="120" y="0" width="80" height="120" fill="#81C784" stroke="#2E7D32" stroke-width="2"/>
    <text x="160" y="140" font-family="Arial" font-size="12" text-anchor="middle">可回收物</text>
    <rect x="240" y="0" width="80" height="120" fill="#64B5F6" stroke="#1565C0" stroke-width="2"/>
    <text x="280" y="140" font-family="Arial" font-size="12" text-anchor="middle">其他垃圾</text>
  </g>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9E9E9E"/>
    </marker>
  </defs>
  
  <text x="400" y="350" font-family="Arial" font-size="16" text-anchor="middle" fill="#666">识别物体 -> 查找分类 -> 自动投放</text>
</svg>
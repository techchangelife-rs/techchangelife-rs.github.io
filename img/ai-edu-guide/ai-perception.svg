<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#FFF3E0" rx="20"/>
  <text x="400" y="50" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#E65100">AI 的“五官”：它是如何感知世界的？</text>
  
  <!-- Vision -->
  <g transform="translate(100, 100)">
    <circle cx="50" cy="50" r="40" fill="#E1F5FE" stroke="#03A9F4" stroke-width="2"/>
    <text x="50" y="60" font-size="40" text-anchor="middle">📷</text>
    <text x="50" y="120" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#01579B">计算机视觉</text>
    <text x="50" y="145" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(眼睛：看图识物)</text>
  </g>
  
  <!-- Hearing -->
  <g transform="translate(350, 100)">
    <circle cx="50" cy="50" r="40" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
    <text x="50" y="60" font-size="40" text-anchor="middle">🎤</text>
    <text x="50" y="120" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#1B5E20">语音识别</text>
    <text x="50" y="145" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(耳朵：听懂人话)</text>
  </g>
  
  <!-- Touch/Sensing -->
  <g transform="translate(600, 100)">
    <circle cx="50" cy="50" r="40" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
    <text x="50" y="60" font-size="40" text-anchor="middle">🌡️</text>
    <text x="50" y="120" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#4A148C">传感器感知</text>
    <text x="50" y="145" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(皮肤：感应冷热)</text>
  </g>
</svg>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f8f9fa" rx="20"/>
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">提示词优化对比：从“简单指令”到“结构化 Prompt”</text>
  
  <!-- Basic Prompt -->
  <g transform="translate(50, 100)">
    <rect width="320" height="250" rx="10" fill="#fff" stroke="#f44336" stroke-width="2"/>
    <text x="160" y="35" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#d32f2f">普通咒语 (Basic)</text>
    <text x="20" y="70" font-family="Courier New" font-size="12" fill="#333">"你是一名老师，请解释"</text>
    <text x="20" y="90" font-family="Courier New" font-size="12" fill="#333">"什么是人工智能。"</text>
    <path d="M 20 120 L 300 120" stroke="#eee" stroke-width="1"/>
    <text x="20" y="150" font-family="Arial" font-size="12" fill="#666">结果：回答太死板，</text>
    <text x="20" y="170" font-family="Arial" font-size="12" fill="#666">不符合小学生理解水平。</text>
  </g>
  
  <!-- Structured Prompt -->
  <g transform="translate(430, 100)">
    <rect width="320" height="250" rx="10" fill="#fff" stroke="#4caf50" stroke-width="2"/>
    <text x="160" y="35" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#388e3c">结构化魔法咒语 (Advanced)</text>
    <text x="20" y="70" font-family="Courier New" font-size="10" fill="#333"># Role: 资深科普作家</text>
    <text x="20" y="85" font-family="Courier New" font-size="10" fill="#333"># Audience: 8岁儿童</text>
    <text x="20" y="100" font-family="Courier New" font-size="10" fill="#333"># Strategy: 采用比喻法</text>
    <text x="20" y="115" font-family="Courier New" font-size="10" fill="#333"># Constraints: 禁止使用专业术语</text>
    <text x="20" y="130" font-family="Courier New" font-size="10" fill="#333"># Output: 故事化描述</text>
    <path d="M 20 150 L 300 150" stroke="#eee" stroke-width="1"/>
    <text x="20" y="180" font-family="Arial" font-size="12" fill="#666">结果：生动有趣，</text>
    <text x="20" y="200" font-family="Arial" font-size="12" fill="#666">完美契合学生认知水平！</text>
  </g>
</svg>
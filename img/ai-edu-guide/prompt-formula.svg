<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#E1F5FE" rx="20"/>
  <text x="400" y="50" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#01579B">AI 魔法咒语：完美的提示词公式</text>
  
  <!-- Role -->
  <g transform="translate(50, 120)">
    <rect width="200" height="150" rx="10" fill="#fff" stroke="#03A9F4" stroke-width="4"/>
    <text x="100" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#01579B">我是谁？(Role)</text>
    <text x="100" y="90" font-size="30" text-anchor="middle">🦸‍♂️</text>
    <text x="100" y="130" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">“你是一名数学老师”</text>
  </g>
  
  <text x="260" y="200" font-size="40" fill="#01579B">+</text>
  
  <!-- Task -->
  <g transform="translate(290, 120)">
    <rect width="200" height="150" rx="10" fill="#fff" stroke="#03A9F4" stroke-width="4"/>
    <text x="100" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#01579B">做什么？(Task)</text>
    <text x="100" y="90" font-size="30" text-anchor="middle">📝</text>
    <text x="100" y="130" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">“帮我出一道加法题”</text>
  </g>
  
  <text x="500" y="200" font-size="40" fill="#01579B">+</text>
  
  <!-- Format -->
  <g transform="translate(530, 120)">
    <rect width="200" height="150" rx="10" fill="#fff" stroke="#03A9F4" stroke-width="4"/>
    <text x="100" y="40" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#01579B">怎么给？(Format)</text>
    <text x="100" y="90" font-size="30" text-anchor="middle">📋</text>
    <text x="100" y="130" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">“用表格形式展示”</text>
  </g>
</svg>
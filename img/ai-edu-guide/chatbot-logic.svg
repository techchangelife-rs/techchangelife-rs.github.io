<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#E1F5FE" rx="20"/>
  <text x="400" y="50" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#01579B">聊天机器人是如何“聊天”的？</text>
  
  <!-- User Input -->
  <g transform="translate(50, 150)">
    <rect width="150" height="100" rx="10" fill="#fff" stroke="#03A9F4" stroke-width="2"/>
    <text x="75" y="45" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">“明天杭州”</text>
    <text x="75" y="70" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">“天气如何？”</text>
  </g>
  
  <!-- Intent Analysis -->
  <g transform="translate(250, 150)">
    <rect width="150" height="100" rx="10" fill="#B3E5FC" stroke="#03A9F4" stroke-width="2"/>
    <text x="75" y="45" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#01579B">意图识别</text>
    <text x="75" y="75" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">地点：杭州</text>
    <text x="75" y="90" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">任务：查天气</text>
  </g>
  
  <!-- Response -->
  <g transform="translate(450, 150)">
    <rect width="150" height="100" rx="10" fill="#81D4FA" stroke="#03A9F4" stroke-width="2"/>
    <text x="75" y="45" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#01579B">生成回复</text>
    <text x="75" y="75" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">“明天杭州晴，”</text>
    <text x="75" y="90" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">“气温 20 度。”</text>
  </g>
  
  <!-- Robot -->
  <g transform="translate(650, 150)">
    <rect width="100" height="100" rx="10" fill="#fff" stroke="#03A9F4" stroke-width="3"/>
    <circle cx="35" cy="40" r="10" fill="#03A9F4"/>
    <circle cx="65" cy="40" r="10" fill="#03A9F4"/>
    <path d="M 30 70 Q 50 90 70 70" fill="none" stroke="#03A9F4" stroke-width="3"/>
  </g>
  
  <path d="M 200 200 L 250 200" stroke="#9E9E9E" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 400 200 L 450 200" stroke="#9E9E9E" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 600 200 L 650 200" stroke="#9E9E9E" stroke-width="2" marker-end="url(#arrow)"/>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9E9E9E"/>
    </marker>
  </defs>
</svg>
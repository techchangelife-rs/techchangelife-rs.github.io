<svg width="400" height="150" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="150" fill="#f5f5f4" rx="10"/>
  <text x="200" y="30" font-family="Arial" font-size="18" fill="#44403c" text-anchor="middle" font-weight="bold">图形找规律：变幻的形状</text>
  
  <g transform="translate(40, 60)">
    <!-- 序列 1 -->
    <circle cx="20" cy="20" r="15" fill="#f87171" stroke="#b91c1c"/>
    <text x="20" y="55" font-family="Arial" font-size="10" fill="#78716c" text-anchor="middle">1个圆</text>
    
    <g transform="translate(60, 0)">
      <circle cx="10" cy="10" r="10" fill="#f87171" stroke="#b91c1c"/>
      <circle cx="30" cy="10" r="10" fill="#f87171" stroke="#b91c1c"/>
      <circle cx="20" cy="30" r="10" fill="#f87171" stroke="#b91c1c"/>
      <text x="20" y="55" font-family="Arial" font-size="10" fill="#78716c" text-anchor="middle">3个圆</text>
    </g>
    
    <g transform="translate(130, 0)">
      <circle cx="10" cy="10" r="8" fill="#f87171" stroke="#b91c1c"/>
      <circle cx="30" cy="10" r="8" fill="#f87171" stroke="#b91c1c"/>
      <circle cx="50" cy="10" r="8" fill="#f87171" stroke="#b91c1c"/>
      <circle cx="20" cy="30" r="8" fill="#f87171" stroke="#b91c1c"/>
      <circle cx="40" cy="30" r="8" fill="#f87171" stroke="#b91c1c"/>
      <circle cx="30" cy="50" r="8" fill="#f87171" stroke="#b91c1c"/>
      <text x="30" y="65" font-family="Arial" font-size="10" fill="#78716c" text-anchor="middle">6个圆</text>
    </g>
    
    <text x="220" y="30" font-family="Arial" font-size="24" fill="#78716c">...</text>
    
    <!-- 规律提示 -->
    <text x="320" y="30" font-family="Arial" font-size="14" fill="#b91c1c" font-weight="bold">规律：+2, +3, +4...</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #D93939; }
      .era-text { font-size: 18px; font-weight: bold; fill: #333; }
      .detail-text { font-size: 14px; fill: #666; }
      .arrow { stroke: #DAA520; stroke-width: 3; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DAA520" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FFFDF5" />
  
  <text x="400" y="40" text-anchor="middle" class="title">“年”的起源与演变：从丰收祭到春节</text>

  <!-- 上古/夏商 -->
  <g transform="translate(50, 80)">
    <rect width="180" height="120" rx="10" fill="#FFE4E1" stroke="#D93939" stroke-width="2"/>
    <text x="90" y="30" text-anchor="middle" class="era-text">1. 萌芽期 (上古-商)</text>
    <text x="90" y="60" text-anchor="middle" class="detail-text" font-weight="bold">丰收祭祀 (Harvest)</text>
    <text x="90" y="85" text-anchor="middle" class="detail-text">核心：敬天法祖，求生存</text>
    <text x="90" y="105" text-anchor="middle" class="detail-text">关键词：腊祭、受年、卜辞</text>
  </g>

  <!-- 箭头 -->
  <line x1="240" y1="140" x2="290" y2="140" class="arrow" />

  <!-- 周/秦 -->
  <g transform="translate(300, 80)">
    <rect width="180" height="120" rx="10" fill="#FFFACD" stroke="#DAA520" stroke-width="2"/>
    <text x="90" y="30" text-anchor="middle" class="era-text">2. 雏形期 (周-秦)</text>
    <text x="90" y="60" text-anchor="middle" class="detail-text" font-weight="bold">祈谷礼 (Prayer)</text>
    <text x="90" y="85" text-anchor="middle" class="detail-text">核心：籍田礼，定历法</text>
    <text x="90" y="105" text-anchor="middle" class="detail-text">关键词：岁首、颛顼历</text>
  </g>

  <!-- 箭头 -->
  <line x1="490" y1="140" x2="540" y2="140" class="arrow" />

  <!-- 汉代 -->
  <g transform="translate(550, 80)">
    <rect width="180" height="120" rx="10" fill="#E0FFFF" stroke="#4682B4" stroke-width="2"/>
    <text x="90" y="30" text-anchor="middle" class="era-text">3. 定型期 (汉)</text>
    <text x="90" y="60" text-anchor="middle" class="detail-text" font-weight="bold">元日朝会 (State Ceremony)</text>
    <text x="90" y="85" text-anchor="middle" class="detail-text">核心：太初历，大一统</text>
    <text x="90" y="105" text-anchor="middle" class="detail-text">关键词：正旦、大傩、爆竹</text>
  </g>

  <!-- 箭头向下 -->
  <line x1="640" y1="210" x2="640" y2="260" class="arrow" />

  <!-- 唐宋 -->
  <g transform="translate(550, 270)">
    <rect width="180" height="120" rx="10" fill="#E6E6FA" stroke="#9370DB" stroke-width="2"/>
    <text x="90" y="30" text-anchor="middle" class="era-text">4. 繁盛期 (唐-宋)</text>
    <text x="90" y="60" text-anchor="middle" class="detail-text" font-weight="bold">世俗狂欢 (Carnival)</text>
    <text x="90" y="85" text-anchor="middle" class="detail-text">核心：娱乐化，平民化</text>
    <text x="90" y="105" text-anchor="middle" class="detail-text">关键词：守岁、桃符、灯会</text>
  </g>

  <!-- 箭头向左 -->
  <line x1="540" y1="330" x2="490" y2="330" class="arrow" />

  <!-- 明清 -->
  <g transform="translate(300, 270)">
    <rect width="180" height="120" rx="10" fill="#F0FFF0" stroke="#228B22" stroke-width="2"/>
    <text x="90" y="30" text-anchor="middle" class="era-text">5. 成熟期 (明-清)</text>
    <text x="90" y="60" text-anchor="middle" class="detail-text" font-weight="bold">宗法伦理 (Ethics)</text>
    <text x="90" y="85" text-anchor="middle" class="detail-text">核心：祭祖，敦亲睦族</text>
    <text x="90" y="105" text-anchor="middle" class="detail-text">关键词：春联、接神、拜年</text>
  </g>

  <!-- 箭头向左 -->
  <line x1="290" y1="330" x2="240" y2="330" class="arrow" />

  <!-- 现代 -->
  <g transform="translate(50, 270)">
    <rect width="180" height="120" rx="10" fill="#FFD700" stroke="#FF4500" stroke-width="2"/>
    <text x="90" y="30" text-anchor="middle" class="era-text">6. 现代 (Modern)</text>
    <text x="90" y="60" text-anchor="middle" class="detail-text" font-weight="bold">春节 (Spring Festival)</text>
    <text x="90" y="85" text-anchor="middle" class="detail-text">核心：团圆，文化传承</text>
    <text x="90" y="105" text-anchor="middle" class="detail-text">关键词：春运、红包、联欢</text>
  </g>

</svg>

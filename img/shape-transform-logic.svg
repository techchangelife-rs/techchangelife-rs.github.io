<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#fff7ed" />
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="24" text-anchor="middle" fill="#c2410c" font-weight="bold">图形的剪拼：从长方形到正方形</text>
  
  <!-- Original Rectangle -->
  <g transform="translate(50, 80)">
    <text x="0" y="0" font-family="Arial" font-size="18" fill="#333" font-weight="bold">1. 原始长方形 (9 × 4)</text>
    <rect x="20" y="20" width="180" height="80" fill="#fdba74" stroke="#c2410c" stroke-width="2" />
    <text x="110" y="120" text-anchor="middle">面积 = 36</text>
    
    <!-- Cut Line -->
    <path d="M80,20 L80,100" stroke="#e11d48" stroke-width="2" stroke-dasharray="5,5" />
    <text x="80" y="15" text-anchor="middle" fill="#e11d48" font-size="12">剪开</text>
  </g>
  
  <!-- Arrow -->
  <path d="M260,150 L300,150" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow-orange)" />
  <text x="280" y="130" text-anchor="middle" font-size="14" fill="#c2410c">重新拼接</text>

  <!-- Target Square -->
  <g transform="translate(350, 80)">
    <text x="0" y="0" font-family="Arial" font-size="18" fill="#333" font-weight="bold">2. 拼成正方形 (6 × 6)</text>
    <rect x="20" y="20" width="120" height="120" fill="#fb923c" stroke="#c2410c" stroke-width="2" />
    
    <!-- Grid inside to show parts -->
    <line x1="80" y1="20" x2="80" y2="140" stroke="#fff" stroke-width="1" />
    <line x1="20" y1="80" x2="140" y2="80" stroke="#fff" stroke-width="1" />
    
    <text x="80" y="160" text-anchor="middle">面积 = 36 (守恒)</text>
  </g>
  
  <!-- Tangram Concept -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="500" height="100" rx="10" fill="#fff" stroke="#fed7aa" />
    <text x="20" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#c2410c">核心思考：</text>
    <text x="40" y="60" font-family="Arial" font-size="14">1. 面积守恒：剪拼前后总面积不变。</text>
    <text x="40" y="85" font-family="Arial" font-size="14">2. 寻找共用边：拼接时要找到长度相等的边进行贴合。</text>
  </g>

  <!-- Definitions -->
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#c2410c" />
    </marker>
  </defs>
</svg>

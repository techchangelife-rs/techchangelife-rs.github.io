<svg width="400" height="180" viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="180" fill="#fff7e6" rx="10"/>
  
  <!-- Unsorted -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="30" height="30" fill="#ffd591" stroke="#fa8c16" />
    <text x="15" y="20" font-family="Arial" font-size="12" text-anchor="middle">8</text>
    <rect x="35" y="0" width="30" height="30" fill="#ffd591" stroke="#fa8c16" />
    <text x="50" y="20" font-family="Arial" font-size="12" text-anchor="middle">2</text>
    <rect x="70" y="0" width="30" height="30" fill="#ffd591" stroke="#fa8c16" />
    <text x="85" y="20" font-family="Arial" font-size="12" text-anchor="middle">5</text>
    <text x="50" y="55" font-family="Arial" font-size="14" fill="#fa8c16" text-anchor="middle">无序</text>
  </g>

  <path d="M 160 65 L 240 65" stroke="#fa8c16" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Sorted -->
  <g transform="translate(250, 50)">
    <rect x="0" y="0" width="30" height="30" fill="#fff1b8" stroke="#faad14" />
    <text x="15" y="20" font-family="Arial" font-size="12" text-anchor="middle">2</text>
    <rect x="35" y="0" width="30" height="30" fill="#fff1b8" stroke="#faad14" />
    <text x="50" y="20" font-family="Arial" font-size="12" text-anchor="middle">5</text>
    <rect x="70" y="0" width="30" height="30" fill="#fff1b8" stroke="#faad14" />
    <text x="85" y="20" font-family="Arial" font-size="12" text-anchor="middle">8</text>
    <text x="50" y="55" font-family="Arial" font-size="14" fill="#faad14" text-anchor="middle">有序</text>
  </g>

  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fa8c16" />
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #8B4513; }
      .label { font-size: 16px; font-weight: bold; fill: #333; }
      .sub-label { font-size: 14px; fill: #666; }
      .icon-bg { fill: #FFF8DC; stroke: #DEB887; stroke-width: 2; rx: 10; }
      .arrow { stroke: #D2691E; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D2691E" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FFFAF0" />
  
  <text x="400" y="40" text-anchor="middle" class="title">马的汉字分类图谱</text>

  <!-- 性别分类 -->
  <g transform="translate(50, 80)">
    <rect width="200" height="350" class="icon-bg" />
    <text x="100" y="30" text-anchor="middle" class="label" font-size="20">性别 (Gender)</text>
    
    <!-- 公马 -->
    <g transform="translate(20, 60)">
      <circle cx="30" cy="30" r="25" fill="#E6E6FA" />
      <text x="30" y="35" text-anchor="middle" font-size="24">牡</text>
      <text x="80" y="25" class="label">牡 (mǔ)</text>
      <text x="80" y="45" class="sub-label">雄性的马/兽</text>
    </g>

    <g transform="translate(20, 130)">
      <circle cx="30" cy="30" r="25" fill="#E6E6FA" />
      <text x="30" y="35" text-anchor="middle" font-size="24">骘</text>
      <text x="80" y="25" class="label">骘 (zhì)</text>
      <text x="80" y="45" class="sub-label">雄马，定优劣</text>
    </g>

    <!-- 母马 -->
    <g transform="translate(20, 200)">
      <circle cx="30" cy="30" r="25" fill="#FFE4E1" />
      <text x="30" y="35" text-anchor="middle" font-size="24">骒</text>
      <text x="80" y="25" class="label">骒 (kè)</text>
      <text x="80" y="45" class="sub-label">雌马，母马</text>
    </g>
    
    <!-- 去势 -->
    <g transform="translate(20, 270)">
      <circle cx="30" cy="30" r="25" fill="#F0F0F0" />
      <text x="30" y="35" text-anchor="middle" font-size="24">骟</text>
      <text x="80" y="25" class="label">骟 (shàn)</text>
      <text x="80" y="45" class="sub-label">去势的马</text>
    </g>
  </g>

  <!-- 年龄与大小 -->
  <g transform="translate(300, 80)">
    <rect width="450" height="160" class="icon-bg" />
    <text x="225" y="30" text-anchor="middle" class="label" font-size="20">年龄与大小 (Age & Size)</text>
    
    <!-- 驹 -->
    <g transform="translate(30, 60)">
      <rect width="60" height="60" fill="#E0FFFF" rx="5" />
      <text x="30" y="40" text-anchor="middle" font-size="28">驹</text>
      <text x="30" y="85" text-anchor="middle" class="sub-label">幼马 (&lt;2岁)</text>
    </g>

    <!-- 箭头 -->
    <line x1="100" y1="90" x2="130" y2="90" class="arrow" />

    <!-- 马 -->
    <g transform="translate(140, 60)">
      <rect width="60" height="70" fill="#98FB98" rx="5" />
      <text x="30" y="45" text-anchor="middle" font-size="28">马</text>
      <text x="30" y="95" text-anchor="middle" class="sub-label">成马 (&gt;6尺)</text>
    </g>

    <!-- 騋 -->
    <g transform="translate(250, 50)">
      <rect width="60" height="80" fill="#87CEEB" rx="5" />
      <text x="30" y="50" text-anchor="middle" font-size="28">騋</text>
      <text x="30" y="105" text-anchor="middle" class="sub-label">高马 (&gt;7尺)</text>
    </g>

    <!-- 龙 -->
    <g transform="translate(360, 40)">
      <rect width="60" height="90" fill="#FFD700" rx="5" />
      <text x="30" y="55" text-anchor="middle" font-size="28">龙</text>
      <text x="30" y="115" text-anchor="middle" class="sub-label">巨马 (&gt;8尺)</text>
    </g>
  </g>

  <!-- 能力 -->
  <g transform="translate(300, 270)">
    <rect width="450" height="160" class="icon-bg" />
    <text x="225" y="30" text-anchor="middle" class="label" font-size="20">能力与特质 (Ability)</text>
    
    <text x="50" y="70" font-size="24" fill="#A0522D">骥 / 骏 / 骁</text>
    <text x="50" y="100" class="sub-label">千里马 / 良马 / 勇猛马</text>
    
    <line x1="225" y1="60" x2="225" y2="130" stroke="#DEB887" stroke-dasharray="5,5" />

    <text x="260" y="70" font-size="24" fill="#555">驽 / 骜 / 悍</text>
    <text x="260" y="100" class="sub-label">劣马 / 桀骜马 / 凶狠马</text>
  </g>

</svg>

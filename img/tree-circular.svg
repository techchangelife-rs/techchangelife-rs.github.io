<svg width="400" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="180" fill="#f1f8e9" rx="10"/>
  <circle cx="200" cy="90" r="50" fill="none" stroke="#8d6e63" stroke-width="4"/>
  
  <!-- 树 -->
  <g transform="translate(200, 30)">
    <path d="M0 0 L8 20 L-8 20 Z" fill="#2e7d32"/>
    <rect x="-1" y="20" width="2" height="5" fill="#5d4037"/>
  </g>
  <g transform="translate(200, 150)">
    <path d="M0 0 L8 20 L-8 20 Z" fill="#2e7d32"/>
    <rect x="-1" y="20" width="2" height="5" fill="#5d4037"/>
  </g>
  <g transform="translate(140, 90)">
    <path d="M0 0 L8 20 L-8 20 Z" fill="#2e7d32"/>
    <rect x="-1" y="20" width="2" height="5" fill="#5d4037"/>
  </g>
  <g transform="translate(260, 90)">
    <path d="M0 0 L8 20 L-8 20 Z" fill="#2e7d32"/>
    <rect x="-1" y="20" width="2" height="5" fill="#5d4037"/>
  </g>
  
  <text x="200" y="20" font-family="Arial" font-size="14" fill="#1b5e20" text-anchor="middle" font-weight="bold">封闭图形：树 = 间隔</text>
  <text x="200" y="170" font-family="Arial" font-size="12" fill="#e65100" text-anchor="middle">4个间隔，4棵树</text>
</svg>

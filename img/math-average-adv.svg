<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="200" fill="#fffbe6" rx="10" ry="10"/>
  
  <!-- Bars Before -->
  <rect x="50" y="60" width="30" height="90" fill="#40a9ff" opacity="0.4"/>
  <rect x="90" y="30" width="30" height="120" fill="#40a9ff" opacity="0.4"/>
  <rect x="130" y="80" width="30" height="70" fill="#40a9ff" opacity="0.4"/>
  
  <!-- Average Line -->
  <line x1="40" y1="70" x2="360" y2="70" stroke="#f5222d" stroke-width="2" stroke-dasharray="5,2"/>
  <text x="365" y="75" font-family="Arial" font-size="12" fill="#f5222d">平均数</text>
  
  <!-- Moving Arrows -->
  <path d="M 105 35 Q 150 20 145 75" fill="none" stroke="#f5222d" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="130" y="30" font-family="Arial" font-size="10" fill="#f5222d">移多</text>
  <text x="130" y="100" font-family="Arial" font-size="10" fill="#f5222d">补少</text>
  
  <!-- Balanced Bars (Concept) -->
  <rect x="250" y="70" width="30" height="80" fill="#52c41a" />
  <rect x="290" y="70" width="30" height="80" fill="#52c41a" />
  <rect x="330" y="70" width="30" height="80" fill="#52c41a" />
  
  <!-- Markers -->
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f5222d" />
    </marker>
  </defs>
  
  <text x="200" y="180" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">移多补少：把高出的部分填补到低洼处</text>
</svg>

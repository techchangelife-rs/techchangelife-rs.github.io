<svg width="400" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="180" fill="#fef2f2" rx="10"/>
  <text x="200" y="30" font-family="Arial" font-size="18" fill="#991b1b" text-anchor="middle" font-weight="bold">火柴棒：变身的艺术</text>
  
  <g transform="translate(50, 60)">
    <!-- 原始数字 6 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="30" height="5" fill="#ef4444" rx="2"/> <!-- top -->
      <rect x="0" y="0" width="5" height="25" fill="#ef4444" rx="2"/> <!-- left top -->
      <rect x="0" y="25" width="30" height="5" fill="#ef4444" rx="2"/> <!-- mid -->
      <rect x="0" y="25" width="5" height="25" fill="#ef4444" rx="2"/> <!-- left bottom -->
      <rect x="25" y="25" width="5" height="25" fill="#ef4444" rx="2"/> <!-- right bottom -->
      <rect x="0" y="50" width="30" height="5" fill="#ef4444" rx="2"/> <!-- bottom -->
      <text x="15" y="75" font-family="Arial" font-size="12" fill="#991b1b" text-anchor="middle">数字 6</text>
    </g>
    
    <!-- 箭头 -->
    <path d="M 60 25 L 100 25" stroke="#991b1b" stroke-width="2" marker-end="url(#arrow-match)"/>
    <text x="80" y="15" font-family="Arial" font-size="10" fill="#991b1b" text-anchor="middle">移动 1 根</text>
    
    <!-- 变成数字 9 -->
    <g transform="translate(120, 0)">
      <rect x="0" y="0" width="30" height="5" fill="#ef4444" rx="2"/> <!-- top -->
      <rect x="0" y="0" width="5" height="25" fill="#ef4444" rx="2"/> <!-- left top -->
      <rect x="25" y="0" width="5" height="25" fill="#ef4444" rx="2"/> <!-- right top -->
      <rect x="0" y="25" width="30" height="5" fill="#ef4444" rx="2"/> <!-- mid -->
      <rect x="25" y="25" width="5" height="25" fill="#ef4444" rx="2"/> <!-- right bottom -->
      <rect x="0" y="50" width="30" height="5" fill="#ef4444" rx="2"/> <!-- bottom -->
      <text x="15" y="75" font-family="Arial" font-size="12" fill="#991b1b" text-anchor="middle">数字 9</text>
    </g>
  </g>
  
  <text x="200" y="160" font-family="Arial" font-size="14" fill="#991b1b" font-weight="bold">技巧：移动一根，改变数字或符号</text>

  <defs>
    <marker id="arrow-match" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#991b1b" />
    </marker>
  </defs>
</svg>

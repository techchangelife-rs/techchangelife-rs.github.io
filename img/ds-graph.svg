<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" fill="#fffbe6" rx="10"/>
  
  <!-- Vertices -->
  <circle cx="80" cy="60" r="15" fill="#faad14" stroke="#d48806" stroke-width="2"/>
  <text x="80" y="65" font-family="Arial" font-size="12" text-anchor="middle">A</text>
  
  <circle cx="200" cy="140" r="15" fill="#faad14" stroke="#d48806" stroke-width="2"/>
  <text x="200" y="145" font-family="Arial" font-size="12" text-anchor="middle">B</text>
  
  <circle cx="320" cy="60" r="15" fill="#faad14" stroke="#d48806" stroke-width="2"/>
  <text x="320" y="65" font-family="Arial" font-size="12" text-anchor="middle">C</text>
  
  <!-- Edges -->
  <line x1="95" y1="60" x2="305" y2="60" stroke="#d48806" stroke-width="2" />
  <line x1="80" y1="75" x2="185" y2="135" stroke="#d48806" stroke-width="2" />
  <line x1="320" y1="75" x2="215" y2="135" stroke="#d48806" stroke-width="2" />
  
  <text x="200" y="180" font-family="Arial" font-size="14" fill="#855800" text-anchor="middle">图：顶点 (Node) 与 边 (Edge)</text>
</svg>

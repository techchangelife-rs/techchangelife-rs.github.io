<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="300" fill="#f8f9fa" rx="10" ry="10" />
  
  <!-- Road -->
  <line x1="50" y1="200" x2="550" y2="200" stroke="#6c757d" stroke-width="4" stroke-dasharray="8,4" />
  
  <!-- Start and End Points -->
  <circle cx="100" cy="200" r="6" fill="#dc3545" />
  <text x="100" y="230" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">起点 A</text>
  
  <circle cx="500" cy="200" r="6" fill="#28a745" />
  <text x="500" y="230" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">终点 B</text>
  
  <!-- Car/Object representation -->
  <rect x="150" y="160" width="60" height="30" rx="5" fill="#007bff" opacity="0.8" />
  <text x="180" y="180" font-family="Arial" font-size="12" text-anchor="middle" fill="white">小车</text>
  
  <!-- Velocity Vector -->
  <line x1="210" y1="175" x2="260" y2="175" stroke="#007bff" stroke-width="3" marker-end="url(#arrowhead)" />
  <text x="235" y="165" font-family="Arial" font-size="14" text-anchor="middle" fill="#007bff">速度 (v)</text>
  
  <!-- Time representation -->
  <path d="M 280 100 A 30 30 0 1 1 310 130" fill="none" stroke="#fd7e14" stroke-width="3" marker-end="url(#arrowhead)" />
  <circle cx="310" cy="115" r="15" fill="none" stroke="#fd7e14" stroke-width="2" />
  <line x1="310" y1="115" x2="310" y2="105" stroke="#fd7e14" stroke-width="2" />
  <line x1="310" y1="115" x2="318" y2="115" stroke="#fd7e14" stroke-width="2" />
  <text x="340" y="120" font-family="Arial" font-size="14" fill="#fd7e14">时间 (t)</text>
  
  <!-- Distance bracket -->
  <path d="M 100 250 L 100 260 L 500 260 L 500 250" fill="none" stroke="#333" stroke-width="2" />
  <text x="300" y="280" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">路程 (S) = v × t</text>
  
  <!-- Core Formula Box -->
  <rect x="400" y="20" width="180" height="100" rx="8" fill="white" stroke="#007bff" stroke-width="2" />
  <text x="490" y="45" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#007bff">基本公式</text>
  <text x="420" y="70" font-family="Arial" font-size="13" fill="#333">S = v × t</text>
  <text x="420" y="90" font-family="Arial" font-size="13" fill="#333">v = S ÷ t</text>
  <text x="420" y="110" font-family="Arial" font-size="13" fill="#333">t = S ÷ v</text>
  
  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#007bff" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fd7e14" />
    </marker>
  </defs>
</svg>
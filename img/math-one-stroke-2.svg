<svg width="400" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="180" fill="#fff7ed" rx="10"/>
  <text x="200" y="30" font-family="Arial" font-size="18" fill="#9a3412" text-anchor="middle" font-weight="bold">一笔画进阶：奇点转换</text>
  
  <g transform="translate(50, 60)">
    <!-- 原始图形 (4个奇点) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="60" height="60" fill="none" stroke="#ea580c" stroke-width="2"/>
      <line x1="30" y1="0" x2="30" y2="60" stroke="#ea580c" stroke-width="2"/>
      <line x1="0" y1="30" x2="60" y2="30" stroke="#ea580c" stroke-width="2"/>
      <text x="30" y="80" font-family="Arial" font-size="12" fill="#9a3412" text-anchor="middle">4个奇点 (×)</text>
    </g>
    
    <!-- 箭头 -->
    <path d="M 80 30 L 120 30" stroke="#9a3412" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="100" y="20" font-family="Arial" font-size="10" fill="#9a3412" text-anchor="middle">连一根线</text>
    
    <!-- 转换后 (2个奇点) -->
    <g transform="translate(140, 0)">
      <rect x="0" y="0" width="60" height="60" fill="none" stroke="#ea580c" stroke-width="2"/>
      <line x1="30" y1="0" x2="30" y2="60" stroke="#ea580c" stroke-width="2"/>
      <line x1="0" y1="30" x2="60" y2="30" stroke="#ea580c" stroke-width="2"/>
      <!-- 新增的线 -->
      <path d="M 0 30 Q 30 100 60 30" fill="none" stroke="#be123c" stroke-width="2" stroke-dasharray="2"/>
      <text x="30" y="80" font-family="Arial" font-size="12" fill="#9a3412" text-anchor="middle">2个奇点 (√)</text>
    </g>
  </g>
  
  <text x="200" y="165" font-family="Arial" font-size="14" fill="#9a3412" font-weight="bold">技巧：最少笔数 = 奇点数 ÷ 2</text>

  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#9a3412" />
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b92b27"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  
  <!-- Subtle Court Lines -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="4">
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
  </g>

  <!-- Growth Path Arrow -->
  <path d="M 50,300 Q 300,300 400,200 T 750,100" fill="none" stroke="#FFD700" stroke-width="8" stroke-dasharray="15,10" filter="url(#shadow)"/>
  
  <!-- Path Nodes -->
  <g fill="#fff" stroke="#FFD700" stroke-width="4">
    <circle cx="150" cy="300" r="15"/>
    <circle cx="400" cy="200" r="20"/>
    <circle cx="650" cy="120" r="25"/>
  </g>
  
  <g font-family="sans-serif" font-weight="bold" fill="#fff" text-anchor="middle">
    <text x="150" y="340" font-size="16">6-12岁 基础期</text>
    <text x="400" y="250" font-size="20">13-15岁 关键期</text>
    <text x="650" y="170" font-size="24">16-18岁 冲刺期</text>
  </g>

  <!-- Title -->
  <text x="400" y="70" font-family="sans-serif" font-weight="bold" font-size="36" fill="#fff" text-anchor="middle" filter="url(#shadow)">国家队视角：青少年羽毛球成长全周期解剖</text>
  
  <!-- Subtitle Tags -->
  <g transform="translate(180, 100)" font-family="sans-serif" font-size="14" fill="#fff">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="rgba(0,0,0,0.4)"/>
    <text x="50" y="18" text-anchor="middle">周期化训练</text>
    
    <rect x="110" y="0" width="100" height="26" rx="13" fill="rgba(0,0,0,0.4)"/>
    <text x="160" y="18" text-anchor="middle">枪挑心态</text>

    <rect x="220" y="0" width="140" height="26" rx="13" fill="rgba(0,0,0,0.4)"/>
    <text x="290" y="18" text-anchor="middle">体育精神金字塔</text>
  </g>
</svg>
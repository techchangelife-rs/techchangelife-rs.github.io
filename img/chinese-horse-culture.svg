<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .bg { fill: #f8f1e4; }
      .text { font-family: 'Kaiti', 'STKaiti', serif; fill: #333; }
      .title { font-size: 48px; font-weight: bold; fill: #8B4513; }
      .subtitle { font-size: 24px; fill: #555; }
      .char-label { font-size: 16px; fill: #888; }
      .horse-char { font-size: 80px; font-family: 'SimSun', serif; fill: #A0522D; }
    </style>
  </defs>
  
  <rect width="100%" height="100%" class="bg" />
  
  <!-- 标题 -->
  <text x="400" y="80" text-anchor="middle" class="title">马文化百科</text>
  <text x="400" y="120" text-anchor="middle" class="subtitle">汉字 · 成语 · 古诗词</text>
  
  <!-- 甲骨文马 -->
  <g transform="translate(150, 200)">
    <path d="M20,10 Q30,0 40,10 T60,10 L60,40 L80,40 L80,60 L60,60 L60,80 L50,100 L30,100 L20,80 Z" fill="none" stroke="#8B4513" stroke-width="4"/>
    <path d="M60,10 L70,0 M65,12 L75,2 M70,15 L80,5" stroke="#8B4513" stroke-width="3"/>
    <text x="50" y="130" text-anchor="middle" class="char-label">甲骨文</text>
  </g>
  
  <!-- 金文马 -->
  <g transform="translate(300, 200)">
    <path d="M20,20 Q40,0 60,20 T80,40 L80,70 L60,90 L40,90 L20,70 Z" fill="none" stroke="#8B4513" stroke-width="4"/>
    <text x="50" y="130" text-anchor="middle" class="char-label">金文</text>
  </g>
  
  <!-- 小篆马 -->
  <g transform="translate(450, 200)">
    <text x="50" y="90" text-anchor="middle" class="horse-char" style="font-family: 'LiSu', serif;">馬</text>
    <text x="50" y="130" text-anchor="middle" class="char-label">繁体楷书</text>
  </g>
  
  <!-- 简体马 -->
  <g transform="translate(600, 200)">
    <text x="50" y="90" text-anchor="middle" class="horse-char">马</text>
    <text x="50" y="130" text-anchor="middle" class="char-label">简体楷书</text>
  </g>
  
  <!-- 装饰线条 -->
  <line x1="100" y1="350" x2="700" y2="350" stroke="#8B4513" stroke-width="2" />
  <text x="400" y="380" text-anchor="middle" class="text" font-size="14">龙马精神 · 马到成功 · 一马当先</text>
</svg>

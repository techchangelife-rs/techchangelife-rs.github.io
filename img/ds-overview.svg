<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#ffffff" />
  
  <!-- Nodes -->
  <circle cx="200" cy="150" r="40" fill="#722ed1" stroke="#531dab" stroke-width="2"/>
  <text x="200" y="155" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">数据结构</text>
  
  <!-- Branches -->
  <g stroke="#722ed1" stroke-width="1.5">
    <line x1="160" y1="130" x2="80" y2="60" />
    <line x1="240" y1="130" x2="320" y2="60" />
    <line x1="160" y1="170" x2="80" y2="240" />
    <line x1="240" y1="170" x2="320" y2="240" />
    <line x1="200" y1="110" x2="200" y2="50" />
    <line x1="200" y1="190" x2="200" y2="250" />
  </g>
  
  <!-- Labels -->
  <rect x="40" y="40" width="60" height="30" fill="#f9f0ff" stroke="#722ed1" rx="5"/>
  <text x="70" y="60" font-family="Arial" font-size="12" text-anchor="middle">数组</text>
  
  <rect x="300" y="40" width="60" height="30" fill="#f9f0ff" stroke="#722ed1" rx="5"/>
  <text x="330" y="60" font-family="Arial" font-size="12" text-anchor="middle">链表</text>
  
  <rect x="170" y="20" width="60" height="30" fill="#f9f0ff" stroke="#722ed1" rx="5"/>
  <text x="200" y="40" font-family="Arial" font-size="12" text-anchor="middle">栈/队列</text>
  
  <rect x="40" y="230" width="60" height="30" fill="#f9f0ff" stroke="#722ed1" rx="5"/>
  <text x="70" y="250" font-family="Arial" font-size="12" text-anchor="middle">哈希表</text>
  
  <rect x="300" y="230" width="60" height="30" fill="#f9f0ff" stroke="#722ed1" rx="5"/>
  <text x="330" y="250" font-family="Arial" font-size="12" text-anchor="middle">树</text>
  
  <rect x="170" y="250" width="60" height="30" fill="#f9f0ff" stroke="#722ed1" rx="5"/>
  <text x="200" y="270" font-family="Arial" font-size="12" text-anchor="middle">图</text>
</svg>

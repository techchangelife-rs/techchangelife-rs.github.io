<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Left: 21-day Habit -->
  <g transform="translate(40, 40)">
    <rect width="340" height="360" rx="15" fill="#fff" filter="url(#cardShadow)"/>
    <path d="M 0,15 Q 0,0 15,0 L 325,0 Q 340,0 340,15 L 340,60 L 0,60 Z" fill="#6b21a8"/>
    <text x="170" y="35" font-family="sans-serif" font-weight="bold" font-size="20" fill="#fff" text-anchor="middle">⏳ "饮之品质" 21天打卡表</text>
    
    <g transform="translate(30, 100)" font-family="sans-serif" font-size="16" fill="#374151">
      <rect x="-10" y="-20" width="280" height="60" rx="8" fill="#f3e8ff"/>
      <text x="10" y="0" font-weight="bold" fill="#6b21a8">任务一：每日1分钟平板支撑</text>
      <text x="10" y="22" font-size="14" fill="#6b7280">锻炼核心力量与枯燥忍耐力</text>

      <rect x="-10" y="60" width="280" height="60" rx="8" fill="#f3e8ff"/>
      <text x="10" y="80" font-weight="bold" fill="#6b21a8">任务二：每日1篇百字训练日记</text>
      <text x="10" y="102" font-size="14" fill="#6b7280">培养独立思考与失败复盘能力</text>

      <rect x="-10" y="140" width="280" height="60" rx="8" fill="#f3e8ff"/>
      <text x="10" y="160" font-weight="bold" fill="#6b21a8">任务三：下场前1次鞠躬致谢</text>
      <text x="10" y="182" font-size="14" fill="#6b7280">致谢教练、对手、场地与父母</text>
      
      <path d="M 0,230 L 260,230" stroke="#d8b4fe" stroke-width="2" stroke-dasharray="5,5"/>
      <text x="130" y="255" font-weight="bold" fill="#9333ea" text-anchor="middle">完成打卡可兑换奖励哦！</text>
    </g>
  </g>

  <!-- Right: Parent Promise Card -->
  <g transform="translate(420, 40)">
    <rect width="340" height="360" rx="15" fill="#fff" filter="url(#cardShadow)"/>
    <path d="M 0,15 Q 0,0 15,0 L 325,0 Q 340,0 340,15 L 340,60 L 0,60 Z" fill="#b91c1c"/>
    <text x="170" y="35" font-family="sans-serif" font-weight="bold" font-size="20" fill="#fff" text-anchor="middle">✍️ 冠军家长承诺书</text>
    
    <g transform="translate(20, 100)" font-family="sans-serif" font-size="15" fill="#1f2937">
      <text x="0" y="0">我承诺，在孩子的羽毛球成长之路上：</text>
      
      <circle cx="10" cy="30" r="4" fill="#b91c1c"/>
      <text x="25" y="35">我做<tspan font-weight="bold" fill="#b91c1c">后勤部长</tspan>，不做场边指挥官；</text>

      <circle cx="10" cy="65" r="4" fill="#b91c1c"/>
      <text x="25" y="70">我关注<tspan font-weight="bold" fill="#b91c1c">汗水与进步</tspan>，不只盯着输赢；</text>

      <circle cx="10" cy="100" r="4" fill="#b91c1c"/>
      <text x="25" y="105">输球时，我给的是<tspan font-weight="bold" fill="#b91c1c">拥抱</tspan>而非指责；</text>

      <circle cx="10" cy="135" r="4" fill="#b91c1c"/>
      <text x="25" y="140">赢球时，我提醒他保持<tspan font-weight="bold" fill="#b91c1c">谦逊与尊重</tspan>。</text>

      <text x="0" y="190" font-size="14" fill="#6b7280">体育的终点是人格，我愿用耐心，</text>
      <text x="0" y="215" font-size="14" fill="#6b7280">静待一朵坚韧之花的绽放。</text>

      <path d="M 120,260 L 280,260" stroke="#1f2937" stroke-width="1"/>
      <text x="150" y="250" font-weight="bold" fill="#374151">家长签字：</text>
      <text x="20" y="250" font-weight="bold" fill="#374151">日期：</text>
      <path d="M 60,260 L 100,260" stroke="#1f2937" stroke-width="1"/>
    </g>
  </g>
</svg>
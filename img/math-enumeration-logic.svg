<svg width="400" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="180" fill="#f5f3ff" rx="10"/>
  <text x="200" y="30" font-family="Arial" font-size="18" fill="#5b21b6" text-anchor="middle" font-weight="bold">枚举法：分类列举</text>
  
  <g transform="translate(50, 60)">
    <!-- 树状分支 -->
    <text x="0" y="25" font-family="Arial" font-size="16" fill="#4c1d95">十位是 1</text>
    <path d="M 60 20 L 100 0" stroke="#7c3aed" stroke-width="2"/>
    <path d="M 60 25 L 100 25" stroke="#7c3aed" stroke-width="2"/>
    <path d="M 60 30 L 100 50" stroke="#7c3aed" stroke-width="2"/>
    
    <text x="110" y="5" font-family="Arial" font-size="14" fill="#6d28d9">个位是 2 → 12</text>
    <text x="110" y="30" font-family="Arial" font-size="14" fill="#6d28d9">个位是 3 → 13</text>
    <text x="110" y="55" font-family="Arial" font-size="14" fill="#6d28d9">个位是 4 → 14</text>
  </g>
  
  <text x="200" y="150" font-family="Arial" font-size="14" fill="#5b21b6" font-weight="bold">核心：按顺序、分类、不重不漏</text>
</svg>

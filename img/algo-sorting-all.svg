<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#fdfcfb" rx="15"/>
  <text x="300" y="35" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">排序算法复杂度全景图</text>
  
  <!-- Table Header -->
  <g transform="translate(40, 60)">
    <rect width="520" height="30" fill="#f0f2f5" rx="4"/>
    <text x="10" y="20" font-family="Arial" font-size="12" font-weight="bold" fill="#555">算法名称</text>
    <text x="120" y="20" font-family="Arial" font-size="12" font-weight="bold" fill="#555">平均时间</text>
    <text x="220" y="20" font-family="Arial" font-size="12" font-weight="bold" fill="#555">最坏时间</text>
    <text x="320" y="20" font-family="Arial" font-size="12" font-weight="bold" fill="#555">空间复杂度</text>
    <text x="440" y="20" font-family="Arial" font-size="12" font-weight="bold" fill="#555">稳定性</text>
  </g>

  <!-- Table Rows -->
  <g transform="translate(40, 95)" font-family="Arial" font-size="11" fill="#666">
    <!-- Bubble -->
    <text x="10" y="15">冒泡排序</text>
    <text x="120" y="15">O(n²)</text>
    <text x="220" y="15">O(n²)</text>
    <text x="320" y="15">O(1)</text>
    <text x="440" y="15" fill="#52c41a">稳定</text>
    
    <!-- Selection -->
    <text x="10" y="40">选择排序</text>
    <text x="120" y="40">O(n²)</text>
    <text x="220" y="40">O(n²)</text>
    <text x="320" y="40">O(1)</text>
    <text x="440" y="40" fill="#f5222d">不稳定</text>

    <!-- Insertion -->
    <text x="10" y="65">插入排序</text>
    <text x="120" y="65">O(n²)</text>
    <text x="220" y="65">O(n²)</text>
    <text x="320" y="65">O(1)</text>
    <text x="440" y="65" fill="#52c41a">稳定</text>

    <!-- Shell -->
    <text x="10" y="90">希尔排序</text>
    <text x="120" y="90">O(n log n)</text>
    <text x="220" y="90">O(n²)</text>
    <text x="320" y="90">O(1)</text>
    <text x="440" y="90" fill="#f5222d">不稳定</text>

    <!-- Merge -->
    <text x="10" y="115">归并排序</text>
    <text x="120" y="115" fill="#1890ff">O(n log n)</text>
    <text x="220" y="115">O(n log n)</text>
    <text x="320" y="115">O(n)</text>
    <text x="440" y="115" fill="#52c41a">稳定</text>

    <!-- Quick -->
    <text x="10" y="140">快速排序</text>
    <text x="120" y="140" fill="#1890ff">O(n log n)</text>
    <text x="220" y="140">O(n²)</text>
    <text x="320" y="140">O(log n)</text>
    <text x="440" y="140" fill="#f5222d">不稳定</text>

    <!-- Heap -->
    <text x="10" y="165">堆排序</text>
    <text x="120" y="165" fill="#1890ff">O(n log n)</text>
    <text x="220" y="165">O(n log n)</text>
    <text x="320" y="165">O(1)</text>
    <text x="440" y="165" fill="#f5222d">不稳定</text>

    <!-- Counting -->
    <text x="10" y="190">计数排序</text>
    <text x="120" y="190" fill="#faad14">O(n+k)</text>
    <text x="220" y="190">O(n+k)</text>
    <text x="320" y="190">O(k)</text>
    <text x="440" y="190" fill="#52c41a">稳定</text>

    <!-- Bucket -->
    <text x="10" y="215">桶排序</text>
    <text x="120" y="215" fill="#faad14">O(n+k)</text>
    <text x="220" y="215">O(n²)</text>
    <text x="320" y="215">O(n+k)</text>
    <text x="440" y="215" fill="#52c41a">稳定</text>

    <!-- Radix -->
    <text x="10" y="240">基数排序</text>
    <text x="120" y="240" fill="#faad14">O(n*k)</text>
    <text x="220" y="240">O(n*k)</text>
    <text x="320" y="240">O(n+k)</text>
    <text x="440" y="240" fill="#52c41a">稳定</text>
  </g>

  <!-- Bottom Line -->
  <line x1="40" y1="350" x2="560" y2="350" stroke="#eee" stroke-width="1"/>
  <text x="300" y="375" font-family="Arial" font-size="10" fill="#999" text-anchor="middle">注：k 为数据范围或桶的数量</text>
</svg>

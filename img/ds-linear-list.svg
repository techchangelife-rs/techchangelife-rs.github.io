<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" fill="#f9f0ff" rx="10"/>
  
  <!-- Array -->
  <text x="20" y="30" font-family="Arial" font-size="14" font-weight="bold" fill="#722ed1">顺序表 (数组)</text>
  <rect x="20" y="45" width="40" height="30" fill="#efdbff" stroke="#722ed1"/>
  <rect x="60" y="45" width="40" height="30" fill="#efdbff" stroke="#722ed1"/>
  <rect x="100" y="45" width="40" height="30" fill="#efdbff" stroke="#722ed1"/>
  <rect x="140" y="45" width="40" height="30" fill="#efdbff" stroke="#722ed1"/>
  
  <!-- Linked List -->
  <text x="20" y="110" font-family="Arial" font-size="14" font-weight="bold" fill="#722ed1">链表</text>
  <rect x="20" y="125" width="40" height="30" fill="#d3adf7" stroke="#722ed1" rx="3"/>
  <line x1="60" y1="140" x2="85" y2="140" stroke="#722ed1" stroke-width="2" marker-end="url(#arrow-purple)"/>
  
  <rect x="90" y="125" width="40" height="30" fill="#d3adf7" stroke="#722ed1" rx="3"/>
  <line x1="130" y1="140" x2="155" y2="140" stroke="#722ed1" stroke-width="2" marker-end="url(#arrow-purple)"/>
  
  <rect x="160" y="125" width="40" height="30" fill="#d3adf7" stroke="#722ed1" rx="3"/>
  <text x="180" y="145" font-family="Arial" font-size="10" text-anchor="middle">NULL</text>

  <defs>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#722ed1" />
    </marker>
  </defs>
</svg>

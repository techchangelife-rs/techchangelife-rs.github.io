<svg width="400" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="180" fill="#f9f9f9" rx="10"/>
  
  <!-- 小数 (1份) -->
  <text x="20" y="45" font-family="Arial" font-size="16" fill="#333">小数:</text>
  <rect x="70" y="30" width="80" height="20" fill="#50E3C2" rx="5"/>
  <text x="100" y="45" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle">1份</text>
  
  <!-- 大数 (4份) -->
  <text x="20" y="95" font-family="Arial" font-size="16" fill="#333">大数:</text>
  <rect x="70" y="80" width="80" height="20" fill="#4A90E2" rx="5"/>
  <rect x="155" y="80" width="80" height="20" fill="#4A90E2" rx="5"/>
  <rect x="240" y="80" width="80" height="20" fill="#4A90E2" rx="5"/>
  <rect x="325" y="80" width="60" height="20" fill="#4A90E2" rx="5"/>
  
  <!-- 差的标注 -->
  <path d="M 155 120 L 155 130 L 385 130 L 385 120" fill="none" stroke="#D0021B" stroke-width="2"/>
  <text x="270" y="150" font-family="Arial" font-size="16" fill="#D0021B" text-anchor="middle">差 (4 - 1 = 3份)</text>
</svg>

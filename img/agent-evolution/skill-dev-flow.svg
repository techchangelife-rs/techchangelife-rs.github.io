<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f8f9fa" rx="20"/>
  <text x="400" y="50" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">Skill 开发四步法</text>
  
  <!-- Step 1: Define -->
  <g transform="translate(50, 150)">
    <rect width="150" height="100" rx="10" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
    <text x="75" y="45" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565c0">1. 定义 (Define)</text>
    <text x="75" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">编写 JSON Schema</text>
  </g>
  
  <!-- Step 2: Implement -->
  <g transform="translate(230, 150)">
    <rect width="150" height="100" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="75" y="45" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">2. 实现 (Implement)</text>
    <text x="75" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">编写 Python 代码</text>
  </g>
  
  <!-- Step 3: Register -->
  <g transform="translate(410, 150)">
    <rect width="150" height="100" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="75" y="45" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#e65100">3. 注册 (Register)</text>
    <text x="75" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">接入 Agent 框架</text>
  </g>
  
  <!-- Step 4: Test -->
  <g transform="translate(590, 150)">
    <rect width="150" height="100" rx="10" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
    <text x="75" y="45" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#4a148c">4. 测试 (Test)</text>
    <text x="75" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">真实对话联调</text>
  </g>
  
  <!-- Arrows -->
  <path d="M 200 200 L 230 200" stroke="#bdbdbd" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 380 200 L 410 200" stroke="#bdbdbd" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 560 200 L 590 200" stroke="#bdbdbd" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#bdbdbd" />
    </marker>
  </defs>
</svg>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f8f9fa" rx="20"/>
  <text x="400" y="50" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">MCP 协议架构: Client-Host-Server</text>
  
  <!-- MCP Client -->
  <g transform="translate(50, 120)">
    <rect width="180" height="150" rx="15" fill="#e3f2fd" stroke="#2196f3" stroke-width="3"/>
    <text x="90" y="40" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#1565c0">MCP Client</text>
    <text x="90" y="80" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">大语言模型</text>
    <text x="90" y="110" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(Claude, GPT, etc.)</text>
  </g>
  
  <!-- MCP Host -->
  <g transform="translate(310, 120)">
    <rect width="180" height="150" rx="15" fill="#fff9c4" stroke="#fbc02d" stroke-width="3"/>
    <text x="90" y="40" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#f57f17">MCP Host</text>
    <text x="90" y="80" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">运行环境/IDE</text>
    <text x="90" y="110" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(Claude Desktop, Trae)</text>
  </g>
  
  <!-- MCP Server -->
  <g transform="translate(570, 120)">
    <rect width="180" height="150" rx="15" fill="#e8f5e9" stroke="#4caf50" stroke-width="3"/>
    <text x="90" y="40" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#1b5e20">MCP Server</text>
    <text x="90" y="80" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">资源与工具</text>
    <text x="90" y="110" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(GitHub, DB, Local Files)</text>
  </g>
  
  <!-- Protocol Arrows -->
  <path d="M 230 195 L 310 195" stroke="#bdbdbd" stroke-width="4" marker-end="url(#arrowhead)"/>
  <path d="M 490 195 L 570 195" stroke="#bdbdbd" stroke-width="4" marker-end="url(#arrowhead)"/>
  
  <text x="270" y="180" font-family="Arial" font-size="12" text-anchor="middle" fill="#9e9e9e">Standard API</text>
  <text x="530" y="180" font-family="Arial" font-size="12" text-anchor="middle" fill="#9e9e9e">JSON-RPC</text>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#bdbdbd" />
    </marker>
  </defs>
</svg>
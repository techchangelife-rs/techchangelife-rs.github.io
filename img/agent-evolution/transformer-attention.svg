<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f8f9fa" rx="20"/>
  <text x="400" y="50" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">Transformer 注意力机制 (Attention)</text>
  
  <!-- Query, Key, Value -->
  <g transform="translate(100, 150)">
    <rect width="100" height="40" rx="5" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
    <text x="50" y="25" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#1565c0">Query (问)</text>
  </g>
  
  <g transform="translate(100, 220)">
    <rect width="100" height="40" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="50" y="25" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b5e20">Key (索引)</text>
  </g>
  
  <g transform="translate(100, 290)">
    <rect width="100" height="40" rx="5" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="50" y="25" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#e65100">Value (值)</text>
  </g>
  
  <!-- Attention Weights -->
  <g transform="translate(350, 180)">
    <circle cx="50" cy="50" r="50" fill="#f3e5f5" stroke="#9c27b0" stroke-width="3"/>
    <text x="50" y="45" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#4a148c">Attention</text>
    <text x="50" y="65" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#4a148c">Scores</text>
  </g>
  
  <!-- Result -->
  <g transform="translate(600, 200)">
    <path d="M 0 0 L 100 0 L 120 40 L -20 40 Z" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
    <text x="50" y="25" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#263238">Context Vector</text>
  </g>
  
  <!-- Arrows -->
  <path d="M 200 170 L 350 210" stroke="#bdbdbd" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 200 240 L 350 230" stroke="#bdbdbd" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 450 230 L 600 220" stroke="#bdbdbd" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#bdbdbd" />
    </marker>
  </defs>
</svg>
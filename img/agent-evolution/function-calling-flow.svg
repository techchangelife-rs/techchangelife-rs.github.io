<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f8f9fa" rx="20"/>
  <text x="400" y="50" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">Function Calling 工作流</text>
  
  <!-- User -->
  <g transform="translate(50, 150)">
    <circle cx="40" cy="40" r="35" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
    <text x="40" y="45" font-family="Arial" font-size="12" text-anchor="middle" fill="#1565c0">User</text>
  </g>
  
  <!-- LLM -->
  <g transform="translate(250, 120)">
    <rect width="120" height="100" rx="10" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
    <text x="60" y="45" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#4a148c">LLM</text>
    <text x="60" y="75" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">意图识别</text>
  </g>
  
  <!-- Tool Definition -->
  <g transform="translate(250, 250)">
    <rect width="120" height="80" rx="5" fill="#fff9c4" stroke="#fbc02d" stroke-width="2"/>
    <text x="60" y="30" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#f57f17">Skills 定义</text>
    <text x="60" y="55" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">JSON Schema</text>
  </g>
  
  <!-- Action -->
  <g transform="translate(500, 120)">
    <rect width="120" height="100" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="60" y="45" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">Function Call</text>
    <text x="60" y="75" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">{ name: "...", args: {...} }</text>
  </g>
  
  <!-- Execution -->
  <g transform="translate(700, 150)">
    <rect width="60" height="60" rx="30" fill="#ffebee" stroke="#f44336" stroke-width="2"/>
    <text x="30" y="35" font-family="Arial" font-size="12" text-anchor="middle" fill="#c62828">API</text>
  </g>
  
  <!-- Arrows -->
  <path d="M 125 190 L 250 170" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 310 250 L 310 220" stroke="#fbc02d" stroke-dasharray="5,5" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 370 170 L 500 170" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 620 170 L 700 180" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9e9e9e" />
    </marker>
  </defs>
</svg>
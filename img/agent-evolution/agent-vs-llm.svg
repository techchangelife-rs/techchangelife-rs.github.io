<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa" rx="20"/>
  
  <!-- LLM Section -->
  <g transform="translate(50, 50)">
    <rect width="300" height="300" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="15"/>
    <text x="150" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#1565c0">LLM (大模型)</text>
    <circle cx="150" cy="150" r="60" fill="#bbdefb" stroke="#1976d2" stroke-width="2"/>
    <text x="150" y="155" font-family="Arial" font-size="16" text-anchor="middle" fill="#0d47a1">Brain (大脑)</text>
    <text x="150" y="240" font-family="Arial" font-size="14" text-anchor="middle" fill="#424242">博学但无法行动</text>
    <text x="150" y="260" font-family="Arial" font-size="14" text-anchor="middle" fill="#424242">只会“预测下一个词”</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 370 200 L 430 200" stroke="#bdbdbd" stroke-width="4" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#bdbdbd" />
    </marker>
  </defs>
  
  <!-- Agent Section -->
  <g transform="translate(450, 50)">
    <rect width="300" height="300" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="15"/>
    <text x="150" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#2e7d32">AI Agent (智能体)</text>
    
    <!-- Brain with Body -->
    <circle cx="150" cy="120" r="40" fill="#c8e6c9" stroke="#388e3c" stroke-width="2"/>
    <text x="150" y="125" font-family="Arial" font-size="14" text-anchor="middle" fill="#1b5e20">Brain</text>
    
    <!-- Hands/Tools -->
    <rect x="70" y="180" width="60" height="30" rx="5" fill="#a5d6a7" stroke="#2e7d32"/>
    <text x="100" y="200" font-family="Arial" font-size="12" text-anchor="middle" fill="#1b5e20">Tools</text>
    
    <rect x="170" y="180" width="60" height="30" rx="5" fill="#a5d6a7" stroke="#2e7d32"/>
    <text x="200" y="200" font-family="Arial" font-size="12" text-anchor="middle" fill="#1b5e20">Memory</text>
    
    <rect x="100" y="230" width="100" height="30" rx="5" fill="#a5d6a7" stroke="#2e7d32"/>
    <text x="150" y="250" font-family="Arial" font-size="12" text-anchor="middle" fill="#1b5e20">Planning</text>
    
    <text x="150" y="290" font-family="Arial" font-size="14" text-anchor="middle" fill="#424242">能拿结果的“数字员工”</text>
  </g>
</svg>
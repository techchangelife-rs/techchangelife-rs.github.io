<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#f8f9fa" rx="20"/>
  <text x="400" y="50" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">Agent 记忆架构: 记忆栈</text>
  
  <!-- Level 1: Working Memory -->
  <g transform="translate(150, 100)">
    <rect width="500" height="80" rx="10" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
    <text x="250" y="35" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#1565c0">工作记忆 (Working Memory)</text>
    <text x="250" y="65" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">当前的对话上下文 (Context Window), 极其敏捷</text>
  </g>
  
  <!-- Level 2: Episodic Memory -->
  <g transform="translate(150, 200)">
    <rect width="500" height="80" rx="10" fill="#fff9c4" stroke="#fbc02d" stroke-width="2"/>
    <text x="250" y="35" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#f57f17">情节记忆 (Episodic Memory)</text>
    <text x="250" y="65" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">过去的成功/失败案例 (History Summaries), 经验积累</text>
  </g>
  
  <!-- Level 3: Semantic Memory -->
  <g transform="translate(150, 300)">
    <rect width="500" height="80" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="250" y="35" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#1b5e20">语义记忆 (Semantic Memory)</text>
    <text x="250" y="65" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">外部知识库 (Vector DB / RAG), 海量检索</text>
  </g>
  
  <!-- Level 4: Procedural Memory -->
  <g transform="translate(150, 400)">
    <rect width="500" height="60" rx="10" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
    <text x="250" y="35" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#4a148c">程序记忆 (Procedural Memory)</text>
    <text x="250" y="55" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Skills/工具的操作规范, 形成本能</text>
  </g>
  
  <!-- Retrieval Arrows -->
  <path d="M 100 430 Q 50 250 100 140" stroke="#9e9e9e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="40" y="250" font-family="Arial" font-size="12" transform="rotate(-90, 40, 250)" fill="#666">记忆提取 (Retrieval)</text>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9e9e9e" />
    </marker>
  </defs>
</svg>
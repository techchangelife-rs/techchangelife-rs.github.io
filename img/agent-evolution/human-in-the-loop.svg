<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f8f9fa" rx="20"/>
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Human-in-the-Loop (人类在环) 安全审计</text>
  
  <!-- Agent Process -->
  <g transform="translate(50, 150)">
    <rect width="150" height="100" rx="10" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
    <text x="75" y="45" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565c0">Agent 生成</text>
    <text x="75" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">拟定计划或代码</text>
  </g>
  
  <!-- Approval Checkpoint -->
  <g transform="translate(325, 125)">
    <rect width="150" height="150" rx="75" fill="#fff9c4" stroke="#fbc02d" stroke-width="3"/>
    <text x="75" y="70" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#f57f17">人类审查点</text>
    <text x="75" y="95" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">风险评估与授权</text>
    
    <!-- Checkmark & X -->
    <text x="40" y="130" font-family="Arial" font-size="20" fill="#4caf50">✅</text>
    <text x="110" y="130" font-family="Arial" font-size="20" fill="#f44336">❌</text>
  </g>
  
  <!-- Execution -->
  <g transform="translate(600, 150)">
    <rect width="150" height="100" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="75" y="45" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">执行任务</text>
    <text x="75" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">修改数据库/发邮件</text>
  </g>
  
  <!-- Arrows -->
  <path d="M 200 200 L 325 200" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 475 200 L 600 200" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 400 275 Q 400 350 125 350 L 125 250" fill="none" stroke="#f44336" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="250" y="340" font-family="Arial" font-size="12" fill="#f44336">拒绝并重试 (Feedback)</text>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9e9e9e" />
    </marker>
  </defs>
</svg>
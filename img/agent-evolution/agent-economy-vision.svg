<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#f8f9fa" rx="20"/>
  <text x="400" y="50" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">智能体经济 (Agentic Economy) 全景图</text>
  
  <!-- Human Center -->
  <g transform="translate(350, 200)">
    <circle cx="50" cy="50" r="60" fill="#e3f2fd" stroke="#2196f3" stroke-width="4"/>
    <text x="50" y="55" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#1565c0">人类</text>
    <text x="50" y="80" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">(目标定义者)</text>
  </g>
  
  <!-- Agents Network -->
  <g transform="translate(100, 100)">
    <circle cx="30" cy="30" r="25" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="30" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b5e20">Finance</text>
  </g>
  
  <g transform="translate(600, 100)">
    <circle cx="30" cy="30" r="25" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="30" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b5e20">Health</text>
  </g>
  
  <g transform="translate(100, 350)">
    <circle cx="30" cy="30" r="25" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="30" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b5e20">Code</text>
  </g>
  
  <g transform="translate(600, 350)">
    <circle cx="30" cy="30" r="25" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="30" y="35" font-family="Arial" font-size="10" text-anchor="middle" fill="#1b5e20">Legal</text>
  </g>
  
  <!-- Connections -->
  <line x1="400" y1="200" x2="130" y2="130" stroke="#bdbdbd" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="400" y1="200" x2="600" y2="130" stroke="#bdbdbd" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="400" y1="300" x2="130" y2="350" stroke="#bdbdbd" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="400" y1="300" x2="600" y2="350" stroke="#bdbdbd" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Future Vision -->
  <text x="400" y="450" font-family="Arial" font-size="16" font-style="italic" text-anchor="middle" fill="#666">“人机共生”：从工具到伙伴，从对话到协作</text>
</svg>
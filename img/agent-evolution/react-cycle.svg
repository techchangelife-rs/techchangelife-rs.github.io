<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f8f9fa" rx="20"/>
  
  <text x="400" y="50" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">ReAct (Reason + Act) 循环模型</text>
  
  <!-- Thought (Reasoning) -->
  <g transform="translate(100, 100)">
    <circle cx="100" cy="100" r="70" fill="#fff9c4" stroke="#fbc02d" stroke-width="3"/>
    <text x="100" y="105" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#f57f17">Thought (思考)</text>
    <text x="100" y="130" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">大模型逻辑推理</text>
  </g>
  
  <!-- Action -->
  <g transform="translate(300, 100)">
    <circle cx="100" cy="100" r="70" fill="#e1f5fe" stroke="#0288d1" stroke-width="3"/>
    <text x="100" y="105" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#01579b">Action (行动)</text>
    <text x="100" y="130" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">调用 Skill/工具</text>
  </g>
  
  <!-- Observation -->
  <g transform="translate(500, 100)">
    <circle cx="100" cy="100" r="70" fill="#e8f5e9" stroke="#388e3c" stroke-width="3"/>
    <text x="100" y="105" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1b5e20">Observation (反馈)</text>
    <text x="100" y="130" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">收集工具反馈数据</text>
  </g>
  
  <!-- Arrows -->
  <path d="M 270 200 L 330 200" stroke="#9e9e9e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M 470 200 L 530 200" stroke="#9e9e9e" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M 670 200 Q 750 350 400 350 Q 50 350 130 200" fill="none" stroke="#9e9e9e" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9e9e9e" />
    </marker>
  </defs>
  
  <text x="400" y="380" font-family="Arial" font-size="16" font-style="italic" text-anchor="middle" fill="#666">循环直至任务完成</text>
</svg>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f8f9fa" rx="20"/>
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">RAG 长期记忆工作流</text>
  
  <!-- Documents -->
  <g transform="translate(50, 100)">
    <rect width="120" height="150" fill="#fff" stroke="#9e9e9e" stroke-width="2" rx="5"/>
    <text x="60" y="80" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">原始文档</text>
    <path d="M 40 100 L 80 100 M 40 120 L 80 120" stroke="#eee" stroke-width="2"/>
  </g>
  
  <!-- Embedding -->
  <g transform="translate(220, 150)">
    <rect width="120" height="50" rx="10" fill="#e1f5fe" stroke="#03a9f4" stroke-width="2"/>
    <text x="60" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="#01579b">Embedding</text>
  </g>
  
  <!-- Vector DB -->
  <g transform="translate(420, 100)">
    <path d="M 0 20 Q 0 0 60 0 Q 120 0 120 20 L 120 130 Q 120 150 60 150 Q 0 150 0 130 Z" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="60" y="80" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b5e20">向量数据库</text>
    <text x="60" y="105" font-family="Arial" font-size="12" text-anchor="middle" fill="#388e3c">(长期记忆)</text>
  </g>
  
  <!-- Agent Retrieval -->
  <g transform="translate(630, 150)">
    <circle cx="50" cy="25" r="40" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="50" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="#e65100">Agent</text>
  </g>
  
  <!-- Arrows -->
  <path d="M 170 175 L 220 175" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 340 175 L 420 175" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 540 175 L 630 175" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 630 140 Q 500 80 480 100" fill="none" stroke="#ff9800" stroke-dasharray="5,5" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="550" y="100" font-family="Arial" font-size="12" fill="#e65100">语义检索 (Query)</text>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9e9e9e" />
    </marker>
  </defs>
</svg>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f4f7f6" rx="15"/>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">图 4.1: SOUL 协议执行流 (ReAct Loop)</text>
  
  <!-- Step 1: Input -->
  <rect x="50" y="80" width="120" height="60" rx="5" fill="#3498db"/>
  <text x="110" y="115" text-anchor="middle" fill="#fff" font-weight="bold">用户输入</text>
  
  <!-- Step 2: Thought -->
  <rect x="220" y="80" width="120" height="60" rx="5" fill="#9b59b6"/>
  <text x="280" y="115" text-anchor="middle" fill="#fff" font-weight="bold">内省思考</text>
  <text x="280" y="155" text-anchor="middle" font-size="10" fill="#666">(Chain of Thought)</text>

  <!-- Step 3: Action -->
  <rect x="390" y="80" width="120" height="60" rx="5" fill="#e67e22"/>
  <text x="450" y="115" text-anchor="middle" fill="#fff" font-weight="bold">工具调用</text>
  <text x="450" y="155" text-anchor="middle" font-size="10" fill="#666">(Tool Execution)</text>

  <!-- Step 4: Observation -->
  <rect x="560" y="80" width="120" height="60" rx="5" fill="#2ecc71"/>
  <text x="620" y="115" text-anchor="middle" fill="#fff" font-weight="bold">结果观察</text>
  <text x="620" y="155" text-anchor="middle" font-size="10" fill="#666">(Environment Feedback)</text>

  <!-- Step 5: Final Response -->
  <rect x="630" y="280" width="120" height="60" rx="5" fill="#2c3e50"/>
  <text x="690" y="315" text-anchor="middle" fill="#fff" font-weight="bold">最终回复</text>

  <!-- 箭头 -->
  <path d="M170,110 L220,110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M340,110 L390,110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M510,110 L560,110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M620,140 L620,280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M560,110 Q400,250 280,140" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="420" y="210" fill="#e74c3c" font-size="12" font-weight="bold">循环修正 (Self-Correction)</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>
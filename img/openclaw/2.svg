<svg width="800" height="550" viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#49B1F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <stop offset="0%" style="stop-color:#49B1F5;stop-opacity:1" />
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" />
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 1. 接入层 (Ingress Layer) -->
  <rect x="100" y="80" width="600" height="80" rx="10" fill="url(#grad1)" filter="url(#shadow)"/>
  <text x="400" y="115" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">L1: 接入层 (Multi-Channel Ingress)</text>
  <text x="400" y="140" text-anchor="middle" fill="#eee" font-size="12">WhatsApp | Telegram | Slack | 飞书 | CLI | WebUI</text>

  <!-- 2. 控制平面 (Control Plane) -->
  <rect x="100" y="190" width="600" height="120" rx="10" fill="#fff" stroke="#2c3e50" stroke-width="2"/>
  <text x="400" y="220" text-anchor="middle" fill="#2c3e50" font-size="18" font-weight="bold">L2: 核心网关 (Gateway Engine)</text>
  <rect x="120" y="235" width="140" height="50" rx="5" fill="#f1f2f6"/>
  <text x="190" y="265" text-anchor="middle" fill="#555" font-size="11">会话管理器 (Session)</text>
  <rect x="280" y="235" width="140" height="50" rx="5" fill="#f1f2f6"/>
  <text x="350" y="265" text-anchor="middle" fill="#555" font-size="11">路由/鉴权 (Auth)</text>
  <rect x="440" y="235" width="140" height="50" rx="5" fill="#f1f2f6"/>
  <text x="510" y="265" text-anchor="middle" fill="#555" font-size="11">SOUL 协议解析</text>
  <rect x="600" y="235" width="80" height="50" rx="5" fill="#f1f2f6"/>
  <text x="640" y="265" text-anchor="middle" fill="#555" font-size="11">Memory</text>

  <!-- 3. 推理与模型层 (Cognition Layer) -->
  <rect x="100" y="340" width="280" height="100" rx="10" fill="#e74c3c" filter="url(#shadow)"/>
  <text x="240" y="380" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">L3a: 推理大脑 (Agent)</text>
  <text x="240" y="405" text-anchor="middle" fill="#eee" font-size="11">Claude 3.6 / GPT-5.3 / Qwen-Agent</text>

  <!-- 4. 执行与工具层 (Execution Layer) -->
  <rect x="420" y="340" width="280" height="100" rx="10" fill="#2ecc71" filter="url(#shadow)"/>
  <text x="560" y="380" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">L3b: 执行沙箱 (Skills)</text>
  <text x="560" y="405" text-anchor="middle" fill="#eee" font-size="11">Docker | Browser | CLI | MCP Tools</text>

  <!-- 箭头 -->
  <path d="M400,160 L400,190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M240,310 L240,340" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M560,310 L560,340" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M380,390 L420,390" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" marker-start="url(#arrowhead)"/>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <text x="400" y="500" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">图 2.2: OpenClaw 工业级分层架构拓扑</text>
  <text x="400" y="525" text-anchor="middle" font-size="11" fill="#999">本架构图详细展示了从用户输入到网关处理，再到大脑推理与沙箱执行的闭环逻辑</text>
</svg>
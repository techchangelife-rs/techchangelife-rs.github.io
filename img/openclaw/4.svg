<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#f8f9fa" rx="10"/>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">图 5.1: OpenClaw 层次化记忆拓扑 (Hierarchical Memory)</text>

  <!-- L1: Ephemeral Memory -->
  <rect x="250" y="80" width="300" height="80" rx="10" fill="#49B1F5" opacity="0.9"/>
  <text x="400" y="115" text-anchor="middle" fill="#fff" font-weight="bold" font-size="16">L1: 瞬时记忆 (Ephemeral)</text>
  <text x="400" y="140" text-anchor="middle" fill="#eee" font-size="11">当前会话上下文 | 仅存在于内存 | 极高响应</text>

  <!-- L2: Working Memory -->
  <rect x="200" y="180" width="400" height="100" rx="10" fill="#3498db" opacity="0.9"/>
  <text x="400" y="215" text-anchor="middle" fill="#fff" font-weight="bold" font-size="16">L2: 工作记忆 (Working Memory)</text>
  <text x="400" y="240" text-anchor="middle" fill="#eee" font-size="11">~/.openclaw/sessions/*.json | 最近的任务记录 | 磁盘缓存</text>

  <!-- L3: Long-term Memory -->
  <rect x="150" y="300" width="500" height="100" rx="10" fill="#2c3e50" opacity="0.9"/>
  <text x="400" y="335" text-anchor="middle" fill="#fff" font-weight="bold" font-size="16">L3: 长期记忆 (Long-term / Knowledge Base)</text>
  <text x="400" y="360" text-anchor="middle" fill="#eee" font-size="11">Markdown 知识库 | 用户偏好 | 历史成功案例 | Git 托管</text>

  <!-- 数据流箭头 -->
  <path d="M400,160 L400,180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M400,280 L400,300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="410" y="175" font-size="10" fill="#666">持久化 (Persistence)</text>
  <text x="410" y="295" font-size="10" fill="#666">抽象与压缩 (Summarization)</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
</svg>
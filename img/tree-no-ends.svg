<svg width="400" height="120" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="120" fill="#f1f8e9" rx="10"/>
  <!-- 墙壁/建筑 -->
  <rect x="30" y="40" width="40" height="50" fill="#cfd8dc"/>
  <rect x="330" y="40" width="40" height="50" fill="#cfd8dc"/>
  <line x1="70" y1="80" x2="330" y2="80" stroke="#8d6e63" stroke-width="4"/>
  
  <!-- 树 -->
  <g transform="translate(135, 40)">
    <path d="M0 0 L10 30 L-10 30 Z" fill="#2e7d32"/>
    <rect x="-2" y="30" width="4" height="10" fill="#5d4037"/>
  </g>
  <g transform="translate(265, 40)">
    <path d="M0 0 L10 30 L-10 30 Z" fill="#2e7d32"/>
    <rect x="-2" y="30" width="4" height="10" fill="#5d4037"/>
  </g>
  
  <!-- 间隔标注 -->
  <path d="M 70 90 L 70 100 L 135 100 L 135 90" fill="none" stroke="#fb8c00" stroke-width="2"/>
  <path d="M 135 90 L 135 100 L 265 100 L 265 90" fill="none" stroke="#fb8c00" stroke-width="2"/>
  <path d="M 265 90 L 265 100 L 330 100 L 330 90" fill="none" stroke="#fb8c00" stroke-width="2"/>
  
  <text x="200" y="20" font-family="Arial" font-size="14" fill="#1b5e20" text-anchor="middle" font-weight="bold">两端都不种：树 = 间隔 - 1</text>
  <text x="200" y="115" font-family="Arial" font-size="12" fill="#e65100" text-anchor="middle">3个间隔，2棵树</text>
</svg>

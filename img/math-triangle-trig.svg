<svg width="800" height="1200" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="1200" fill="#f4f6f7" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#16a085">三角形中的三角函数深度图解</text>
  
  <!-- Section 1: Right Triangle Trig -->
  <g transform="translate(50, 80)">
    <rect width="700" height="320" rx="15" fill="#ffffff" stroke="#1abc9c" stroke-width="2" />
    <text x="350" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1abc9c">1. 直角三角形定义 (Right Triangle Definitions)</text>
    
    <g transform="translate(50, 60)">
      <path d="M 0 150 L 250 150 L 0 0 Z" fill="#e8f8f5" stroke="#16a085" stroke-width="3" />
      <rect x="0" y="140" width="10" height="10" fill="none" stroke="#16a085" stroke-width="1" />
      <text x="-35" y="75" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333" transform="rotate(-90, -35, 75)">对边 (Opposite)</text>
      <text x="125" y="170" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">邻边 (Adjacent)</text>
      <text x="140" y="60" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333" transform="rotate(-31, 140, 60)">斜边 (Hypotenuse)</text>
      <text x="25" y="140" font-family="Arial, sans-serif" font-size="18" fill="#16a085">θ</text>
    </g>
    
    <g transform="translate(400, 80)">
      <text x="0" y="0" font-family="Times New Roman, serif" font-size="22" font-weight="bold" fill="#16a085">sin θ = Opp / Hyp</text>
      <text x="0" y="40" font-family="Times New Roman, serif" font-size="22" font-weight="bold" fill="#16a085">cos θ = Adj / Hyp</text>
      <text x="0" y="80" font-family="Times New Roman, serif" font-size="22" font-weight="bold" fill="#16a085">tan θ = Opp / Adj</text>
      <text x="0" y="120" font-family="Arial, sans-serif" font-size="14" fill="#666">口诀：SOH CAH TOA</text>
    </g>
  </g>
  
  <!-- Section 2: Special Values Table (Visual) -->
  <g transform="translate(50, 420)">
    <rect width="700" height="200" rx="15" fill="#ffffff" stroke="#2c3e50" stroke-width="2" />
    <text x="350" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">2. 特殊角函数值表 (Special Values)</text>
    
    <g transform="translate(50, 60)">
      <rect width="600" height="100" fill="#f8f9fa" />
      <line x1="0" y1="33" x2="600" y2="33" stroke="#dee2e6" />
      <line x1="0" y1="66" x2="600" y2="66" stroke="#dee2e6" />
      <line x1="150" y1="0" x2="150" y2="100" stroke="#dee2e6" />
      <line x1="300" y1="0" x2="300" y2="100" stroke="#dee2e6" />
      <line x1="450" y1="0" x2="450" y2="100" stroke="#dee2e6" />
      
      <text x="75" y="22" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">θ</text>
      <text x="225" y="22" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">30°</text>
      <text x="375" y="22" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">45°</text>
      <text x="525" y="22" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">60°</text>
      
      <text x="75" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">sin θ</text>
      <text x="225" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">1/2</text>
      <text x="375" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">√2/2</text>
      <text x="525" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">√3/2</text>
      
      <text x="75" y="88" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">cos θ</text>
      <text x="225" y="88" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">√3/2</text>
      <text x="375" y="88" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">√2/2</text>
      <text x="525" y="88" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">1/2</text>
    </g>
  </g>
  
  <!-- Section 3: Laws for All Triangles -->
  <g transform="translate(50, 640)">
    <rect width="700" height="480" rx="15" fill="#ffffff" stroke="#2980b9" stroke-width="2" />
    <text x="350" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2980b9">3. 普适定理 (Laws for Any Triangle)</text>
    
    <g transform="translate(100, 80)">
      <path d="M 0 150 L 300 150 L 200 50 Z" fill="#ebf5fb" stroke="#2980b9" stroke-width="2" />
      <text x="150" y="170" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">a</text>
      <text x="80" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">b</text>
      <text x="260" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">c</text>
      <text x="195" y="75" font-family="Arial, sans-serif" font-size="14" fill="#2980b9">A</text>
    </g>
    
    <g transform="translate(50, 260)">
      <rect width="600" height="80" rx="10" fill="#f4f6f7" stroke="#2980b9" stroke-width="1" />
      <text x="300" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2980b9">正弦定理 (Law of Sines)</text>
      <text x="300" y="60" font-family="Times New Roman, serif" font-size="22" text-anchor="middle" fill="#333">a / sin A = b / sin B = c / sin C = 2R</text>
    </g>
    
    <g transform="translate(50, 360)">
      <rect width="600" height="80" rx="10" fill="#f4f6f7" stroke="#2980b9" stroke-width="1" />
      <text x="300" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2980b9">余弦定理 (Law of Cosines)</text>
      <text x="300" y="60" font-family="Times New Roman, serif" font-size="22" text-anchor="middle" fill="#333">a² = b² + c² - 2bc · cos A</text>
    </g>
  </g>
</svg>
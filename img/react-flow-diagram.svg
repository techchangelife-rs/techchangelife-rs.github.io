<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#fff9f0" rx="10" ry="10" />
  
  <!-- Step 1: Thought -->
  <rect x="50" y="50" width="120" height="60" rx="8" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" />
  <text x="110" y="85" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#2196f3">推理 (Thought)</text>
  
  <!-- Step 2: Action -->
  <rect x="240" y="50" width="120" height="60" rx="8" fill="#fce4ec" stroke="#e91e63" stroke-width="2" />
  <text x="300" y="85" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#e91e63">行动 (Action)</text>
  
  <!-- Step 3: Observation -->
  <rect x="430" y="50" width="120" height="60" rx="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" />
  <text x="490" y="85" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#4caf50">观察 (Observation)</text>
  
  <!-- Loop Arrows -->
  <path d="M 170 80 L 230 80" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow-head)" />
  <path d="M 360 80 L 420 80" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow-head)" />
  <path d="M 490 110 Q 490 180 300 180 Q 110 180 110 120" stroke="#666" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow-head)" />
  <text x="300" y="200" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">循环迭代直至任务完成</text>
  
  <!-- Example Content -->
  <rect x="50" y="230" width="500" height="130" rx="10" fill="white" stroke="#ccc" />
  <text x="70" y="255" font-family="Arial" font-size="13" font-weight="bold" fill="#333">ReAct 实例：查询某公司财报</text>
  <text x="70" y="280" font-family="Arial" font-size="12" fill="#2196f3">Thought: 我需要先找到该公司 2024 年的财报链接。</text>
  <text x="70" y="300" font-family="Arial" font-size="12" fill="#e91e63">Action: Search("Apple 2024 annual report")</text>
  <text x="70" y="320" font-family="Arial" font-size="12" fill="#4caf50">Observation: 找到官方 PDF 链接，正在读取关键数据...</text>
  <text x="70" y="340" font-family="Arial" font-size="12" fill="#2196f3">Thought: 接下来我将提取净利润数据并进行对比。</text>
  
  <!-- Arrow Definition -->
  <defs>
    <marker id="arrow-head" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666" />
    </marker>
  </defs>
</svg>
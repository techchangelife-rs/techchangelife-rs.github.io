<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
  </defs>
  <rect width="800" height="350" fill="url(#bg)"/>
  
  <!-- F = ma Section -->
  <g transform="translate(50, 20)">
    <rect width="320" height="280" rx="15" fill="#fff" stroke="#dee2e6" stroke-width="2"/>
    <text x="160" y="40" font-family="sans-serif" font-size="20" font-weight="bold" fill="#343a40" text-anchor="middle">牛顿第二定律：杀球的秘密</text>
    
    <text x="160" y="90" font-family="monospace" font-size="36" font-weight="bold" fill="#e63946" text-anchor="middle">F = m × a</text>
    
    <g transform="translate(160, 130)" font-family="sans-serif" font-size="14" fill="#495057" text-anchor="middle">
      <text y="0"><tspan font-weight="bold" fill="#e63946">F (力)</tspan> = 你挥拍的破坏力！</text>
      <text y="30"><tspan font-weight="bold" fill="#e63946">m (质量)</tspan> = 手臂+球拍的重量</text>
      <text y="60"><tspan font-weight="bold" fill="#e63946">a (加速度)</tspan> = 挥拍瞬间提速有多猛</text>
    </g>

    <path d="M 60,220 Q 160,200 260,220" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="160" y="250" font-family="sans-serif" font-size="13" fill="#6c757d" text-anchor="middle">结论：胳膊不用粗，挥得快(a大)才是王道！</text>
  </g>

  <!-- Air Drag Section -->
  <g transform="translate(430, 20)">
    <rect width="320" height="280" rx="15" fill="#fff" stroke="#dee2e6" stroke-width="2"/>
    <text x="160" y="40" font-family="sans-serif" font-size="20" font-weight="bold" fill="#343a40" text-anchor="middle">空气阻力公式：降落伞魔法</text>
    
    <text x="160" y="90" font-family="monospace" font-size="28" font-weight="bold" fill="#4361ee" text-anchor="middle">F<tspan font-size="18" dy="10">d</tspan><tspan dy="-10"> = ½ρv²C</tspan><tspan font-size="18" dy="10">d</tspan><tspan dy="-10">A</tspan></text>
    
    <g transform="translate(40, 130)" font-family="sans-serif" font-size="13" fill="#495057">
      <text x="0" y="0"><tspan font-weight="bold" fill="#4361ee">ρ (空气密度)</tspan>: 天气冷/低海拔，阻力大</text>
      <text x="0" y="25"><tspan font-weight="bold" fill="#4361ee">v² (速度平方)</tspan>: 球越快，阻力"疯狂"翻倍</text>
      <text x="0" y="50"><tspan font-weight="bold" fill="#4361ee">Cd (风阻系数)</tspan>: 羽毛球的形状天生招风</text>
      <text x="0" y="75"><tspan font-weight="bold" fill="#4361ee">A (迎风面积)</tspan>: 裙摆越大，刹车越狠</text>
    </g>

    <!-- Parachute Icon -->
    <path d="M 230,170 Q 260,150 290,170 L 260,210 Z" fill="#e0fbfc" stroke="#4361ee" stroke-width="2"/>
    <line x1="240" y1="175" x2="260" y2="210" stroke="#4361ee"/>
    <line x1="280" y1="175" x2="260" y2="210" stroke="#4361ee"/>
    <circle cx="260" cy="215" r="4" fill="#ef233c"/>

    <text x="160" y="250" font-family="sans-serif" font-size="13" fill="#6c757d" text-anchor="middle">结论：这哪里是球，明明是个微型降落伞！</text>
  </g>
</svg>
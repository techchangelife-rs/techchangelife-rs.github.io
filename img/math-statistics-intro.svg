<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" fill="#f5f5f5" rx="10"/>
  
  <!-- 正字计数法 -->
  <g transform="translate(30, 30)">
    <text x="0" y="0" font-family="Arial" font-size="14" fill="#333" font-weight="bold">1. 收集数据 (正字法)</text>
    <text x="10" y="30" font-family="Arial" font-size="16" fill="#1976D2">苹果：正 正 (10)</text>
    <text x="10" y="55" font-family="Arial" font-size="16" fill="#388E3C">香蕉：正 丅 (7)</text>
    <text x="10" y="80" font-family="Arial" font-size="16" fill="#F57C00">梨子：正 (5)</text>
  </g>
  
  <!-- 条形统计图 -->
  <g transform="translate(220, 160)">
    <text x="30" y="-135" font-family="Arial" font-size="14" fill="#333" font-weight="bold" text-anchor="middle">2. 统计图</text>
    <!-- 坐标轴 -->
    <line x1="0" y1="0" x2="150" y2="0" stroke="#666" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#666" stroke-width="2"/>
    
    <!-- 矩形条 -->
    <rect x="15" y="-100" width="25" height="100" fill="#1976D2" opacity="0.8"/> <!-- 10 -->
    <rect x="55" y="-70" width="25" height="70" fill="#388E3C" opacity="0.8"/>   <!-- 7 -->
    <rect x="95" y="-50" width="25" height="50" fill="#F57C00" opacity="0.8"/>   <!-- 5 -->
    
    <!-- 标签 -->
    <text x="27" y="15" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">苹果</text>
    <text x="67" y="15" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">香蕉</text>
    <text x="107" y="15" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">梨子</text>
  </g>
</svg>

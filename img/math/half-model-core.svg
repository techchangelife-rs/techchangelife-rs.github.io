<svg width="500" height="280" viewBox="0 0 500 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e64980"/>
    </marker>
  </defs>

  <!-- 背景标签 -->
  <text x="10" y="20" font-size="14" fill="#666">【图1：一半模型核心原理】</text>

  <!-- 长方形 ABCD -->
  <rect x="80" y="60" width="340" height="140" fill="none" stroke="#495057" stroke-width="2.5"/>

  <!-- 顶点标签 -->
  <text x="70" y="75" font-size="14" fill="#495057">A</text>
  <text x="425" y="75" font-size="14" fill="#495057">B</text>
  <text x="70" y="215" font-size="14" fill="#495057">D</text>
  <text x="425" y="215" font-size="14" fill="#495057">C</text>

  <!-- 三角形：顶点在A正上方（特殊情况） -->
  <polygon points="80,200 420,200 80,60" fill="#ff9a9e" opacity="0.5" stroke="#e64980" stroke-width="2"/>
  <text x="60" y="135" font-size="13" fill="#e64980">左滑</text>
  <text x="60" y="150" font-size="13" fill="#e64980">到A</text>

  <!-- 虚线箭头：从左到右滑 -->
  <path d="M 80 45 L 420 45" stroke="#e64980" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="240" y="35" font-size="13" fill="#e64980">顶点"滑滑梯"路线</text>

  <!-- 标注：底=AB, 高=AD -->
  <path d="M 250 205 L 250 230" stroke="#868e96" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="250" y="248" font-size="12" fill="#868e96" text-anchor="middle">底 = AB（不变）</text>

  <path d="M 60" y="130" stroke="#868e96" stroke-width="1.5"/>
  <text x="25" y="135" font-size="12" fill="#868e96">高=AD</text>
  <text x="25" y="150" font-size="12" fill="#868e96">(不变)</text>

  <!-- 中间位置的三角（透明叠显） -->
  <polygon points="80,200 420,200 200,60" fill="#fab005" opacity="0.3" stroke="#fab005" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="200" y="50" font-size="12" fill="#fab005">←任意位置→</text>

  <!-- 右滑到B -->
  <polygon points="80,200 420,200 420,60" fill="#22863a" opacity="0.3" stroke="#22863a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="430" y="135" font-size="13" fill="#22863a">右滑到B</text>

  <!-- 公式框 -->
  <rect x="80" y="258" width="340" height="28" rx="6" fill="#fff0f6" stroke="#e64980" stroke-width="1.5"/>
  <text x="250" y="277" font-size="13" fill="#e64980" text-anchor="middle" font-weight="bold">S<sub>三角形</sub> = 长 × 宽 ÷ 2 = S<sub>长方形</sub> ÷ 2</text>
</svg>
<svg width="350" height="280" viewBox="0 0 350 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="350" height="280" fill="#f8f9fa"/>
  <text x="175" y="25" font-size="16" font-weight="bold" fill="#212529" text-anchor="middle">【例1图】四边形ABCD</text>

  <!-- 四边形 ABCD -->
  <!-- A(50,50) B(280,60) C(250,200) D(80,180) -->
  <polygon points="50,50 280,60 250,200 80,180" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <line x1="50" y1="50" x2="250" y2="200" stroke="#d6336c" stroke-width="2"/>
  <line x1="280" y1="60" x2="80" y2="180" stroke="#d6336c" stroke-width="2"/>

  <!-- 顶点 -->
  <circle cx="50" cy="50" r="4" fill="#d6336c"/>
  <text x="40" y="40" font-size="14" font-weight="bold" fill="#d6336c">A</text>
  <circle cx="280" cy="60" r="4" fill="#4c83ff"/>
  <text x="290" y="55" font-size="14" font-weight="bold" fill="#4c83ff">B</text>
  <circle cx="250" cy="200" r="4" fill="#d6336c"/>
  <text x="260" y="215" font-size="14" font-weight="bold" fill="#d6336c">C</text>
  <circle cx="80" cy="180" r="4" fill="#4c83ff"/>
  <text x="60" y="195" font-size="14" font-weight="bold" fill="#4c83ff">D</text>

  <!-- 交点 O -->
  <circle cx="162" cy="110" r="4" fill="#333"/>
  <text x="172" y="105" font-size="12" font-weight="bold">O</text>

  <!-- 面积标注 -->
  <text x="150" y="95" font-size="14" font-weight="bold" fill="#d6336c">S₁</text>
  <text x="180" y="100" font-size="14" font-weight="bold" fill="#333">S₂</text>
  <text x="175" y="170" font-size="14" font-weight="bold" fill="#4c83ff">S₃</text>
  <text x="110" y="155" font-size="14" font-weight="bold" fill="#333">S₄</text>
</svg>
<svg width="700" height="280" viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="280" fill="#f8f9fa"/>
  <!-- 标题 -->
  <text x="350" y="25" font-size="16" font-weight="bold" fill="#212529" text-anchor="middle">图4：燕尾模型证明——为什么底边比等于面积比？</text>

  <!-- 大三角形 ABC -->
  <!-- A(350,30) B(80,250) C(620,250) -->
  <polygon points="350,30 80,250 620,250" fill="#fff8e1" stroke="#ff8f00" stroke-width="2"/>

  <!-- 内部点 O，连到顶点 -->
  <circle cx="350" cy="130" r="6" fill="#d6336c"/>
  <line x1="350" y1="30" x2="350" y2="130" stroke="#d6336c" stroke-width="2"/>
  <line x1="80" y1="250" x2="350" y2="130" stroke="#1565c0" stroke-width="2"/>
  <line x1="620" y1="250" x2="350" y2="130" stroke="#1565c0" stroke-width="2"/>

  <!-- 底边 BC 上的点 D -->
  <circle cx="440" cy="250" r="5" fill="#333"/>
  <line x1="350" y1="130" x2="440" y2="250" stroke="#333" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- 同高线标注 -->
  <text x="360" y="85" font-size="13" fill="#d6336c">同高 h₁</text>
  <text x="215" y="200" font-size="13" fill="#1565c0">同高 h₂</text>
  <text x="530" y="200" font-size="13" fill="#1565c0">同高 h₂</text>

  <!-- 区域标注 -->
  <text x="350" y="70" font-size="14" font-weight="bold" fill="#ff8f00">①</text>
  <text x="200" y="185" font-size="14" font-weight="bold" fill="#1565c0">②</text>
  <text x="480" y="185" font-size="14" font-weight="bold" fill="#1565c0">③</text>

  <!-- 结论框 -->
  <rect x="30" y="50" width="200" height="160" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="130" y="80" font-size="14" font-weight="bold" fill="#212529" text-anchor="middle">📐 证明过程</text>
  <text x="130" y="110" font-size="12" fill="#333" text-anchor="middle">① 和 ② 的高相同（h₁）</text>
  <text x="130" y="135" font-size="12" fill="#333" text-anchor="middle">所以面积比 = 底边比</text>
  <text x="130" y="160" font-size="13" font-weight="bold" fill="#d6336c" text-anchor="middle">① : ② = BD : DC</text>
  <text x="130" y="190" font-size="12" fill="#333" text-anchor="middle">同理：① : ③ = BD : DC</text>
</svg>
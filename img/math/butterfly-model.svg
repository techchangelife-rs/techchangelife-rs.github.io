<svg width="700" height="250" viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowL" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d6336c"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4c83ff"/>
    </marker>
  </defs>
  <!-- 背景 -->
  <rect width="700" height="250" fill="#f8f9fa"/>
  <!-- 标题 -->
  <text x="350" y="30" font-size="18" font-weight="bold" fill="#212529" text-anchor="middle">图1：认识蝴蝶模型——四边形对角线</text>
  
  <!-- 四边形 ABCD -->
  <!-- A(100,50) B(350,80) C(300,200) D(120,180) -->
  <polygon points="100,50 350,80 300,200 120,180" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  
  <!-- 对角线 -->
  <line x1="100" y1="50" x2="300" y2="200" stroke="#d6336c" stroke-width="3"/>
  <line x1="350" y1="80" x2="120" y2="180" stroke="#d6336c" stroke-width="3"/>
  
  <!-- 顶点标注 -->
  <circle cx="100" cy="50" r="6" fill="#d6336c"/>
  <text x="85" y="40" font-size="16" font-weight="bold" fill="#d6336c">A</text>
  
  <circle cx="350" cy="80" r="6" fill="#4c83ff"/>
  <text x="360" y="75" font-size="16" font-weight="bold" fill="#4c83ff">B</text>
  
  <circle cx="300" cy="200" r="6" fill="#d6336c"/>
  <text x="310" y="215" font-size="16" font-weight="bold" fill="#d6336c">C</text>
  
  <circle cx="120" cy="180" r="6" fill="#4c83ff"/>
  <text x="100" y="195" font-size="16" font-weight="bold" fill="#4c83ff">D</text>
  
  <!-- 中心交点 O -->
  <circle cx="195" cy="120" r="6" fill="#333"/>
  <text x="205" y="115" font-size="14" font-weight="bold" fill="#333">O</text>
  
  <!-- 四个小三角形标注 -->
  <text x="170" y="100" font-size="14" fill="#d6336c" font-weight="bold">S₁</text>
  <text x="230" y="105" font-size="14" fill="#333" font-weight="bold">S₂</text>
  <text x="215" y="170" font-size="14" fill="#4c83ff" font-weight="bold">S₃</text>
  <text x="145" y="160" font-size="14" fill="#333" font-weight="bold">S₄</text>
  
  <!-- 右侧公式框 -->
  <rect x="400" y="50" width="280" height="180" rx="10" fill="#fff8e1" stroke="#ffc107" stroke-width="2"/>
  <text x="540" y="90" font-size="16" font-weight="bold" fill="#212529" text-anchor="middle">🎯 蝴蝶定理</text>
  <text x="540" y="125" font-size="14" fill="#333" text-anchor="middle">对角线把四边形分成 4 块</text>
  <text x="540" y="155" font-size="16" fill="#d6336c" text-anchor="middle" font-weight="bold">S₁ × S₃ = S₂ × S₄</text>
  <text x="540" y="190" font-size="14" fill="#333" text-anchor="middle">（对角线的两边，面积乘积相等）</text>
</svg>
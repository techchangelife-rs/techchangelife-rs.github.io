<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
    <!-- 渐变定义 -->
    <defs>
      <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#84fab0;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#8fd3f4;stop-opacity:1" />
      </linearGradient>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#ccc" />
      </marker>
    </defs>
    <!-- 点 -->
    <circle cx="50" cy="100" r="8" fill="#ff758c"/>
    <text x="50" y="140" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">点 (一粒芝麻)</text>
    
    <!-- 箭头 -->
    <path d="M 80 100 L 130 100" stroke="#ccc" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
    
    <!-- 线 -->
    <line x1="160" y1="100" x2="300" y2="100" stroke="#ff758c" stroke-width="8" stroke-linecap="round"/>
    <text x="230" y="140" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">线 (排成一溜)</text>
    
    <!-- 箭头 -->
    <path d="M 330 100 L 380 100" stroke="#ccc" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
    
    <!-- 面 -->
    <rect x="420" y="50" width="140" height="100" rx="10" fill="url(#grad1)" stroke="#333" stroke-width="2"/>
    <text x="490" y="180" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">面 (铺满一地)</text>
  </svg>
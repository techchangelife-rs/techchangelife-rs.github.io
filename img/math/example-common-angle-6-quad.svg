<svg width="500" height="280" viewBox="0 0 500 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 例16图：共角定理在四边形中的推广 -->
  <text x="10" y="20" font-size="13" fill="#666">【例16图：四边形ABCD中，对角线AC和BD交于O，三角形AOB和COD有共角吗？】</text>

  <!-- 四边形 ABCD -->
  <polygon points="150,50 350,50 420,200 80,200" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="145" y="40" font-size="14" fill="#1565c0">A</text>
  <text x="355" y="40" font-size="14" fill="#1565c0">B</text>
  <text x="430" y="208" font-size="14" fill="#1565c0">C</text>
  <text x="65" y="208" font-size="14" fill="#1565c0">D</text>

  <!-- 对角线 -->
  <line x1="150" y1="50" x2="420" y2="200" stroke="#e64980" stroke-width="2"/>
  <line x1="350" y1="50" x2="80" y2="200" stroke="#e64980" stroke-width="2"/>

  <!-- O点 -->
  <circle cx="250" cy="115" r="5" fill="#e64980"/>
  <text x="258" cy="110" font-size="13" fill="#e64980">O</text>

  <!-- 三角形AOB和COD -->
  <polygon points="150,50 350,50 250,115" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5" opacity="0.7"/>
  <polygon points="420,200 80,200 250,115" fill="#ff9a9e" stroke="#c92a6b" stroke-width="1.5" opacity="0.7"/>

  <!-- 标注 -->
  <text x="235" y="75" font-size="11" fill="#7b1fa2">△AOB</text>
  <text x="270" y="165" font-size="11" fill="#c92a6b">△COD</text>

  <!-- 分析 -->
  <path d="M 250 115 L 250 200" stroke="#868e96" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="260" y="160" font-size="11" fill="#868e96">共角？不！∠AOB≠∠COD</text>
  <text x="260" y="175" font-size="11" fill="#868e96">但∠OAB=∠OCD（平行线）</text>
  <text x="260" y="190" font-size="11" fill="#868e96">共顶角！</text>

  <!-- 结论框 -->
  <rect x="80" y="220" width="340" height="30" rx="6" fill="#fff0f6" stroke="#e64980" stroke-width="1.5"/>
  <text x="250" y="240" font-size="11" fill="#c92a6b" text-anchor="middle">共角定理拓展：∠AOB和∠COD是对顶角不相等</text>
  <text x="250" y="254" font-size="11" fill="#c92a6b" text-anchor="middle">但∠OAB和∠OCD是"平行线内错角"——可以用更复杂比例！</text>
</svg>
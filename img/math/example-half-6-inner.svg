<svg width="420" height="220" viewBox="0 0 420 220" xmlns="http://www.w3.org/2000/svg">
  <!-- 例6图：复杂图形——长方形+三角形 -->
  <text x="10" y="18" font-size="13" fill="#666">【例6图：长方形ABCD内有一点E，求阴影部分面积】</text>

  <!-- 长方形 ABCD -->
  <rect x="60" y="50" width="300" height="140" fill="none" stroke="#495057" stroke-width="2.5"/>
  <text x="50" y="60" font-size="13" fill="#495057">A</text>
  <text x="365" y="60" font-size="13" fill="#495057">B</text>
  <text x="365" y="200" font-size="13" fill="#495057">C</text>
  <text x="50" y="200" font-size="13" fill="#495057">D</text>

  <!-- E点在内部 -->
  <circle cx="210" cy="120" r="5" fill="#e64980"/>
  <text x="218" y="115" font-size="13" fill="#e64980">E</text>

  <!-- 连线：E到四个顶点 -->
  <line x1="210" y1="120" x2="60" y2="50" stroke="#e64980" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="210" y1="120" x2="360" y2="50" stroke="#e64980" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="210" y1="120" x2="360" y2="190" stroke="#e64980" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="210" y1="120" x2="60" y2="190" stroke="#e64980" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 四个三角形区域标注 -->
  <text x="130" y="90" font-size="12" fill="#1971c2">①</text>
  <text x="280" y="90" font-size="12" fill="#1971c2">②</text>
  <text x="280" y="170" font-size="12" fill="#1971c2">③</text>
  <text x="130" y="170" font-size="12" fill="#1971c2">④</text>

  <!-- 关系 -->
  <rect x="60" y="205" width="300" height="22" rx="5" fill="#e3f2fd" stroke="#1971c2" stroke-width="1.5"/>
  <text x="210" y="220" font-size="11" fill="#1971c2" text-anchor="middle">①+③ = ②+④ = S<sub>长方形</sub> ÷ 2（对角线交点性质）</text>
</svg>
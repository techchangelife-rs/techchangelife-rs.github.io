<svg width="350" height="280" viewBox="0 0 350 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="350" height="280" fill="#f8f9fa"/>
  <text x="175" y="25" font-size="16" font-weight="bold" fill="#212529" text-anchor="middle">【例2图】梯形 ABCD</text>

  <!-- 梯形 ABCD -->
  <!-- A(50,50) B(300,50) C(250,200) D(100,200) -->
  <polygon points="50,50 300,50 250,200 100,200" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <!-- 对角线 -->
  <line x1="50" y1="50" x2="250" y2="200" stroke="#d6336c" stroke-width="2"/>
  <line x1="300" y1="50" x2="100" y2="200" stroke="#d6336c" stroke-width="2"/>

  <!-- 顶点 -->
  <circle cx="50" cy="50" r="4" fill="#d6336c"/>
  <text x="40" y="40" font-size="14" font-weight="bold" fill="#d6336c">A</text>
  <circle cx="300" cy="50" r="4" fill="#4c83ff"/>
  <text x="310" y="45" font-size="14" font-weight="bold" fill="#4c83ff">B</text>
  <circle cx="250" cy="200" r="4" fill="#d6336c"/>
  <text x="260" y="215" font-size="14" font-weight="bold" fill="#d6336c">C</text>
  <circle cx="100" cy="200" r="4" fill="#4c83ff"/>
  <text x="80" y="215" font-size="14" font-weight="bold" fill="#4c83ff">D</text>

  <!-- 中心 O -->
  <circle cx="175" cy="105" r="4" fill="#333"/>
  <text x="185" y="100" font-size="12" font-weight="bold">O</text>

  <!-- 四个小三角形 -->
  <polygon points="50,50 175,105 300,50" fill="#ffcdd2"/>
  <text x="160" y="75" font-size="14" font-weight="bold" fill="#d6336c">S₁</text>

  <polygon points="300,50 175,105 250,200" fill="#c5e1a5"/>
  <text x="240" y="115" font-size="14" font-weight="bold" fill="#2e7d32">S₂</text>

  <polygon points="100,200 175,105 50,50" fill="#b3e5fc"/>
  <text x="100" y="115" font-size="14" font-weight="bold" fill="#1565c0">S₃</text>

  <polygon points="250,200 175,105 100,200" fill="#fff9c4"/>
  <text x="175" y="170" font-size="14" font-weight="bold" fill="#f57f17">S₄</text>

  <!-- 特别标注 -->
  <text x="175" y="240" font-size="13" fill="#333" text-anchor="middle">AB ∥ CD（梯形上下底平行）</text>
  <text x="175" y="260" font-size="13" font-weight="bold" fill="#d6336c" text-anchor="middle">S₁ = S₂（双胞胎蝴蝶）</text>
</svg>
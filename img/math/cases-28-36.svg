<svg width="900" height="900" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2; }
      .shadow { fill: #ff9a9e; opacity: 0.8; }
      .shadow2 { fill: #a1c4fd; opacity: 0.8; }
      .line { stroke: #343a40; stroke-width: 2; fill: none; }
      .text { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #495057; }
      .title { font-family: sans-serif; font-size: 20px; font-weight: bold; fill: #212529; }
      .dash { stroke: #343a40; stroke-width: 2; stroke-dasharray: 5,5; fill: none; }
    </style>
  </defs>
  <rect width="900" height="900" fill="#ffffff"/>

  <!-- Case 28: 半圆内的对称阴影求和 -->
  <g transform="translate(50, 50)">
    <rect width="200" height="200" class="bg" rx="10"/>
    <text x="10" y="25" class="title">题型 28</text>
    <path d="M 40 160 A 60 60 0 0 1 160 160 Z" class="line"/>
    <line x1="100" y1="100" x2="100" y2="160" class="dash"/>
    <path d="M 40 160 A 60 60 0 0 1 100 100 L 100 160 Z" class="shadow"/>
    <path d="M 100 160 L 100 100 A 60 60 0 0 1 160 160 Z" class="shadow2"/>
  </g>

  <!-- Case 29: 正方形内的四叶草阴影对称 -->
  <g transform="translate(350, 50)">
    <rect width="200" height="200" class="bg" rx="10"/>
    <text x="10" y="25" class="title">题型 29</text>
    <rect x="40" y="40" width="120" height="120" class="line"/>
    <!-- 四叶草 (四个半圆重叠) -->
    <path d="M 40 100 A 60 60 0 0 0 100 160 A 60 60 0 0 0 160 100 A 60 60 0 0 0 100 40 A 60 60 0 0 0 40 100 Z" fill="#ffffff" stroke="#343a40" stroke-width="2"/>
    <path d="M 100 100 L 100 40 A 60 60 0 0 1 160 100 Z" class="shadow"/>
    <path d="M 100 100 L 40 100 A 60 60 0 0 0 100 160 Z" class="shadow"/>
    <line x1="40" y1="40" x2="160" y2="160" class="dash"/>
    <line x1="160" y1="40" x2="40" y2="160" class="dash"/>
  </g>

  <!-- Case 30: 圆内交叉线产生的对称阴影 -->
  <g transform="translate(650, 50)">
    <rect width="200" height="200" class="bg" rx="10"/>
    <text x="10" y="25" class="title">题型 30</text>
    <circle cx="100" cy="100" r="60" class="line"/>
    <line x1="40" y1="100" x2="160" y2="100" class="dash"/>
    <line x1="100" y1="40" x2="100" y2="160" class="dash"/>
    <path d="M 100 100 L 160 100 A 60 60 0 0 0 100 40 Z" class="shadow"/>
    <path d="M 100 100 L 40 100 A 60 60 0 0 0 100 160 Z" class="shadow"/>
  </g>

  <!-- Case 31: 两个半圆重叠求橄榄形 -->
  <g transform="translate(50, 350)">
    <rect width="200" height="200" class="bg" rx="10"/>
    <text x="10" y="25" class="title">题型 31</text>
    <rect x="40" y="40" width="120" height="120" class="line"/>
    <path d="M 40 160 A 120 120 0 0 1 160 40" class="line"/>
    <path d="M 160 160 A 120 120 0 0 0 40 40" class="line"/>
    <path d="M 40 160 A 120 120 0 0 1 160 40 A 120 120 0 0 1 40 160 Z" class="shadow"/>
  </g>

  <!-- Case 32: 三个圆两两相交的公共部分 -->
  <g transform="translate(350, 350)">
    <rect width="200" height="200" class="bg" rx="10"/>
    <text x="10" y="25" class="title">题型 32</text>
    <circle cx="80" cy="90" r="40" class="line"/>
    <circle cx="120" cy="90" r="40" class="line"/>
    <circle cx="100" cy="120" r="40" class="line"/>
    <path d="M 100 70 A 40 40 0 0 0 80 110 A 40 40 0 0 0 120 110 A 40 40 0 0 0 100 70 Z" class="shadow"/>
  </g>

  <!-- Case 33: 扇形与正方形重叠部分 -->
  <g transform="translate(650, 350)">
    <rect width="200" height="200" class="bg" rx="10"/>
    <text x="10" y="25" class="title">题型 33</text>
    <rect x="40" y="40" width="120" height="120" class="line"/>
    <path d="M 40 160 L 160 160 A 120 120 0 0 0 40 40 Z" fill="none" stroke="#343a40" stroke-width="2"/>
    <path d="M 100 40 L 160 40 L 160 100 A 120 120 0 0 0 100 40 Z" class="shadow"/>
  </g>

  <!-- Case 34: 设半径平方为整体求解 -->
  <g transform="translate(50, 650)">
    <rect width="200" height="200" class="bg" rx="10"/>
    <text x="10" y="25" class="title">题型 34</text>
    <circle cx="100" cy="100" r="60" class="line"/>
    <rect x="60" y="60" width="80" height="80" class="line"/>
    <polygon points="100,100 140,100 100,60" class="shadow"/>
    <text x="100" y="180" class="text" text-anchor="middle">S = 1/2 r²</text>
  </g>

  <!-- Case 35: 设两个未知面积列方程 -->
  <g transform="translate(350, 650)">
    <rect width="200" height="200" class="bg" rx="10"/>
    <text x="10" y="25" class="title">题型 35</text>
    <rect x="40" y="60" width="120" height="80" class="line"/>
    <path d="M 40 140 A 60 60 0 0 1 160 140 Z" class="line"/>
    <path d="M 40 140 L 160 140 A 60 60 0 0 0 40 140 Z" class="shadow"/>
    <text x="100" y="110" class="text" text-anchor="middle">x</text>
    <text x="100" y="135" class="text" text-anchor="middle">y</text>
  </g>

  <!-- Case 36: 利用差不变原理求解面积差 -->
  <g transform="translate(650, 650)">
    <rect width="200" height="200" class="bg" rx="10"/>
    <text x="10" y="25" class="title">题型 36</text>
    <polygon points="40,160 160,160 40,40" class="line"/>
    <path d="M 40 160 A 120 120 0 0 0 160 40 L 40 40 Z" fill="none" stroke="#343a40" stroke-width="2"/>
    <path d="M 40 160 L 160 160 L 160 40 A 120 120 0 0 1 40 160 Z" class="shadow"/>
    <path d="M 40 160 L 160 40 L 40 40 Z" class="shadow2"/>
    <text x="100" y="185" class="text" text-anchor="middle">S₁ - S₂ = 差不变</text>
  </g>
</svg>
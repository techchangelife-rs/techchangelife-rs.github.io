<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 长方形 -->
  <rect x="50" y="50" width="300" height="100" fill="none" stroke="#333" stroke-width="2"/>
  <!-- 内部三角形 顶点在上方任意处，比如 x=150 -->
  <polygon points="50,150 350,150 150,50" fill="#ff9a9e" opacity="0.7"/>
  <!-- 滑动箭头 -->
  <path d="M 150 35 L 250 35" stroke="#d6336c" stroke-width="3" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="200" y="25" font-size="14" fill="#d6336c">顶点随便滑</text>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d6336c" />
    </marker>
  </defs>
</svg>
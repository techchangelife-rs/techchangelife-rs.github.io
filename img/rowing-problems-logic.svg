<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="300" fill="#e3f2fd" rx="10" ry="10" />
  
  <!-- River Waves -->
  <path d="M 0 200 Q 25 180 50 200 T 100 200 T 150 200 T 200 200 T 250 200 T 300 200 T 350 200 T 400 200 T 450 200 T 500 200 T 550 200 T 600 200" fill="none" stroke="#2196f3" stroke-width="2" />
  <path d="M 0 230 Q 25 210 50 230 T 100 230 T 150 230 T 200 230 T 250 230 T 300 230 T 350 230 T 400 230 T 450 230 T 500 230 T 550 230 T 600 230" fill="none" stroke="#2196f3" stroke-width="2" opacity="0.5" />
  
  <!-- Boat -->
  <path d="M 250 170 L 350 170 L 370 140 L 230 140 Z" fill="#795548" />
  <rect x="280" y="110" width="10" height="30" fill="#3e2723" />
  <path d="M 290 110 L 330 125 L 290 140 Z" fill="#dc3545" />
  
  <!-- Static Water Speed (船速) -->
  <line x1="300" y1="90" x2="360" y2="90" stroke="#795548" stroke-width="3" marker-end="url(#arrow-brown)" />
  <text x="330" y="80" font-family="Arial" font-size="14" text-anchor="middle" fill="#795548">船速 (V船)</text>
  
  <!-- Current Speed (水速) -->
  <line x1="50" y1="250" x2="150" y2="250" stroke="#2196f3" stroke-width="4" marker-end="url(#arrow-blue)" />
  <text x="100" y="280" font-family="Arial" font-size="14" text-anchor="middle" fill="#2196f3">水速 (V水)</text>
  
  <!-- Downstream Formula -->
  <rect x="400" y="20" width="180" height="60" rx="8" fill="white" stroke="#28a745" stroke-width="2" />
  <text x="490" y="45" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#28a745">顺流 (Downstream)</text>
  <text x="490" y="65" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">V顺 = V船 + V水</text>
  
  <!-- Upstream Formula -->
  <rect x="20" y="20" width="180" height="60" rx="8" fill="white" stroke="#dc3545" stroke-width="2" />
  <text x="110" y="45" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc3545">逆流 (Upstream)</text>
  <text x="110" y="65" font-family="Arial" font-size="13" text-anchor="middle" fill="#333">V逆 = V船 - V水</text>
  
  <!-- Core Relation -->
  <rect x="200" y="220" width="200" height="60" rx="8" fill="white" stroke="#ffc107" stroke-width="2" />
  <text x="300" y="240" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">V船 = (V顺 + V逆) ÷ 2</text>
  <text x="300" y="265" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">V水 = (V顺 - V逆) ÷ 2</text>
  
  <!-- Markers -->
  <defs>
    <marker id="arrow-brown" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#795548" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2196f3" />
    </marker>
  </defs>
</svg>
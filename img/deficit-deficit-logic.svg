<svg width="400" height="150" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="150" fill="#ffebee" rx="10"/>
  
  <!-- 第一种方案：亏 10 -->
  <g transform="translate(30, 30)">
    <text x="0" y="20" font-family="Arial" font-size="14" fill="#333">方案1: 缺10个</text>
    <rect x="120" y="5" width="120" height="20" fill="#ef5350" rx="5" fill-opacity="0.3" stroke="#ef5350" stroke-dasharray="2"/>
    <text x="180" y="20" font-family="Arial" font-size="12" fill="#c62828" text-anchor="middle">亏 10 (大亏)</text>
  </g>
  
  <!-- 第二种方案：亏 2 -->
  <g transform="translate(30, 70)">
    <text x="0" y="20" font-family="Arial" font-size="14" fill="#333">方案2: 缺2个</text>
    <rect x="120" y="5" width="30" height="20" fill="#ef5350" rx="5" fill-opacity="0.6" stroke="#ef5350"/>
    <text x="135" y="20" font-family="Arial" font-size="12" fill="#c62828" text-anchor="middle">亏2</text>
  </g>
  
  <!-- 逻辑连接 -->
  <path d="M 150 80 L 150 95 L 240 95 L 240 40" fill="none" stroke="#ff9800" stroke-width="2" stroke-dasharray="4"/>
  <text x="195" y="125" font-family="Arial" font-size="14" fill="#e65100" text-anchor="middle" font-weight="bold">总差额 = 10 - 2 = 8</text>
</svg>

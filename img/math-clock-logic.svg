<svg width="400" height="250" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="250" fill="#e3f2fd" rx="10"/>
  
  <text x="200" y="30" font-family="Arial" font-size="16" fill="#0d47a1" text-anchor="middle" font-weight="bold">钟表的奥秘：滴答滴答</text>
  
  <!-- 钟表 -->
  <g transform="translate(200, 130)">
    <!-- 轮廓 -->
    <circle cx="0" cy="0" r="80" fill="#fff" stroke="#0d47a1" stroke-width="4"/>
    
    <!-- 数字 -->
    <text x="0" y="-60" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">12</text>
    <text x="60" y="5" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">3</text>
    <text x="0" y="70" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">6</text>
    <text x="-60" y="5" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">9</text>
    
    <!-- 指针 -->
    <!-- 时针 (短) -->
    <line x1="0" y1="0" x2="30" y2="-20" stroke="#1976d2" stroke-width="6" stroke-linecap="round"/>
    <!-- 分针 (长) -->
    <line x1="0" y1="0" x2="0" y2="-55" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <!-- 圆心 -->
    <circle cx="0" cy="0" r="5" fill="#0d47a1"/>
  </g>
  
  <!-- 逻辑提示 -->
  <g transform="translate(300, 100)">
    <text x="0" y="0" font-family="Arial" font-size="12" fill="#1b5e20">长针：分针</text>
    <text x="0" y="20" font-family="Arial" font-size="12" fill="#1b5e20">短针：时针</text>
    <text x="0" y="50" font-family="Arial" font-size="12" fill="#d32f2f" font-weight="bold">图中是：</text>
    <text x="0" y="70" font-family="Arial" font-size="14" fill="#d32f2f" font-weight="bold">2点整 (近似)</text>
  </g>
</svg>

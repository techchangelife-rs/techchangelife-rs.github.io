<svg width="400" height="120" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="120" fill="#f0f7ff" rx="10"/>
  
  <!-- 哥哥的糖果 -->
  <text x="20" y="40" font-family="Arial" font-size="14" fill="#333">哥哥:</text>
  <g transform="translate(70, 25)">
    <circle cx="15" cy="10" r="8" fill="#FFB300"/>
    <circle cx="35" cy="10" r="8" fill="#FFB300"/>
    <circle cx="55" cy="10" r="8" fill="#FFB300"/>
    <circle cx="75" cy="10" r="8" fill="#FFB300"/>
    <circle cx="95" cy="10" r="8" fill="#FFB300"/>
    <circle cx="115" cy="10" r="8" fill="#FFB300"/>
    <!-- 多出的部分 -->
    <rect x="130" y="-5" width="85" height="30" fill="none" stroke="#D0021B" stroke-dasharray="4" rx="5"/>
    <circle cx="145" cy="10" r="8" fill="#FF7043"/>
    <circle cx="165" cy="10" r="8" fill="#FF7043"/>
    <circle cx="185" cy="10" r="8" fill="#FF7043"/>
    <circle cx="205" cy="10" r="8" fill="#FF7043"/>
    <text x="172" y="-10" font-family="Arial" font-size="12" fill="#D0021B" text-anchor="middle">多出4个</text>
  </g>
  
  <!-- 弟弟的糖果 -->
  <text x="20" y="85" font-family="Arial" font-size="14" fill="#333">弟弟:</text>
  <g transform="translate(70, 70)">
    <circle cx="15" cy="10" r="8" fill="#4CAF50"/>
    <circle cx="35" cy="10" r="8" fill="#4CAF50"/>
    <circle cx="55" cy="10" r="8" fill="#4CAF50"/>
    <circle cx="75" cy="10" r="8" fill="#4CAF50"/>
    <circle cx="95" cy="10" r="8" fill="#4CAF50"/>
    <circle cx="115" cy="10" r="8" fill="#4CAF50"/>
  </g>
</svg>

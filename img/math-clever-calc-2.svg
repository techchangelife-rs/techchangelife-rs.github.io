<svg width="400" height="150" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="150" fill="#fef2f2" rx="10"/>
  <text x="200" y="30" font-family="Arial" font-size="18" fill="#991b1b" text-anchor="middle" font-weight="bold">基准数法：寻找平均值</text>
  
  <g transform="translate(40, 60)">
    <!-- 一组接近的数 -->
    <text x="0" y="20" font-family="Arial" font-size="16" fill="#7f1d1d">98 + 102 + 97 + 103</text>
    
    <!-- 箭头 -->
    <path d="M 120 40 L 120 60" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow-red)"/>
    
    <!-- 转换 -->
    <text x="0" y="85" font-family="Arial" font-size="16" fill="#b91c1c" font-weight="bold">(100-2) + (100+2) + (100-3) + (100+3)</text>
    
    <!-- 结果 -->
    <text x="0" y="115" font-family="Arial" font-size="18" fill="#991b1b" font-weight="bold">= 100 × 4 = 400</text>
  </g>

  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b91c1c" />
    </marker>
  </defs>
</svg>

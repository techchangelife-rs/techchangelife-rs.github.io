<svg width="1200" height="1000" viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="0" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="main-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4D94;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00E5FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="1000" fill="#fdfcfb" rx="20" />
  
  <!-- Central Core -->
  <g transform="translate(600, 500)" filter="url(#glow)">
    <circle r="90" fill="url(#main-grad)" />
    <text y="-5" font-family="Arial" font-size="26" font-weight="bold" text-anchor="middle" fill="white">前端全栈</text>
    <text y="25" font-family="Arial" font-size="18" text-anchor="middle" fill="white">2026 知识体系</text>
  </g>

  <!-- Branch 1: 核心基础 -->
  <g transform="translate(300, 200)">
    <rect x="-90" y="-35" width="180" height="70" rx="15" fill="#FFD700" />
    <text y="5" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">1. 核心基础</text>
    <text x="-100" y="60" font-family="Arial" font-size="12" fill="#666" text-anchor="start">· HTML5 / CSS Next / ES2026</text>
    <text x="-100" y="80" font-family="Arial" font-size="12" fill="#666" text-anchor="start">· WebAssembly / WebGPU</text>
    <text x="-100" y="100" font-family="Arial" font-size="12" fill="#666" text-anchor="start">· TypeScript 6.x (Facts Standard)</text>
  </g>

  <!-- Branch 2: 现代框架 -->
  <g transform="translate(900, 200)">
    <rect x="-90" y="-35" width="180" height="70" rx="15" fill="#FF4D94" />
    <text y="5" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="white">2. 现代框架</text>
    <text x="-100" y="60" font-family="Arial" font-size="12" fill="#666" text-anchor="start">· React 19 (RSC / Actions)</text>
    <text x="-100" y="80" font-family="Arial" font-size="12" fill="#666" text-anchor="start">· Vue 3.5+ (Vapor / Signals)</text>
    <text x="-100" y="100" font-family="Arial" font-size="12" fill="#666" text-anchor="start">· Svelte 5 (Runes) / Solid</text>
  </g>

  <!-- Branch 3: 多端开发 -->
  <g transform="translate(150, 500)">
    <rect x="-90" y="-35" width="180" height="70" rx="15" fill="#00FFC6" />
    <text y="5" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">3. 多端开发</text>
    <text x="-100" y="60" font-family="Arial" font-size="12" fill="#666" text-anchor="start">· Uni-app / Taro (微信/支付宝)</text>
    <text x="-100" y="80" font-family="Arial" font-size="12" fill="#666" text-anchor="start">· RN New Arch / Flutter 3.x</text>
    <text x="-100" y="100" font-family="Arial" font-size="12" fill="#666" text-anchor="start">· 快应用 / Hybrid (Capacitor)</text>
  </g>

  <!-- Branch 4: 工程化工具链 -->
  <g transform="translate(1050, 500)">
    <rect x="-90" y="-35" width="180" height="70" rx="15" fill="#00E5FF" />
    <text y="5" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">4. 工程化工具</text>
    <text x="-100" y="60" font-family="Arial" font-size="12" fill="#666" text-anchor="start">· Vite 7 (Rolldown / Rust)</text>
    <text x="-100" y="80" font-family="Arial" font-size="12" fill="#666" text-anchor="start">· Biome / Oxc (Linter/Format)</text>
    <text x="-100" y="100" font-family="Arial" font-size="12" fill="#666" text-anchor="start">· Turborepo / pnpm Workspaces</text>
  </g>

  <!-- Branch 5: Node.js 与 全栈 -->
  <g transform="translate(300, 800)">
    <rect x="-90" y="-35" width="180" height="70" rx="15" fill="#FF8C00" />
    <text y="5" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="white">5. Node.js/全栈</text>
    <text x="-100" y="60" font-family="Arial" font-size="12" fill="#666" text-anchor="start">· Node.js / Bun / Deno</text>
    <text x="-100" y="80" font-family="Arial" font-size="12" fill="#666" text-anchor="start">· NestJS / Hono / Serverless</text>
    <text x="-100" y="100" font-family="Arial" font-size="12" fill="#666" text-anchor="start">· Edge Computing (WinterCG)</text>
  </g>

  <!-- Branch 6: 桌面端与 AI -->
  <g transform="translate(900, 800)">
    <rect x="-90" y="-35" width="180" height="70" rx="15" fill="#FFD700" />
    <text y="5" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">6. 桌面端 &amp; AI</text>
    <text x="-100" y="60" font-family="Arial" font-size="12" fill="#666" text-anchor="start">· Tauri 2.0 (Desktop+Mobile)</text>
    <text x="-100" y="80" font-family="Arial" font-size="12" fill="#666" text-anchor="start">· Electron / WASM Native</text>
    <text x="-100" y="100" font-family="Arial" font-size="12" fill="#666" text-anchor="start">· AI-Native UI / Agentic UI</text>
  </g>

  <!-- Connecting Lines -->
  <g stroke="#ddd" stroke-width="2" fill="none" opacity="0.6">
    <path d="M510,500 L390,235" />
    <path d="M690,500 L810,235" />
    <path d="M510,500 L240,500" />
    <path d="M690,500 L960,500" />
    <path d="M510,500 L390,765" />
    <path d="M690,500 L810,765" />
  </g>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232526"/>
      <stop offset="100%" stop-color="#414345"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffd166"/>
    </marker>
  </defs>
  <rect width="860" height="480" fill="url(#bg)" rx="24"/>
  <text x="430" y="60" fill="#ffffff" font-size="28" font-weight="bold" font-family="sans-serif" text-anchor="middle">教练工作流（示意）</text>
  <g transform="translate(70,110)" font-family="sans-serif" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="90" rx="12" fill="#264653"/>
    <text x="90" y="35" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">建班分组</text>
    <text x="90" y="60" fill="#d8f3ff" font-size="12" text-anchor="middle">按年级与水平</text>
    <rect x="210" y="0" width="180" height="90" rx="12" fill="#2a9d8f"/>
    <text x="300" y="35" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">任务下发</text>
    <text x="300" y="60" fill="#e8fff5" font-size="12" text-anchor="middle">步法 体能 眼肌</text>
    <rect x="420" y="0" width="180" height="90" rx="12" fill="#e9c46a"/>
    <text x="510" y="35" fill="#333" font-size="16" font-weight="bold" text-anchor="middle">现场打卡</text>
    <text x="510" y="60" fill="#333" font-size="12" text-anchor="middle">自动记录数据</text>
    <rect x="630" y="0" width="180" height="90" rx="12" fill="#f4a261"/>
    <text x="720" y="35" fill="#333" font-size="16" font-weight="bold" text-anchor="middle">点评与纠错</text>
    <text x="720" y="60" fill="#333" font-size="12" text-anchor="middle">视频批注</text>
    <line x1="180" y1="45" x2="210" y2="45" stroke="#ffd166" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="390" y1="45" x2="420" y2="45" stroke="#ffd166" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="600" y1="45" x2="630" y2="45" stroke="#ffd166" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <g transform="translate(70,230)" filter="url(#shadow)">
    <rect x="0" y="0" width="760" height="200" rx="16" fill="#1b1f23"/>
    <text x="380" y="32" fill="#e6edf3" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">数据看板（简化）</text>
    <g>
      <rect x="30" y="60" width="200" height="110" rx="12" fill="#0d1117" stroke="#2ea043" stroke-width="2"/>
      <text x="50" y="88" fill="#2ea043" font-size="12" font-family="sans-serif">步频提升</text>
      <rect x="50" y="100" width="160" height="10" fill="#2ea043"/>
      <rect x="50" y="112" width="120" height="10" fill="#238636"/>
      <rect x="50" y="124" width="80" height="10" fill="#196c2e"/>
      <text x="50" y="152" fill="#8b949e" font-size="10" font-family="sans-serif">近3周：+12% +7% +4%</text>
    </g>
    <g>
      <rect x="280" y="60" width="200" height="110" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
      <text x="300" y="88" fill="#58a6ff" font-size="12" font-family="sans-serif">到课率</text>
      <rect x="300" y="100" width="150" height="10" fill="#58a6ff"/>
      <text x="300" y="152" fill="#8b949e" font-size="10" font-family="sans-serif">本周 93%</text>
    </g>
    <g>
      <rect x="530" y="60" width="200" height="110" rx="12" fill="#0d1117" stroke="#d29922" stroke-width="2"/>
      <text x="550" y="88" fill="#d29922" font-size="12" font-family="sans-serif">受伤预警</text>
      <text x="550" y="110" fill="#e6edf3" font-size="11" font-family="sans-serif">心率异常：0</text>
      <text x="550" y="130" fill="#e6edf3" font-size="11" font-family="sans-serif">肌肉酸痛：1</text>
    </g>
  </g>
</svg>

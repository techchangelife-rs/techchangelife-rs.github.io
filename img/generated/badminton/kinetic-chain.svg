<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2a6c" />
      <stop offset="50%" stop-color="#b21f1f" />
      <stop offset="100%" stop-color="#fdbb2d" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff" />
    </marker>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="20"/>
  
  <text x="400" y="60" fill="#ffffff" font-size="32" font-weight="bold" font-family="sans-serif" text-anchor="middle">羽毛球杀球的「动力链」物理模型</text>
  <text x="400" y="100" fill="#ffddbb" font-size="20" font-family="sans-serif" text-anchor="middle">动量守恒定理： P = m (质量) × v (速度) = 常数</text>

  <!-- Flow steps -->
  <g transform="translate(100, 200)" font-family="sans-serif">
    <!-- Step 1: Legs -->
    <rect x="0" y="0" width="120" height="80" rx="10" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-width="2"/>
    <text x="60" y="35" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">蹬地发力</text>
    <text x="60" y="60" fill="#aaffaa" font-size="16" text-anchor="middle">质量极大</text>
    <text x="60" y="110" fill="#ffffff" font-size="14" text-anchor="middle">速度较慢</text>
    <path d="M 120 40 L 170 40" stroke="#ffffff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    
    <!-- Step 2: Waist -->
    <rect x="180" y="-20" width="120" height="100" rx="10" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="2"/>
    <text x="240" y="25" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">扭转腰腹</text>
    <text x="240" y="55" fill="#aaffaa" font-size="16" text-anchor="middle">质量较大</text>
    <text x="240" y="110" fill="#ffffff" font-size="14" text-anchor="middle">速度中等</text>
    <path d="M 300 30 L 350 30" stroke="#ffffff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <!-- Step 3: Arm -->
    <rect x="360" y="-40" width="120" height="120" rx="10" fill="#ffffff" fill-opacity="0.4" stroke="#ffffff" stroke-width="2"/>
    <text x="420" y="15" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">大臂带小臂</text>
    <text x="420" y="50" fill="#ffaaaa" font-size="16" text-anchor="middle">质量减小</text>
    <text x="420" y="110" fill="#ffffff" font-size="14" text-anchor="middle">速度加快</text>
    <path d="M 480 20 L 530 20" stroke="#ffffff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

    <!-- Step 4: Wrist/Racket -->
    <rect x="540" y="-60" width="140" height="140" rx="10" fill="#ffffff" fill-opacity="0.8" stroke="#ff3333" stroke-width="3"/>
    <text x="610" y="10" fill="#cc0000" font-size="24" font-weight="bold" text-anchor="middle">手腕内旋挥拍</text>
    <text x="610" y="45" fill="#cc0000" font-size="18" font-weight="bold" text-anchor="middle">质量极小</text>
    <text x="610" y="110" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">产生音爆级速度!</text>
  </g>

  <!-- Formula box -->
  <g transform="translate(150, 380)">
    <rect x="0" y="0" width="500" height="80" rx="15" fill="#000000" fill-opacity="0.5"/>
    <text x="250" y="35" fill="#00ffcc" font-size="22" font-family="sans-serif" text-anchor="middle">物理启示：打球不是靠蛮力，而是靠动量的无损传递！</text>
    <text x="250" y="65" fill="#ffffff" font-size="18" font-family="sans-serif" text-anchor="middle">参与质量不断减小 ➜ 末端速度呈指数级爆发</text>
  </g>
</svg>
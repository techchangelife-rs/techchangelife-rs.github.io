<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="24"/>

  <text x="400" y="70" fill="#ffffff" font-size="30" font-weight="bold" font-family="sans-serif" text-anchor="middle">接杀球的生死应用题</text>
  <text x="400" y="105" fill="#b0c7ff" font-size="18" font-family="sans-serif" text-anchor="middle">速度 = 360 km/h ≈ 100 m/s；距离 ≈ 6.7 m</text>

  <g transform="translate(120,140)">
    <rect x="0" y="0" width="560" height="90" rx="14" fill="#000000" fill-opacity="0.25" stroke="#4aa8ff" stroke-width="2"/>
    <text x="280" y="34" fill="#4aa8ff" font-size="22" font-weight="bold" font-family="sans-serif" text-anchor="middle">时间 t = s ÷ v = 6.7 ÷ 100</text>
    <text x="280" y="68" fill="#00ffd0" font-size="34" font-weight="bold" font-family="sans-serif" text-anchor="middle" filter="url(#glow)">答案：0.067 秒</text>
  </g>

  <text x="400" y="270" fill="#ff6666" font-size="26" font-weight="bold" font-family="sans-serif" text-anchor="middle">连眨眼的时间都不够！</text>
  <text x="400" y="305" fill="#ffffff" font-size="18" font-family="sans-serif" text-anchor="middle">防守站位后移 1 米 ≈ 多争取 0.01 秒的反应时间</text>

  <g transform="translate(120,340)">
    <rect x="0" y="0" width="560" height="70" rx="10" fill="#ffcc00" fill-opacity="0.16"/>
    <text x="280" y="44" fill="#ffdd77" font-size="20" font-weight="bold" font-family="sans-serif" text-anchor="middle">战术启示：迎球拦截 + 高点出手；别等球掉下来</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#38ef7d" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff" />
    </marker>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="20"/>
  
  <text x="400" y="50" fill="#ffffff" font-size="28" font-weight="bold" font-family="sans-serif" text-anchor="middle">羽毛球场上的“几何迷宫”</text>
  <text x="400" y="85" fill="#e0ffe0" font-size="18" font-family="sans-serif" text-anchor="middle">长方形、面积、周长与对角线的实战应用</text>

  <!-- Court Outline -->
  <g transform="translate(150, 120)">
    <!-- Outer Double Court (Wide and Long) -->
    <rect x="0" y="0" width="500" height="240" fill="#2ebf6b" stroke="#ffffff" stroke-width="4"/>
    <!-- Inner Single Court (Narrow and Long) -->
    <rect x="0" y="20" width="500" height="200" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="5,5"/>
    
    <!-- Net Line -->
    <line x1="250" y1="0" x2="250" y2="240" stroke="#ffffff" stroke-width="6"/>
    <rect x="246" y="-10" width="8" height="260" fill="#aaaaaa"/>
    
    <!-- Service Lines -->
    <line x1="180" y1="0" x2="180" y2="240" stroke="#ffffff" stroke-width="2"/>
    <line x1="320" y1="0" x2="320" y2="240" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Center Lines -->
    <line x1="0" y1="120" x2="180" y2="120" stroke="#ffffff" stroke-width="2"/>
    <line x1="320" y1="120" x2="500" y2="120" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Double Service Back Line -->
    <line x1="40" y1="0" x2="40" y2="240" stroke="#ffffff" stroke-width="2"/>
    <line x1="460" y1="0" x2="460" y2="240" stroke="#ffffff" stroke-width="2"/>

    <!-- Highlight Single Service Area -->
    <rect x="320" y="120" width="180" height="100" fill="#ffaa00" fill-opacity="0.4" stroke="#ffcc00" stroke-width="3"/>
    <text x="410" y="175" fill="#ffffff" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">单打发球区</text>
    <text x="410" y="195" fill="#ffffff" font-size="14" font-family="sans-serif" text-anchor="middle">“瘦长矩形”</text>

    <!-- Highlight Double Service Area -->
    <rect x="40" y="0" width="140" height="120" fill="#ff4444" fill-opacity="0.4" stroke="#ff8888" stroke-width="3"/>
    <text x="90" y="65" fill="#ffffff" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">双打发球区</text>
    <text x="90" y="85" fill="#ffffff" font-size="14" font-family="sans-serif" text-anchor="middle">“矮胖矩形”</text>

    <!-- Diagonal Line -->
    <line x1="166" y1="110" x2="40" y2="10" stroke="#ffff00" stroke-width="3" stroke-dasharray="9,4" marker-end="url(#arrow)"/>
    <text x="80" y="140" fill="#ffff00" font-size="14" font-weight="bold" font-family="sans-serif">对角线 > 边长</text>
  </g>

  <!-- Explanation -->
  <rect x="100" y="400" width="600" height="60" rx="10" fill="#000000" fill-opacity="0.3"/>
  <text x="400" y="425" fill="#ffffff" font-size="18" font-family="sans-serif" text-anchor="middle">不要死记硬背几何公式！让孩子站在球场上，</text>
  <text x="400" y="445" fill="#ffcc00" font-size="18" font-family="sans-serif" font-weight="bold" text-anchor="middle">用脚步丈量长宽，用眼睛感受对角线与面积的嵌套关系。</text>
</svg>
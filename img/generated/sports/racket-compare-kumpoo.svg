<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <rect width="800" height="400" rx="15" fill="#fdf4ff" stroke="#fbcfe8" stroke-width="2"/>
  
  <text x="400" y="40" font-family="Arial" font-size="22" font-weight="bold" fill="#be185d" text-anchor="middle">国民中端品牌推荐：薰风 (Kumpoo) 系列</text>
  <text x="400" y="65" font-family="Arial" font-size="14" fill="#db2777" text-anchor="middle">核心诉求：颜值高、性价比拉满、适合新手到进阶</text>

  <!-- Option 1: Kumpoo K520 -->
  <g transform="translate(40, 90)">
    <rect width="340" height="280" rx="10" fill="white" filter="url(#shadow)" stroke="#ec4899" stroke-width="2" />
    <rect x="0" y="0" width="340" height="40" rx="10" fill="#ec4899" />
    <text x="170" y="25" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">🌸 新手神拍：薰风 K520 (Pro版)</text>
    
    <g transform="translate(20, 60)" font-family="Arial" font-size="14" fill="#333">
      <text x="0" y="20" font-weight="bold">核心参数：</text>
      <text x="10" y="45">● 重量：4U (约82g)</text>
      <text x="10" y="70">● 拍杆硬度：偏软 (弹性极佳)</text>
      <text x="10" y="95">● 甜区设计：大方头 (容错率高)</text>
      <text x="10" y="120">● 价格：约 150-180 元</text>
      
      <text x="0" y="160" font-weight="bold" fill="#9d174d">点评：</text>
      <text x="10" y="185" fill="#831843">百元价位段的“守门员”。颜值极高，</text>
      <text x="10" y="205" fill="#831843">中杆软弹，打高远球非常省力。特别适</text>
      <text x="10" y="225" fill="#831843">合刚度过启蒙期，力量不大的孩子。</text>
    </g>
  </g>

  <!-- Option 2: Kumpoo Zhiri -->
  <g transform="translate(420, 90)">
    <rect width="340" height="280" rx="10" fill="white" filter="url(#shadow)" stroke="#8b5cf6" stroke-width="2" />
    <rect x="0" y="0" width="340" height="40" rx="10" fill="#8b5cf6" />
    <text x="170" y="25" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">🌪️ 进阶小钢炮：薰风 织日 (Zhiri)</text>
    
    <g transform="translate(20, 60)" font-family="Arial" font-size="14" fill="#333">
      <text x="0" y="20" font-weight="bold">核心参数：</text>
      <text x="10" y="45">● 重量：4U/5U可选</text>
      <text x="10" y="70">● 平衡点：偏高 (头重感明显)</text>
      <text x="10" y="95">● 中杆：6.5mm 极细中杆</text>
      <text x="10" y="120">● 价格：约 250-280 元</text>
      
      <text x="0" y="160" font-weight="bold" fill="#5b21b6">点评：</text>
      <text x="10" y="185" fill="#4c1d95">适合 9岁以上有一定基础的孩子。极细</text>
      <text x="10" y="205" fill="#4c1d95">中杆带来了更快的挥速，头重设计让后</text>
      <text x="10" y="225" fill="#4c1d95">场杀球和高远球更具压迫感。</text>
    </g>
  </g>
</svg>

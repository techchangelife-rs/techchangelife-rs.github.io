<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <rect width="800" height="400" rx="15" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  
  <text x="400" y="40" font-family="Arial" font-size="22" font-weight="bold" fill="#047857" text-anchor="middle">定型期 (6-8岁) 高性价比球拍对决</text>
  <text x="400" y="65" font-family="Arial" font-size="14" fill="#059669" text-anchor="middle">核心诉求：全碳素、轻量化(5U/6U)、细手柄(G5/G6)</text>

  <!-- Option 1 -->
  <g transform="translate(40, 90)">
    <rect width="340" height="280" rx="10" fill="white" filter="url(#shadow)" stroke="#3b82f6" stroke-width="2" />
    <rect x="0" y="0" width="340" height="40" rx="10" fill="#3b82f6" />
    <text x="170" y="25" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">🏅 综合首选：VICTOR 威克多 铁锤 (TK-HMR L)</text>
    
    <g transform="translate(20, 60)" font-family="Arial" font-size="14" fill="#333">
      <text x="0" y="20" font-weight="bold">核心参数：</text>
      <text x="10" y="45">● 重量：6U (约73g) / 5U</text>
      <text x="10" y="70">● 拍杆硬度：偏软 (容易借力)</text>
      <text x="10" y="95">● 磅数承受：最高 27 磅</text>
      <text x="10" y="120">● 价格：约 180-220 元</text>
      
      <text x="0" y="160" font-weight="bold" fill="#1d4ed8">点评：</text>
      <text x="10" y="185" fill="#1e3a8a">一代神拍“小铁锤”，6U 的重量对 7 岁孩子</text>
      <text x="10" y="205" fill="#1e3a8a">极其友好。偏软的中杆能帮助孩子在挥拍</text>
      <text x="10" y="225" fill="#1e3a8a">动作还不完善时，更容易把高远球打远。</text>
    </g>
  </g>

  <!-- Option 2 -->
  <g transform="translate(420, 90)">
    <rect width="340" height="280" rx="10" fill="white" filter="url(#shadow)" stroke="#8b5cf6" stroke-width="2" />
    <rect x="0" y="0" width="340" height="40" rx="10" fill="#8b5cf6" />
    <text x="170" y="25" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">🥈 国货之光：李宁 凯胜 (KASON) K600</text>
    
    <g transform="translate(20, 60)" font-family="Arial" font-size="14" fill="#333">
      <text x="0" y="20" font-weight="bold">核心参数：</text>
      <text x="10" y="45">● 重量：5U (约79g)</text>
      <text x="10" y="70">● 拍杆硬度：适中</text>
      <text x="10" y="95">● 平衡点：偏拍头重</text>
      <text x="10" y="120">● 价格：约 160-190 元</text>
      
      <text x="0" y="160" font-weight="bold" fill="#5b21b6">点评：</text>
      <text x="10" y="185" fill="#4c1d95">性价比极高。拍头稍重的设计带有一定</text>
      <text x="10" y="205" fill="#4c1d95">的惯性引导，适合力量稍微大一点，正处</text>
      <text x="10" y="225" fill="#4c1d95">于纠正挥拍轨迹阶段的孩子。</text>
    </g>
  </g>
</svg>

<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" rx="15" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="400" y="40" font-family="Arial" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">儿童羽毛球：年龄段进阶与训练重点</text>

  <!-- Timeline Line -->
  <line x1="100" y1="120" x2="700" y2="120" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />

  <!-- Stage 1: 4-5岁 -->
  <g transform="translate(150, 120)">
    <circle cx="0" cy="0" r="15" fill="#f59e0b" stroke="white" stroke-width="4" />
    <text x="0" y="-30" font-family="Arial" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">启蒙期 (4-5岁)</text>
    <rect x="-70" y="30" width="140" height="180" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="2" />
    <text x="0" y="60" font-family="Arial" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">目标：培养兴趣</text>
    <g font-family="Arial" font-size="12" fill="#78350f" text-anchor="middle">
      <text x="0" y="90">● 基础球感游戏</text>
      <text x="0" y="110">● 颠球/抛接球</text>
      <text x="0" y="130">● 协调性跑跳</text>
    </g>
    <rect x="-60" y="150" width="120" height="45" rx="5" fill="white" />
    <text x="0" y="168" font-family="Arial" font-size="11" fill="#92400e" text-anchor="middle">【装备建议】</text>
    <text x="0" y="185" font-family="Arial" font-size="11" fill="#92400e" text-anchor="middle">儿童短拍 (长度&lt;55cm)</text>
  </g>

  <!-- Stage 2: 6-8岁 -->
  <g transform="translate(400, 120)">
    <circle cx="0" cy="0" r="15" fill="#10b981" stroke="white" stroke-width="4" />
    <text x="0" y="-30" font-family="Arial" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">定型期 (6-8岁)</text>
    <rect x="-70" y="30" width="140" height="180" rx="8" fill="#d1fae5" stroke="#a7f3d0" stroke-width="2" />
    <text x="0" y="60" font-family="Arial" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">目标：动作规范</text>
    <g font-family="Arial" font-size="12" fill="#064e3b" text-anchor="middle">
      <text x="0" y="90">● 正确握拍法</text>
      <text x="0" y="110">● 正手高远球挥拍</text>
      <text x="0" y="130">● 基础并步/交叉步</text>
    </g>
    <rect x="-60" y="150" width="120" height="45" rx="5" fill="white" />
    <text x="0" y="168" font-family="Arial" font-size="11" fill="#065f46" text-anchor="middle">【装备建议】</text>
    <text x="0" y="185" font-family="Arial" font-size="11" fill="#065f46" text-anchor="middle">全碳素轻拍 (5U/6U)</text>
  </g>

  <!-- Stage 3: 9-12岁 -->
  <g transform="translate(650, 120)">
    <circle cx="0" cy="0" r="15" fill="#3b82f6" stroke="white" stroke-width="4" />
    <text x="0" y="-30" font-family="Arial" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">实战期 (9-12岁)</text>
    <rect x="-70" y="30" width="140" height="180" rx="8" fill="#dbeafe" stroke="#bfdbfe" stroke-width="2" />
    <text x="0" y="60" font-family="Arial" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">目标：战术与对抗</text>
    <g font-family="Arial" font-size="12" fill="#1e3a8a" text-anchor="middle">
      <text x="0" y="90">● 全场步伐连贯</text>
      <text x="0" y="110">● 杀球与吊球</text>
      <text x="0" y="130">● 比赛规则与战术</text>
    </g>
    <rect x="-60" y="150" width="120" height="45" rx="5" fill="white" />
    <text x="0" y="168" font-family="Arial" font-size="11" fill="#1e40af" text-anchor="middle">【装备建议】</text>
    <text x="0" y="185" font-family="Arial" font-size="11" fill="#1e40af" text-anchor="middle">专业防侧翻羽毛球鞋</text>
  </g>

  <!-- Alert Note -->
  <rect x="200" y="340" width="400" height="40" rx="8" fill="#fee2e2" stroke="#fca5a5" />
  <text x="400" y="365" font-family="Arial" font-size="14" fill="#991b1b" text-anchor="middle" font-weight="bold">⚠️ 避坑提醒：太早让孩子练习杀球极易导致手腕和肩袖损伤！</text>
</svg>

<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <rect width="800" height="400" rx="15" fill="url(#bgGrad)" />
  
  <!-- Badminton Elements -->
  <g transform="translate(600, 150) rotate(-45)" opacity="0.2">
    <!-- Racket -->
    <ellipse cx="0" cy="0" rx="40" ry="60" fill="none" stroke="white" stroke-width="8" />
    <line x1="0" y1="60" x2="0" y2="140" stroke="white" stroke-width="8" />
    <rect x="-10" y="140" width="20" height="40" fill="white" rx="5" />
    <!-- Grid -->
    <path d="M-20,-40 L-20,40 M0,-50 L0,50 M20,-40 L20,40 M-30,-20 L30,-20 M-35,0 L35,0 M-30,20 L30,20" stroke="white" stroke-width="2" />
  </g>

  <g transform="translate(150, 250) rotate(30)" opacity="0.3">
    <!-- Shuttlecock -->
    <path d="M-20,-40 L20,-40 L30,20 L-30,20 Z" fill="white" />
    <circle cx="0" cy="30" r="15" fill="white" />
    <line x1="-15" y1="-40" x2="0" y2="20" stroke="#f97316" stroke-width="2" />
    <line x1="0" y1="-40" x2="0" y2="20" stroke="#f97316" stroke-width="2" />
    <line x1="15" y1="-40" x2="0" y2="20" stroke="#f97316" stroke-width="2" />
  </g>

  <!-- Title & Badges -->
  <g transform="translate(400, 180)" text-anchor="middle" filter="url(#shadow)">
    <rect x="-200" y="-80" width="400" height="160" rx="15" fill="white" />
    <text x="0" y="-30" font-family="Arial" font-size="28" font-weight="bold" fill="#ea580c">儿童羽毛球黄金启蒙期</text>
    <text x="0" y="10" font-family="Arial" font-size="18" fill="#475569">分龄训练重点 × 避坑装备指南</text>
    <rect x="-60" y="35" width="120" height="30" rx="15" fill="#fef3c7" />
    <text x="0" y="55" font-family="Arial" font-size="14" font-weight="bold" fill="#b45309">家长必读</text>
  </g>
</svg>

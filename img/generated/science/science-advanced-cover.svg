<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- DNA 双螺旋 -->
  <g transform="translate(150, 200)" filter="url(#glow)">
    <path d="M-40,-100 Q 20,-50 -40,0 Q -100,50 -40,100" fill="none" stroke="#10b981" stroke-width="4" />
    <path d="M40,-100 Q -20,-50 40,0 Q 100,50 40,100" fill="none" stroke="#3b82f6" stroke-width="4" />
    <!-- 碱基对 -->
    <line x1="-30" y1="-75" x2="30" y2="-75" stroke="#fbbf24" stroke-width="3" />
    <line x1="-5" y1="-25" x2="5" y2="-25" stroke="#f43f5e" stroke-width="3" />
    <line x1="-30" y1="25" x2="30" y2="25" stroke="#fbbf24" stroke-width="3" />
    <line x1="-15" y1="75" x2="15" y2="75" stroke="#f43f5e" stroke-width="3" />
  </g>

  <!-- 电磁场 / 麦克斯韦 -->
  <g transform="translate(650, 200)" filter="url(#glow)">
    <!-- 磁感线 -->
    <ellipse cx="0" cy="0" rx="60" ry="30" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,4" />
    <ellipse cx="0" cy="0" rx="90" ry="45" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,4" />
    <!-- 螺线管/电磁铁 -->
    <path d="M -40,-20 Q -40,20 -20,20 Q -20,-20 0,-20 Q 0,20 20,20 Q 20,-20 40,-20" fill="none" stroke="#f59e0b" stroke-width="4" />
    <circle cx="0" cy="0" r="10" fill="#38bdf8" />
    <!-- 电流箭头 -->
    <path d="M -50,-20 L -60,-10 L -40,-10 Z" fill="#ef4444" />
  </g>

  <!-- 化学键 / 有机分子 -->
  <g transform="translate(400, 250)" filter="url(#glow)">
    <!-- 苯环结构 (Hexagon) -->
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="none" stroke="#06b6d4" stroke-width="4" />
    <!-- 双键交替 -->
    <line x1="-25" y1="-15" x2="0" y2="-30" stroke="#06b6d4" stroke-width="2" />
    <line x1="25" y1="15" x2="25" y2="-15" stroke="#06b6d4" stroke-width="2" />
    <line x1="-25" y1="15" x2="0" y2="30" stroke="#06b6d4" stroke-width="2" />
    <!-- 原子球 -->
    <circle cx="0" cy="-40" r="8" fill="#e2e8f0" />
    <circle cx="35" cy="-20" r="8" fill="#e2e8f0" />
    <circle cx="35" cy="20" r="8" fill="#e2e8f0" />
    <circle cx="0" cy="40" r="8" fill="#e2e8f0" />
    <circle cx="-35" cy="20" r="8" fill="#e2e8f0" />
    <circle cx="-35" cy="-20" r="8" fill="#e2e8f0" />
  </g>

  <text x="400" y="80" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">科学知识图谱 · 进阶篇</text>
  <text x="400" y="120" font-family="sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">电磁之舞 · 元素之键 · 基因之秘</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" />
  
  <!-- 原子模型 -->
  <g transform="translate(150, 200)" filter="url(#glow)">
    <circle cx="0" cy="0" r="15" fill="#ef4444" />
    <ellipse cx="0" cy="0" rx="80" ry="25" fill="none" stroke="#3b82f6" stroke-width="2" transform="rotate(30)" />
    <ellipse cx="0" cy="0" rx="80" ry="25" fill="none" stroke="#10b981" stroke-width="2" transform="rotate(-30)" />
    <ellipse cx="0" cy="0" rx="80" ry="25" fill="none" stroke="#eab308" stroke-width="2" transform="rotate(90)" />
    <circle cx="65" cy="40" r="5" fill="#60a5fa" />
    <circle cx="-65" cy="-40" r="5" fill="#34d399" />
    <circle cx="0" cy="75" r="5" fill="#fcd34d" />
  </g>

  <!-- 力学模型 (单摆) -->
  <g transform="translate(650, 100)" filter="url(#glow)">
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#94a3b8" stroke-width="4" />
    <line x1="0" y1="0" x2="-40" y2="100" stroke="#cbd5e1" stroke-width="2" />
    <line x1="0" y1="0" x2="0" y2="100" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4" />
    <circle cx="-40" cy="100" r="15" fill="#f59e0b" />
    <!-- 运动轨迹 -->
    <path d="M -40,100 Q 0,115 40,100" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2,2" />
    <path d="M -40,100 L -60,80" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" />
  </g>

  <!-- 细胞模型 -->
  <g transform="translate(400, 250)" filter="url(#glow)">
    <circle cx="0" cy="0" r="60" fill="#064e3b" stroke="#10b981" stroke-width="3" />
    <circle cx="-10" cy="-10" r="20" fill="#059669" /> <!-- 细胞核 -->
    <circle cx="-15" cy="-15" r="5" fill="#a7f3d0" /> <!-- 核仁 -->
    <!-- 线粒体 -->
    <path d="M 20,20 Q 30,10 40,20 Q 30,30 20,20" fill="#fb923c" />
    <path d="M -30,25 Q -20,15 -10,25 Q -20,35 -30,25" fill="#fb923c" />
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
  </defs>

  <text x="400" y="80" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">科学知识图谱 · 基础篇</text>
  <text x="400" y="120" font-family="sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">万物之理 · 物质之基 · 生命之源</text>
</svg>
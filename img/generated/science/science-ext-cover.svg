<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- 相对论 (时空弯曲) -->
  <g transform="translate(150, 200)">
    <!-- 网格变形 -->
    <path d="M -80,-50 Q 0,0 80,-50 M -80,0 Q 0,50 80,0 M -80,50 Q 0,100 80,50" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
    <path d="M -50,-80 Q 0,0 -50,80 M 0,-80 Q 50,0 0,80 M 50,-80 Q 100,0 50,80" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
    <!-- 星体 -->
    <circle cx="0" cy="20" r="30" fill="#fcd34d" filter="url(#neon)" />
    <!-- 引力波波纹 -->
    <ellipse cx="0" cy="20" rx="50" ry="15" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6" />
    <ellipse cx="0" cy="20" rx="70" ry="25" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.3" />
  </g>

  <!-- 量子力学 (薛定谔的猫 / 概率云) -->
  <g transform="translate(650, 200)">
    <!-- 原子核 -->
    <circle cx="0" cy="0" r="5" fill="#f87171" filter="url(#neon)" />
    <!-- 电子云概率分布 -->
    <circle cx="0" cy="0" r="40" fill="#a78bfa" opacity="0.2" filter="url(#neon)" />
    <circle cx="0" cy="0" r="60" fill="#a78bfa" opacity="0.1" filter="url(#neon)" />
    <!-- 观察者眼睛 -->
    <path d="M -20,60 Q 0,40 20,60 Q 0,80 -20,60 Z" fill="none" stroke="#2dd4bf" stroke-width="2" filter="url(#neon)"/>
    <circle cx="0" cy="60" r="6" fill="#2dd4bf" />
  </g>

  <!-- 基因编辑 (CRISPR) -->
  <g transform="translate(400, 250)">
    <!-- DNA链断裂 -->
    <path d="M -60,-20 Q -30,0 0,-20" fill="none" stroke="#10b981" stroke-width="5" />
    <path d="M 20,-30 Q 50,-50 80,-30" fill="none" stroke="#10b981" stroke-width="5" />
    <!-- 剪刀 (Cas9) -->
    <g transform="rotate(-30 0 -25)" filter="url(#neon)">
      <line x1="-15" y1="-15" x2="15" y2="15" stroke="#e2e8f0" stroke-width="4" />
      <line x1="-15" y1="15" x2="15" y2="-15" stroke="#e2e8f0" stroke-width="4" />
      <circle cx="-20" cy="-20" r="6" fill="none" stroke="#e2e8f0" stroke-width="3" />
      <circle cx="-20" cy="20" r="6" fill="none" stroke="#e2e8f0" stroke-width="3" />
      <circle cx="0" cy="0" r="3" fill="#94a3b8" />
    </g>
    <!-- 插入的新基因片段 -->
    <path d="M -10,-45 Q 5,-60 20,-45" fill="none" stroke="#f43f5e" stroke-width="5" stroke-dasharray="4,4" filter="url(#neon)" />
  </g>

  <text x="400" y="80" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">科学知识图谱 · 扩展篇</text>
  <text x="400" y="120" font-family="sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">量子之谜 · 时空之曲 · 上帝之手</text>
</svg>
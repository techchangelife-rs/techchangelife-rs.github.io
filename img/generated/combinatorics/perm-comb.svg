<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" rx="16" />
  
  <text x="400" y="50" font-family="sans-serif" font-size="28" font-weight="bold" fill="#1e293b" text-anchor="middle">排列与组合的本质区别</text>
  
  <!-- 排列区域 -->
  <g transform="translate(50, 100)">
    <rect width="320" height="250" fill="#ffffff" rx="12" filter="url(#shadow)" />
    <rect width="320" height="40" fill="#3b82f6" rx="12" />
    <!-- 修正顶部圆角 -->
    <rect width="320" height="20" y="20" fill="#3b82f6" />
    <text x="160" y="26" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">排列 (Permutation)</text>
    <text x="160" y="70" font-family="sans-serif" font-size="16" fill="#64748b" text-anchor="middle">强调：有序选取 (A排在B前面不同于B在A前面)</text>
    
    <!-- 例子 -->
    <g transform="translate(40, 100)">
      <circle cx="30" cy="30" r="25" fill="#ef4444" />
      <text x="30" y="36" font-family="sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">1</text>
      <circle cx="90" cy="30" r="25" fill="#3b82f6" />
      <text x="90" y="36" font-family="sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">2</text>
      
      <text x="150" y="36" font-family="sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">≠</text>
      
      <circle cx="210" cy="30" r="25" fill="#3b82f6" />
      <text x="210" y="36" font-family="sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">2</text>
      <circle cx="270" cy="30" r="25" fill="#ef4444" />
      <text x="270" y="36" font-family="sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">1</text>
    </g>
    
    <text x="160" y="200" font-family="sans-serif" font-size="18" fill="#1e293b" text-anchor="middle">应用场景：排队、选班委、密码</text>
  </g>

  <!-- 组合区域 -->
  <g transform="translate(430, 100)">
    <rect width="320" height="250" fill="#ffffff" rx="12" filter="url(#shadow)" />
    <rect width="320" height="40" fill="#10b981" rx="12" />
    <!-- 修正顶部圆角 -->
    <rect width="320" height="20" y="20" fill="#10b981" />
    <text x="160" y="26" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">组合 (Combination)</text>
    <text x="160" y="70" font-family="sans-serif" font-size="16" fill="#64748b" text-anchor="middle">强调：无序选取 (只要被选中，谁先谁后无所谓)</text>
    
    <!-- 例子 -->
    <g transform="translate(40, 100)">
      <circle cx="30" cy="30" r="25" fill="#ef4444" />
      <text x="30" y="36" font-family="sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">1</text>
      <circle cx="90" cy="30" r="25" fill="#3b82f6" />
      <text x="90" y="36" font-family="sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">2</text>
      
      <text x="150" y="36" font-family="sans-serif" font-size="24" fill="#10b981" text-anchor="middle">=</text>
      
      <rect x="180" y="5" width="120" height="50" rx="25" fill="#d1fae5" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
      <circle cx="210" cy="30" r="20" fill="#ef4444" />
      <circle cx="270" cy="30" r="20" fill="#3b82f6" />
      <text x="240" y="-5" font-family="sans-serif" font-size="14" fill="#059669" text-anchor="middle">打包成一组</text>
    </g>
    
    <text x="160" y="200" font-family="sans-serif" font-size="18" fill="#1e293b" text-anchor="middle">应用场景：握手、组队、抓阄</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" rx="16" />
  <text x="400" y="50" font-family="sans-serif" font-size="28" font-weight="bold" fill="#78350f" text-anchor="middle">容斥原理：多退少补的艺术</text>
  
  <rect x="50" y="80" width="700" height="280" fill="#ffffff" rx="16" filter="url(#shadow)" />

  <g transform="translate(250, 190)">
    <!-- 集合 A -->
    <circle cx="-50" cy="0" r="90" fill="#3b82f6" fill-opacity="0.3" stroke="#2563eb" stroke-width="3" />
    <text x="-90" y="-30" font-family="sans-serif" font-size="24" font-weight="bold" fill="#1d4ed8">集合 A</text>
    
    <!-- 集合 B -->
    <circle cx="50" cy="0" r="90" fill="#ef4444" fill-opacity="0.3" stroke="#dc2626" stroke-width="3" />
    <text x="90" y="-30" font-family="sans-serif" font-size="24" font-weight="bold" fill="#b91c1c">集合 B</text>

    <!-- 交集标记 -->
    <text x="0" y="10" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">A ∩ B</text>
    <text x="0" y="30" font-family="sans-serif" font-size="14" fill="#4c1d95" text-anchor="middle">(被加了两次)</text>
  </g>

  <g transform="translate(100, 310)">
    <text x="300" y="0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#b45309" text-anchor="middle">|A ∪ B| = |A| + |B| - |A ∩ B|</text>
    <text x="300" y="30" font-family="sans-serif" font-size="16" fill="#92400e" text-anchor="middle">先全部加起来，再把重叠部分减掉</text>
  </g>
</svg>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="400" rx="15" fill="url(#bgGrad)" />
  
  <!-- Digital Nodes & Connections -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.3">
    <path d="M100,100 L250,200 L400,150 L550,250 L700,100" />
    <path d="M150,300 L250,200 L300,350 L550,250 L650,350" />
  </g>
  <g fill="#0ea5e9" opacity="0.5">
    <circle cx="100" cy="100" r="4" />
    <circle cx="250" cy="200" r="6" />
    <circle cx="400" cy="150" r="5" />
    <circle cx="550" cy="250" r="7" />
    <circle cx="700" cy="100" r="4" />
    <circle cx="150" cy="300" r="5" />
    <circle cx="300" cy="350" r="4" />
    <circle cx="650" cy="350" r="5" />
  </g>

  <!-- Central "Digital Employee" Icon -->
  <g transform="translate(400, 160)" filter="url(#glow)">
    <rect x="-40" y="-30" width="80" height="60" rx="10" fill="none" stroke="#38bdf8" stroke-width="3" />
    <circle cx="-15" cy="-5" r="5" fill="#38bdf8" />
    <circle cx="15" cy="-5" r="5" fill="#38bdf8" />
    <path d="M-15,15 Q0,25 15,15" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <path d="M0,-30 L0,-45 M-10,-45 L10,-45" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Income/Tasks Badges -->
  <g transform="translate(150, 150)">
    <rect width="140" height="40" rx="8" fill="#10b981" opacity="0.2" stroke="#34d399" stroke-width="1" />
    <text x="70" y="25" font-family="Courier New" font-size="14" font-weight="bold" fill="#34d399" text-anchor="middle">+ $500 / 月</text>
  </g>
  <g transform="translate(550, 120)">
    <rect width="160" height="40" rx="8" fill="#f59e0b" opacity="0.2" stroke="#fbbf24" stroke-width="1" />
    <text x="80" y="25" font-family="Courier New" font-size="14" font-weight="bold" fill="#fbbf24" text-anchor="middle">Task: Auto-Scrape</text>
  </g>

  <!-- Title Text -->
  <text x="400" y="280" font-family="Arial" font-size="32" fill="white" text-anchor="middle" font-weight="bold">我的第一个“数字员工”</text>
  <text x="400" y="320" font-family="Arial" font-size="18" fill="#94a3b8" text-anchor="middle">普通人如何用 AI 开启自动化副业</text>
  
  <rect x="340" y="340" width="120" height="24" rx="12" fill="#38bdf8" opacity="0.2" />
  <text x="400" y="357" font-family="Arial" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="bold"># 剧本式实操</text>
</svg>

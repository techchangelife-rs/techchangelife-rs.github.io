<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="800" height="400" rx="15" fill="url(#bgGrad)" />
  
  <!-- Math Elements Background -->
  <g fill="white" opacity="0.1" font-family="Times New Roman" font-size="30" font-weight="bold">
    <text x="50" y="80">∑</text>
    <text x="150" y="300">π</text>
    <text x="700" y="100">√</text>
    <text x="650" y="350">∫</text>
    <text x="350" y="60">x² + y² = z²</text>
    <text x="100" y="200">E = mc²</text>
  </g>

  <!-- Central AI Brain/Robot -->
  <g transform="translate(400, 200)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="70" fill="white" />
    <path d="M-30,-20 Q0,-50 30,-20 Q50,10 30,40 Q0,70 -30,40 Q-50,10 -30,-20 Z" fill="#4f46e5" />
    <!-- Eyes -->
    <circle cx="-15" cy="5" r="8" fill="white" />
    <circle cx="15" cy="5" r="8" fill="white" />
    <!-- Graduation Cap -->
    <path d="M-50,-40 L0,-70 L50,-40 L0,-10 Z" fill="#1e1b4b" />
    <path d="M0,-10 L0,20" stroke="#1e1b4b" stroke-width="3" />
    <circle cx="0" cy="20" r="4" fill="#fbbf24" />
  </g>

  <!-- Prompt Bubbles -->
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <rect width="180" height="60" rx="10" fill="white" />
    <text x="90" y="35" font-family="Arial" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">“用画图法解释</text>
    <text x="90" y="52" font-family="Arial" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">鸡兔同笼问题”</text>
  </g>

  <g transform="translate(520, 240)" filter="url(#shadow)">
    <rect width="200" height="60" rx="10" fill="white" />
    <text x="100" y="35" font-family="Arial" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">“生成3道同类型</text>
    <text x="100" y="52" font-family="Arial" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">行程问题练习题”</text>
  </g>

  <!-- Title Text -->
  <text x="400" y="360" font-family="Arial" font-size="32" fill="white" text-anchor="middle" font-weight="bold">AI 时代：你的专属 24H 奥数家教</text>
</svg>

<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="15" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#1e293b" text-anchor="middle">Workbuddy 微信操控：安全与权限边界</text>

  <!-- Left Side: CAN DO -->
  <g transform="translate(50, 80)">
    <rect width="330" height="380" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
    <text x="165" y="40" font-family="Arial" font-size="20" font-weight="bold" fill="#065f46" text-anchor="middle">✅ 支持的功能 (开发者能力)</text>
    
    <g transform="translate(30, 80)" font-family="Arial" font-size="16" fill="#065f46">
      <text x="0" y="0">● 微信小程序/公众号开发辅助</text>
      <text x="0" y="40">● 微信支付/云开发集成调试</text>
      <text x="0" y="80">● 远程操控桌面 AI 执行任务</text>
      <text x="0" y="120">● 自动化生成文件 (PDF/MD)</text>
      <text x="0" y="160">● 实时代码重构与部署指令</text>
    </g>
    
    <rect x="30" y="280" width="270" height="70" rx="8" fill="#ffffff" stroke="#10b981" stroke-dasharray="4 2" />
    <text x="165" y="310" font-family="Arial" font-size="14" fill="#059669" text-anchor="middle" font-weight="bold">核心逻辑：以微信为入口</text>
    <text x="165" y="330" font-family="Arial" font-size="14" fill="#059669" text-anchor="middle">远程操控桌面端 OpenClaw</text>
  </g>

  <!-- Right Side: CANNOT DO -->
  <g transform="translate(420, 80)">
    <rect width="330" height="380" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
    <text x="165" y="40" font-family="Arial" font-size="20" font-weight="bold" fill="#991b1b" text-anchor="middle">❌ 严禁项 (隐私安全隔离)</text>
    
    <g transform="translate(30, 80)" font-family="Arial" font-size="16" fill="#991b1b">
      <text x="0" y="0">● 登录或操控您的微信账号</text>
      <text x="0" y="40">● 读取私人聊天记录/通讯录</text>
      <text x="0" y="80">● 主动给微信联系人发消息</text>
      <text x="0" y="120">● 获取任何支付/账号密码</text>
      <text x="0" y="160">● 绕过微信官方安全验证</text>
    </g>
    
    <rect x="30" y="280" width="270" height="70" rx="8" fill="#ffffff" stroke="#ef4444" stroke-dasharray="4 2" />
    <text x="165" y="310" font-family="Arial" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="bold">安全承诺：严格权限隔离</text>
    <text x="165" y="330" font-family="Arial" font-size="14" fill="#dc2626" text-anchor="middle">非微信官方授权操作一律禁止</text>
  </g>
</svg>

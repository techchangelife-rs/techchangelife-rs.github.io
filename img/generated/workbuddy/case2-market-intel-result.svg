<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="15" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Excel-like Header -->
  <rect width="800" height="40" rx="15" ry="0" fill="#217346" />
  <text x="400" y="25" font-family="Arial" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Market_Intelligence_AI_Agents.xlsx</text>

  <!-- Spreadsheet Grid -->
  <g transform="translate(40, 60)">
    <!-- Header Row -->
    <rect width="720" height="40" fill="#f3f4f6" stroke="#e5e7eb" />
    <g font-family="Arial" font-size="14" font-weight="bold" fill="#333">
      <text x="20" y="25">Framework</text>
      <text x="180" y="25">Protocol</text>
      <text x="340" y="25">Core Reasoning</text>
      <text x="500" y="25">Multi-Agent Support</text>
      <text x="660" y="25">Status</text>
    </g>

    <!-- Row 1 -->
    <rect y="40" width="720" height="40" fill="white" stroke="#e5e7eb" />
    <g font-family="Arial" font-size="13" fill="#4b5563">
      <text x="20" y="65" font-weight="bold" fill="#07C160">OpenClaw (Lobster)</text>
      <text x="180" y="65">SOUL / MCP</text>
      <text x="340" y="65">Dynamic SOUL Agentic</text>
      <text x="500" y="65">Native (Hierarchical)</text>
      <text x="660" y="65">Production</text>
    </g>

    <!-- Row 2 -->
    <rect y="80" width="720" height="40" fill="#f9fafb" stroke="#e5e7eb" />
    <g font-family="Arial" font-size="13" fill="#4b5563">
      <text x="20" y="105">LangGraph 2.0</text>
      <text x="180" y="105">Custom (Graph-based)</text>
      <text x="340" y="105">Stateful Cyclic Graphs</text>
      <text x="500" y="105">Excellent</text>
      <text x="660" y="105">Beta</text>
    </g>

    <!-- Row 3 -->
    <rect y="120" width="720" height="40" fill="white" stroke="#e5e7eb" />
    <g font-family="Arial" font-size="13" fill="#4b5563">
      <text x="20" y="145">AutoGPT 2.0</text>
      <text x="180" y="145">REST / WebSockets</text>
      <text x="340" y="145">Task Decomposition</text>
      <text x="500" y="145">Supported</text>
      <text x="660" y="145">Released</text>
    </g>
  </g>

  <!-- Summary Card -->
  <g transform="translate(100, 320)">
    <rect width="600" height="140" rx="10" fill="#ffffff" filter="url(#shadow)" stroke="#07C160" stroke-width="2" />
    <text x="30" y="35" font-family="Arial" font-size="18" font-weight="bold" fill="#07C160">Intelligence Insight Summary</text>
    <text x="30" y="65" font-family="Arial" font-size="14" fill="#333">
      <tspan x="30" dy="1.2em">● OpenClaw 凭借其原生分层多代理支持在生产环境中表现最稳。</tspan>
      <tspan x="30" dy="1.5em">● LangGraph 2.0 在复杂状态管理方面具有显著优势，但学习曲线较高。</tspan>
      <tspan x="30" dy="1.5em">● 市场趋势：Agentic 正在从单一指令向复杂、自主的执行链条演进。</tspan>
    </text>
  </g>

  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-opacity="0.1"/>
    </filter>
  </defs>
</svg>

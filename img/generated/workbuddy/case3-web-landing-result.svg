<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="700" rx="20" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
  
  <!-- Browser Frame -->
  <rect width="1000" height="40" rx="20" ry="0" fill="#f3f4f6" />
  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#27c93f"/>

  <!-- Landing Page Content -->
  <g transform="translate(0, 40)">
    <!-- Header -->
    <rect width="1000" height="80" fill="white" />
    <text x="50" y="50" font-family="Arial" font-size="24" font-weight="bold" fill="#6d4c41">CoffeeBuddy</text>
    <g font-family="Arial" font-size="16" fill="#4b5563">
      <text x="700" y="48">Plans</text>
      <text x="800" y="48">About</text>
      <text x="900" y="48">Contact</text>
    </g>

    <!-- Hero -->
    <rect y="80" width="1000" height="300" fill="#efebe9" />
    <text x="500" y="180" font-family="Arial" font-size="48" font-weight="bold" fill="#3e2723" text-anchor="middle">Freshly Roasted, Delivered to Your Door.</text>
    <text x="500" y="230" font-family="Arial" font-size="20" fill="#6d4c41" text-anchor="middle">Premium Coffee Subscriptions for the Modern Minimalist.</text>
    <rect x="425" y="280" width="150" height="50" rx="25" fill="#6d4c41" />
    <text x="500" y="312" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Subscribe Now</text>

    <!-- Pricing / Plans Section -->
    <g transform="translate(100, 400)">
      <text x="400" y="40" font-family="Arial" font-size="28" font-weight="bold" fill="#3e2723" text-anchor="middle">Subscription Plans</text>
      
      <!-- Plan Cards -->
      <g transform="translate(0, 80)">
        <rect width="220" height="180" rx="10" fill="white" stroke="#d7ccc8" />
        <text x="110" y="40" font-family="Arial" font-size="18" font-weight="bold" fill="#6d4c41" text-anchor="middle">The Explorer</text>
        <text x="110" y="80" font-family="Arial" font-size="24" font-weight="bold" fill="#3e2723" text-anchor="middle">$19/mo</text>
        <text x="110" y="120" font-family="Arial" font-size="14" fill="#8d6e63" text-anchor="middle">2 Roasts per month</text>
      </g>
      <g transform="translate(260, 80)">
        <rect width="220" height="180" rx="10" fill="white" stroke="#6d4c41" stroke-width="2" />
        <text x="110" y="40" font-family="Arial" font-size="18" font-weight="bold" fill="#6d4c41" text-anchor="middle">The Aficionado</text>
        <text x="110" y="80" font-family="Arial" font-size="24" font-weight="bold" fill="#3e2723" text-anchor="middle">$35/mo</text>
        <text x="110" y="120" font-family="Arial" font-size="14" fill="#8d6e63" text-anchor="middle">4 Roasts per month</text>
        <rect x="50" y="140" width="120" height="25" rx="12" fill="#6d4c41" />
        <text x="110" y="157" font-family="Arial" font-size="12" fill="white" text-anchor="middle">MOST POPULAR</text>
      </g>
      <g transform="translate(520, 80)">
        <rect width="220" height="180" rx="10" fill="white" stroke="#d7ccc8" />
        <text x="110" y="40" font-family="Arial" font-size="18" font-weight="bold" fill="#6d4c41" text-anchor="middle">The Roaster Master</text>
        <text x="110" y="80" font-family="Arial" font-size="24" font-weight="bold" fill="#3e2723" text-anchor="middle">$60/mo</text>
        <text x="110" y="120" font-family="Arial" font-size="14" fill="#8d6e63" text-anchor="middle">8 Roasts per month</text>
      </g>
    </g>
  </g>

  <!-- Mobile Preview & QR Code Layer -->
  <g transform="translate(750, 450)">
    <rect width="220" height="220" rx="15" fill="#ffffff" filter="url(#shadow)" stroke="#e2e8f0" />
    <text x="110" y="35" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Live Preview Link</text>
    
    <!-- QR Code Simulated -->
    <g transform="translate(50, 50)">
      <rect width="120" height="120" fill="#333" rx="4" />
      <rect x="10" y="10" width="30" height="30" fill="white" />
      <rect x="80" y="10" width="30" height="30" fill="white" />
      <rect x="10" y="80" width="30" height="30" fill="white" />
      <rect x="20" y="20" width="10" height="10" fill="#333" />
      <rect x="90" y="20" width="10" height="10" fill="#333" />
      <rect x="20" y="90" width="10" height="10" fill="#333" />
    </g>
    <text x="110" y="200" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">Scan to View on Mobile</text>
  </g>

  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-opacity="0.1"/>
    </filter>
  </defs>
</svg>

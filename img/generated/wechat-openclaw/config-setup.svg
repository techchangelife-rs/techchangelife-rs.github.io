<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#f5f5f5" rx="15" />
  <rect x="150" y="40" width="300" height="320" rx="10" fill="white" stroke="#eee" stroke-width="2" />
  
  <!-- Setup Title -->
  <text x="300" y="80" font-family="Arial" font-size="20" fill="#333" text-anchor="middle" font-weight="bold">微信插件配置</text>
  <text x="300" y="110" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">请扫描下方二维码完成登录</text>
  
  <!-- QR Code Simulation -->
  <g transform="translate(200, 140)">
    <rect width="200" height="200" fill="white" stroke="#ccc" />
    <rect x="20" y="20" width="40" height="40" fill="#07C160" />
    <rect x="140" y="20" width="40" height="40" fill="#07C160" />
    <rect x="20" y="140" width="40" height="40" fill="#07C160" />
    
    <!-- Random Squares -->
    <rect x="70" y="30" width="20" height="20" fill="#333" />
    <rect x="110" y="50" width="20" height="20" fill="#333" />
    <rect x="30" y="70" width="20" height="20" fill="#333" />
    <rect x="90" y="90" width="40" height="40" fill="#333" />
    <rect x="150" y="110" width="20" height="20" fill="#333" />
    <rect x="50" y="150" width="20" height="20" fill="#333" />
    <rect x="130" y="150" width="40" height="20" fill="#333" />
  </g>
  
  <!-- Success Badge -->
  <g transform="translate(450, 50)" opacity="0.9">
    <circle cx="20" cy="20" r="15" fill="#07C160" />
    <path d="M12,20 L18,26 L28,16" stroke="white" stroke-width="3" fill="none" />
    <text x="40" y="25" font-family="Arial" font-size="14" fill="#07C160" font-weight="bold">配置成功</text>
  </g>
  
  <!-- Steps -->
  <g transform="translate(50, 150)">
    <circle cx="20" cy="20" r="15" fill="#eee" />
    <text x="20" y="25" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">1</text>
    <line x1="20" y1="35" x2="20" y2="100" stroke="#eee" stroke-width="2" />
    
    <circle cx="20" cy="115" r="15" fill="#07C160" />
    <text x="20" y="120" font-family="Arial" font-size="14" fill="white" text-anchor="middle">2</text>
  </g>
</svg>

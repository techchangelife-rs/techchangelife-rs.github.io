<svg width="600" height="500" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="500" fill="#f5f5f5" rx="15" />
  <rect width="600" height="60" fill="#07C160" rx="15" ry="0" />
  <text x="300" y="40" font-family="Arial" font-size="20" fill="white" text-anchor="middle" font-weight="bold">AI助手 - OpenClaw</text>
  
  <!-- User Voice Bubble -->
  <g transform="translate(400, 100)">
    <path d="M0,0 H160 Q170,0 170,10 V30 Q170,40 160,40 H10 L-10,40 L0,30 Z" fill="#95ec69" />
    <path d="M20,20 H60 M20,15 H50 M20,25 H45" stroke="#333" stroke-width="2" stroke-linecap="round" />
    <text x="80" y="25" font-family="Arial" font-size="14" fill="#333">12"</text>
  </g>
  <circle cx="585" cy="120" r="15" fill="#ccc" />
  
  <!-- AI Response Bubble -->
  <g transform="translate(35, 180)">
    <path d="M0,0 H300 Q310,0 310,10 V150 Q310,160 300,160 H10 L-10,160 L0,150 Z" fill="white" />
    <text x="20" y="30" font-family="Arial" font-size="16" fill="#333" font-weight="bold">AI 助手已接收指令</text>
    <text x="20" y="60" font-family="Arial" font-size="14" fill="#666">
      <tspan x="20" dy="1.2em">您好！我是您的 OpenClaw 助手。</tspan>
      <tspan x="20" dy="1.2em">我已收到您的语音指令：“帮我查</tspan>
      <tspan x="20" dy="1.2em">看下周的竞品动态。”</tspan>
      <tspan x="20" dy="1.5em">正在为您检索并整理中，请稍后...</tspan>
    </text>
  </g>
  <circle cx="15" cy="200" r="15" fill="#07C160" />
  
  <!-- WeChat Input Bar -->
  <rect x="0" y="440" width="600" height="60" fill="white" />
  <circle cx="30" cy="470" r="15" fill="none" stroke="#ccc" stroke-width="2" />
  <rect x="60" y="455" width="450" height="30" rx="5" fill="#f5f5f5" stroke="#ccc" />
  <circle cx="540" cy="470" r="15" fill="none" stroke="#ccc" stroke-width="2" />
  <circle cx="575" cy="470" r="15" fill="none" stroke="#ccc" stroke-width="2" />
</svg>

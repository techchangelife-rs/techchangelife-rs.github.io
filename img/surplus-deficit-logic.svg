<svg width="400" height="150" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="150" fill="#fff9c4" rx="10"/>
  
  <!-- 第一种方案：盈 -->
  <g transform="translate(30, 30)">
    <text x="0" y="20" font-family="Arial" font-size="14" fill="#333">方案1: 每人3个</text>
    <rect x="120" y="5" width="100" height="20" fill="#4caf50" rx="5"/>
    <text x="170" y="20" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle">多出 5 个 (盈)</text>
  </g>
  
  <!-- 第二种方案：亏 -->
  <g transform="translate(30, 70)">
    <text x="0" y="20" font-family="Arial" font-size="14" fill="#333">方案2: 每人5个</text>
    <rect x="120" y="5" width="100" height="20" fill="#f44336" rx="5"/>
    <text x="170" y="20" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle">缺少 3 个 (亏)</text>
  </g>
  
  <!-- 逻辑连接 -->
  <path d="M 230 40 L 250 40 L 250 80 L 230 80" fill="none" stroke="#ff9800" stroke-width="2"/>
  <text x="320" y="65" font-family="Arial" font-size="14" fill="#e65100" text-anchor="middle" font-weight="bold">总差额 = 5 + 3 = 8</text>
</svg>

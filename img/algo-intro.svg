<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" fill="#f0f5ff" rx="10"/>
  
  <!-- Axis -->
  <line x1="40" y1="160" x2="360" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrow-black)"/>
  <text x="350" y="180" font-family="Arial" font-size="12" fill="#333">数据量 n</text>
  
  <line x1="50" y1="170" x2="50" y2="30" stroke="#333" stroke-width="2" marker-end="url(#arrow-black)"/>
  <text x="30" y="40" font-family="Arial" font-size="12" fill="#333" writing-mode="vertical-rl">时间</text>
  
  <!-- Curves -->
  <path d="M 50 160 L 340 160" stroke="#52c41a" stroke-width="2" fill="none"/>
  <text x="345" y="155" font-family="Arial" font-size="10" fill="#52c41a">O(1)</text>
  
  <path d="M 50 160 Q 200 150 340 120" stroke="#1890ff" stroke-width="2" fill="none"/>
  <text x="345" y="115" font-family="Arial" font-size="10" fill="#1890ff">O(log n)</text>
  
  <path d="M 50 160 L 340 40" stroke="#faad14" stroke-width="2" fill="none"/>
  <text x="345" y="35" font-family="Arial" font-size="10" fill="#faad14">O(n)</text>
  
  <path d="M 50 160 Q 100 150 150 40" stroke="#f5222d" stroke-width="2" fill="none"/>
  <text x="155" y="35" font-family="Arial" font-size="10" fill="#f5222d">O(n²)</text>

  <defs>
    <marker id="arrow-black" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
</svg>

<svg width="400" height="220" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="220" fill="#f8fafc" rx="10"/>
  <text x="200" y="30" font-family="Arial" font-size="18" fill="#1e293b" text-anchor="middle" font-weight="bold">图形矩阵：行列规律</text>
  
  <!-- 3x3 矩阵 -->
  <g transform="translate(100, 50)">
    <!-- 第一行 -->
    <circle cx="20" cy="20" r="15" fill="#3b82f6" opacity="0.8"/>
    <rect x="65" y="5" width="30" height="30" fill="#3b82f6" opacity="0.8"/>
    <path d="M 125 5 L 110 35 L 140 35 Z" fill="#3b82f6" opacity="0.8"/>
    
    <!-- 第二行 -->
    <rect x="5" y="55" width="30" height="30" fill="#ef4444" opacity="0.8"/>
    <path d="M 80 55 L 65 85 L 95 85 Z" fill="#ef4444" opacity="0.8"/>
    <circle cx="125" cy="70" r="15" fill="#ef4444" opacity="0.8"/>
    
    <!-- 第三行 -->
    <path d="M 20 105 L 5 135 L 35 135 Z" fill="#10b981" opacity="0.8"/>
    <circle cx="80" cy="120" r="15" fill="#10b981" opacity="0.8"/>
    <!-- 缺口 -->
    <rect x="110" y="105" width="30" height="30" fill="none" stroke="#94a3b8" stroke-dasharray="4"/>
    <text x="125" y="125" font-family="Arial" font-size="20" fill="#94a3b8" text-anchor="middle">?</text>
  </g>
  
  <text x="200" y="200" font-family="Arial" font-size="14" fill="#475569" font-weight="bold">规律：每一行都有圆、方、三角</text>
</svg>

<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="200" fill="#fff7e6" rx="10" ry="10"/>
  
  <!-- Base Line -->
  <line x1="50" y1="100" x2="350" y2="100" stroke="#333" stroke-width="2"/>
  <text x="200" y="90" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">标准分配量</text>
  
  <!-- Surplus (盈) -->
  <path d="M 200 100 L 280 100" stroke="#52c41a" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <text x="240" y="120" font-family="Arial" font-size="12" fill="#237804" text-anchor="middle">盈 (+)</text>
  
  <!-- Deficit (亏) -->
  <path d="M 120 100 L 200 100" stroke="#f5222d" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <text x="160" y="120" font-family="Arial" font-size="12" fill="#a8071a" text-anchor="middle">亏 (-)</text>
  
  <!-- Total Gap Indicator -->
  <path d="M 120 130 L 120 150 M 280 130 L 280 150" stroke="#333" stroke-width="1"/>
  <line x1="120" y1="140" x2="280" y2="140" stroke="#333" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="200" y="160" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">总差额 = 盈 + 亏</text>
  
  <!-- Summary -->
  <text x="200" y="185" font-family="Arial" font-size="12" fill="#8c8c8c" text-anchor="middle">
    异号相加 (盈亏)，同号相减 (盈盈/亏亏)
  </text>
</svg>

<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" fill="#fff5f5" rx="10"/>
  
  <text x="200" y="30" font-family="Arial" font-size="16" fill="#c92a2a" text-anchor="middle" font-weight="bold">生活中的数学：处处有智慧</text>
  
  <!-- 购物 -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="100" height="80" fill="#ffc9c9" rx="5"/>
    <text x="50" y="30" font-family="Arial" font-size="14" fill="#a61e1e" text-anchor="middle">买东西</text>
    <rect x="20" y="45" width="60" height="20" fill="#fff" rx="3" stroke="#a61e1e"/>
    <text x="50" y="60" font-family="Arial" font-size="12" fill="#a61e1e" text-anchor="middle">¥ 5 + ¥ 3 = ?</text>
  </g>
  
  <!-- 切披萨 -->
  <g transform="translate(180, 100)">
    <circle cx="0" cy="0" r="40" fill="#ffe066" stroke="#f08c00" stroke-width="2"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#f08c00" stroke-width="1"/>
    <line x1="0" y1="-40" x2="0" y2="40" stroke="#f08c00" stroke-width="1"/>
    <text x="0" y="55" font-family="Arial" font-size="12" fill="#868e96" text-anchor="middle">分披萨 (分数)</text>
  </g>
  
  <!-- 爬楼梯 -->
  <g transform="translate(280, 60)">
    <path d="M 0 80 L 20 80 L 20 60 L 40 60 L 40 40 L 60 40 L 60 20 L 80 20" fill="none" stroke="#495057" stroke-width="3"/>
    <text x="40" y="100" font-family="Arial" font-size="12" fill="#868e96" text-anchor="middle">爬楼梯 (间隔)</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <!-- Background -->
  <rect width="600" height="450" fill="#f8fafc" />
  
  <!-- Title -->
  <text x="300" y="40" font-family="Arial" font-size="24" text-anchor="middle" fill="#334155" font-weight="bold">直线型面积：切割与平移</text>
  
  <!-- Method 1: Cutting (分割法) -->
  <g transform="translate(50, 80)">
    <text x="0" y="0" font-family="Arial" font-size="18" fill="#0f172a" font-weight="bold">方法一：分割法 (L型图形)</text>
    
    <!-- L Shape -->
    <path d="M20,30 L100,30 L100,70 L60,70 L60,110 L20,110 Z" fill="#94a3b8" stroke="#334155" stroke-width="2" />
    <line x1="60" y1="30" x2="60" y2="70" stroke="#e11d48" stroke-width="2" stroke-dasharray="4" />
    
    <text x="40" y="55" text-anchor="middle" fill="#fff" font-size="14">S1</text>
    <text x="80" y="55" text-anchor="middle" fill="#fff" font-size="14">S2</text>
    
    <text x="120" y="70" font-size="14" fill="#334155">总面积 = S1 + S2</text>
  </g>
  
  <!-- Method 2: Subtraction (补漏法) -->
  <g transform="translate(320, 80)">
    <text x="0" y="0" font-family="Arial" font-size="18" fill="#0f172a" font-weight="bold">方法二：补漏法</text>
    
    <!-- Big Rect with a small one missing -->
    <rect x="20" y="30" width="100" height="80" fill="#cbd5e1" stroke="#334155" stroke-width="2" stroke-dasharray="4" />
    <path d="M20,30 L120,30 L120,110 L60,110 L60,70 L20,70 Z" fill="#94a3b8" stroke="#334155" stroke-width="2" />
    
    <text x="90" y="90" text-anchor="middle" fill="#e11d48" font-size="12">补全</text>
    <text x="130" y="70" font-size="14" fill="#334155">总面积 = 大长方形 - 缺口</text>
  </g>

  <!-- Method 3: Parallel Shift (平移法) -->
  <g transform="translate(50, 240)">
    <text x="0" y="0" font-family="Arial" font-size="18" fill="#0f172a" font-weight="bold">方法三：平移法 (求周长/面积技巧)</text>
    
    <!-- Stairs -->
    <path d="M20,30 L60,30 L60,60 L100,60 L100,90 L140,90 L140,120 L20,120 Z" fill="#94a3b8" stroke="#334155" stroke-width="2" />
    
    <!-- Arrows for translation -->
    <path d="M60,30 L60,10" stroke="#e11d48" stroke-width="2" marker-end="url(#arrow-red)" />
    <path d="M100,60 L100,10" stroke="#e11d48" stroke-width="2" marker-end="url(#arrow-red)" />
    <path d="M140,90 L140,10" stroke="#e11d48" stroke-width="2" marker-end="url(#arrow-red)" />
    
    <text x="160" y="75" font-size="14" fill="#334155">楼梯形周长平移后</text>
    <text x="160" y="95" font-size="14" fill="#334155">等于大长方形周长</text>
  </g>

  <!-- Definitions -->
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#e11d48" />
    </marker>
  </defs>
</svg>

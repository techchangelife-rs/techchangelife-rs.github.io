<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" fill="#fffaf0" rx="10"/>
  <text x="200" y="30" font-family="Courier New, monospace" font-size="18" fill="#744210" text-anchor="middle" font-weight="bold">加法竖式：进位的秘密</text>
  
  <g transform="translate(150, 60)">
    <!-- 竖式文字 -->
    <text x="40" y="20" font-family="Courier New, monospace" font-size="24" fill="#333" text-anchor="end">4 8</text>
    <text x="0" y="50" font-family="Courier New, monospace" font-size="24" fill="#333">+</text>
    <text x="40" y="50" font-family="Courier New, monospace" font-size="24" fill="#333" text-anchor="end">3 5</text>
    <line x1="-10" y1="65" x2="50" y2="65" stroke="#333" stroke-width="2"/>
    <text x="40" y="95" font-family="Courier New, monospace" font-size="24" fill="#333" text-anchor="end">8 3</text>
    
    <!-- 进位标注 -->
    <circle cx="15" cy="60" r="8" fill="#f6ad55" opacity="0.8"/>
    <text x="15" y="64" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle">1</text>
    
    <!-- 指引 -->
    <path d="M 60 15 Q 90 40 60 90" fill="none" stroke="#dd6b20" stroke-width="1" stroke-dasharray="3"/>
    <text x="100" y="55" font-family="Arial" font-size="12" fill="#dd6b20">个位满十进一</text>
  </g>
</svg>
